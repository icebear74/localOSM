# Default configuration for storage-perf-tester.
#
# This file is sourced by bin/storage-perf-tester.sh. Every value can be
# overridden on the command line (see `--help`) or via an environment
# variable of the same name exported before invoking the script.
#
# IMPORTANT: the defaults below are intentionally conservative (small PVCs,
# short durations, low parallelism) so that a first run on a shared/test
# cluster does not consume excessive storage, CPU or time. Review the
# "Kosten- und Sicherheitshinweise" section in README.md before raising them.

# Namespace the tool creates/uses for all of its own resources. Must not be
# a namespace used by other workloads (defaults to a dedicated namespace so
# this tool never touches existing OSM deployments).
: "${NAMESPACE:=storage-perf-test}"

# Comma separated list of StorageClass names to test. Leave empty to
# auto-discover every StorageClass known to the cluster via
# `kubectl get storageclass`.
: "${STORAGECLASSES:=}"

# Comma separated list of StorageClass names to always skip, even when
# auto-discovering (e.g. a local-path class you never want load-tested).
: "${EXCLUDE_STORAGECLASSES:=}"

# Size of the PVC created per StorageClass/workload run.
: "${PVC_SIZE:=5Gi}"

# Runtime (seconds) for each fio-based measurement phase.
: "${DURATION:=30}"

# Size of the file(s) used by the large-file and mixed workloads.
: "${FILE_SIZE:=1Gi}"

# Comma separated list of queue depths / thread counts to test for every
# workload (fio iodepth+numjobs, pgbench -c/-j, ...).
: "${QUEUE_DEPTHS:=1,4,8}"

# Number of times each (workload, queue-depth) combination is repeated.
: "${REPEATS:=1}"

# Maximum number of StorageClass test pipelines (PVC+Job) allowed to run
# concurrently. Real parallel PVC tests consume cluster CPU/RAM/IO and can
# starve other workloads, so keep this low unless the cluster has capacity
# to spare.
: "${MAX_PARALLEL:=1}"

# Workload ids to execute. Leave empty to run all of them.
# Available: postgres-write-durable postgres-write-fast postgres-read
#            small-files large-files mixed jenkins-checkout
: "${WORKLOADS:=}"

# Whether resources (PVCs, Jobs, ConfigMaps) are deleted automatically once
# results have been collected. Set to "false" together with `--no-cleanup`
# to inspect resources manually (remember to run the `cleanup` command
# afterwards).
: "${CLEANUP:=true}"

# Where results are written. A timestamped sub-directory is created below
# this path for every invocation of the `run`/`full` commands.
: "${OUTPUT_DIR:=./results}"

# Output format(s): "json", "csv" or "both".
: "${OUTPUT_FORMAT:=both}"

# Seconds to wait for a PVC to reach Bound (or WaitForFirstConsumer's
# scheduling to succeed once the consuming Pod is scheduled).
: "${PVC_TIMEOUT:=300}"

# Seconds to wait for a Job to reach completion/failure.
: "${JOB_TIMEOUT:=900}"

# Container images used for the worker Jobs. The fio image is a small
# base image with fio installed at container start via the distro package
# manager, which requires outbound network access from cluster nodes. If
# your cluster has no outbound access, build an offline image from
# images/fio.Dockerfile / images/postgres.Dockerfile (see README) and point
# these variables at your own registry.
: "${FIO_IMAGE:=alpine:3.20}"
: "${POSTGRES_IMAGE:=postgres:16-alpine}"

# Resource requests/limits for every worker Job (fio and postgres). Keep
# these modest by default; raise them deliberately for higher-fidelity
# results, being mindful of node capacity.
: "${CPU_REQUEST:=250m}"
: "${CPU_LIMIT:=2}"
: "${MEMORY_REQUEST:=256Mi}"
: "${MEMORY_LIMIT:=1Gi}"

# Path to the ranking weights file (see config/weights.default.conf).
: "${WEIGHTS_FILE:=}"
