# Ranking weights for storage-perf-tester.
#
# All WORKLOAD_WEIGHT_* values are relative and are normalized (divided by
# their sum) before being applied, so they do not need to add up to 100 or
# to 1 - only their ratios matter. Set a weight to 0 to exclude a workload
# from the overall ranking entirely (it is still measured and reported
# individually).
#
# Copy this file, adjust it (e.g. to weigh the OSM/PostgreSQL-heavy
# workloads higher) and point --weights-file / WEIGHTS_FILE at your copy.

WORKLOAD_WEIGHT_postgres_write_durable=20
WORKLOAD_WEIGHT_postgres_write_fast=5
WORKLOAD_WEIGHT_postgres_read=15
WORKLOAD_WEIGHT_small_files=15
WORKLOAD_WEIGHT_large_files=15
WORKLOAD_WEIGHT_mixed=20
WORKLOAD_WEIGHT_jenkins_checkout=10

# Within a single workload's score, how much each normalized metric
# contributes. These three are relative to each other in the same way as
# above (normalized by their sum). Latency is inverted before weighting
# (lower latency -> higher normalized score) so all three sub-scores share
# the same "higher is better" direction and can be safely combined.
METRIC_WEIGHT_IOPS=0.4
METRIC_WEIGHT_THROUGHPUT=0.4
METRIC_WEIGHT_LATENCY=0.2
