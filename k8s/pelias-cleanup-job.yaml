apiVersion: batch/v1
kind: Job
metadata:
  name: pelias-cleanup
  namespace: osm
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      nodeSelector:
        osm: "true"
      restartPolicy: Never
      containers:
        - name: pelias-cleanup
          image: pelias/schema:master-2026-08-04-d27db460d88284eabe40adfaf50a2ffac2365ddc
          imagePullPolicy: IfNotPresent
          env:
            - name: PELIAS_ELASTICSEARCH_HOST
              valueFrom:
                configMapKeyRef:
                  name: osm-pelias-config
                  key: elasticsearch-host
            - name: PELIAS_ALIAS
              value: pelias
            - name: PELIAS_INDEX_PREFIX
              value: pelias-
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              node <<'NODE'
              const http = require('http');
              const ES_HOST = process.env.PELIAS_ELASTICSEARCH_HOST || 'pelias-elasticsearch.osm.svc.cluster.local';
              const ALIAS_NAME = process.env.PELIAS_ALIAS || 'pelias';
              const INDEX_PREFIX = process.env.PELIAS_INDEX_PREFIX || 'pelias-';

              function request(method, path, body) {
                return new Promise((resolve, reject) => {
                  const payload = body ? Buffer.from(JSON.stringify(body)) : null;
                  const req = http.request({
                    hostname: ES_HOST,
                    port: 9200,
                    path,
                    method,
                    headers: payload ? { 'Content-Type': 'application/json', 'Content-Length': payload.length } : {}
                  }, (res) => {
                    const chunks = [];
                    res.on('data', (c) => chunks.push(c));
                    res.on('end', () => {
                      const text = Buffer.concat(chunks).toString('utf8');
                      if (res.statusCode >= 200 && res.statusCode < 300) {
                        resolve(text ? JSON.parse(text) : {});
                        return;
                      }
                      if (res.statusCode === 404) {
                        resolve({ _notFound: true });
                        return;
                      }
                      reject(new Error(`HTTP ${res.statusCode}: ${text}`));
                    });
                  });
                  req.on('error', reject);
                  if (payload) req.write(payload);
                  req.end();
                });
              }

              async function main() {
                const aliasInfo = await request('GET', `/_alias/${ALIAS_NAME}`);
                if (aliasInfo._notFound || !aliasInfo || Object.keys(aliasInfo).length === 0) {
                  console.log(`No active alias '${ALIAS_NAME}' found; skipping cleanup.`);
                  return;
                }

                const activeIndexes = new Set();
                Object.entries(aliasInfo).forEach(([indexName, aliasData]) => {
                  if (aliasData && aliasData.aliases && aliasData.aliases[ALIAS_NAME]) {
                    activeIndexes.add(indexName);
                  }
                });

                const indices = await request('GET', '/_cat/indices?format=json');
                const indexNames = Array.isArray(indices)
                  ? indices.map((entry) => entry.index).filter(Boolean)
                  : [];

                const staleIndexes = indexNames.filter((indexName) => {
                  return indexName.startsWith(INDEX_PREFIX) && !activeIndexes.has(indexName);
                });

                console.log(`Active indexes: ${Array.from(activeIndexes).join(', ') || '(none)'}`);
                console.log(`Stale indexes: ${staleIndexes.join(', ') || '(none)'}`);

                for (const indexName of staleIndexes) {
                  await request('DELETE', `/${indexName}`);
                  console.log(`Deleted ${indexName}`);
                }
              }

              main().catch((err) => {
                console.error(err && err.stack ? err.stack : String(err));
                process.exit(1);
              });
              NODE
