apiVersion: v1
kind: ServiceAccount
metadata:
  name: pelias-lifecycle
  namespace: osm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pelias-lifecycle
  namespace: osm
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "create", "patch", "delete"]
- apiGroups: [""]
  resources: ["services"]
  resourceNames: ["pelias"]
  verbs: ["get", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pelias-lifecycle
  namespace: osm
subjects:
- kind: ServiceAccount
  name: pelias-lifecycle
  namespace: osm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pelias-lifecycle
