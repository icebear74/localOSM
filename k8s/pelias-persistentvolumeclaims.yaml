apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pelias-elasticsearch
  namespace: osm
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-static
  resources:
    requests:
      storage: 250Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pelias-data
  namespace: osm
spec:
  accessModes: [ReadWriteMany]
  storageClassName: longhorn-static
  resources:
    requests:
      storage: 300Gi
