apiVersion: apps/v1
kind: Deployment
metadata:
  name: valhalla
  namespace: osm
  labels:
    app: valhalla
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valhalla
  template:
    metadata:
      labels:
        app: valhalla
    spec:
      nodeSelector:
        osm: "true"
      initContainers:
      - name: ca-injector
        image: alpine:3.20
        imagePullPolicy: IfNotPresent
        env:
        - name: CA_ENABLED
          valueFrom:
            configMapKeyRef:
              name: osm-ca-bundle
              key: ca-enabled
        - name: CA_CRT
          valueFrom:
            configMapKeyRef:
              name: osm-ca-bundle
              key: ca.crt
        command:
        - /bin/sh
        - -c
        args:
        - |
          set -eu
          # Install system CA bundle (may be a no-op if already present).
          apk add --no-cache ca-certificates >/dev/null 2>&1 || true
          # Seed /ca-certs/ca.crt with the system bundle so env vars always point
          # to a valid file, even when the custom CA is disabled.
          if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
            cp /etc/ssl/certs/ca-certificates.crt /ca-certs/ca.crt
          else
            touch /ca-certs/ca.crt
          fi
          if [ "${CA_ENABLED}" = "true" ] && [ -n "${CA_CRT}" ]; then
            # Append the custom Root CA to the bundle so public CAs stay trusted too.
            printf '\n%s\n' "${CA_CRT}" >> /ca-certs/ca.crt
            touch /ca-certs/ca-enabled
            echo "[ca-injector] Custom CA appended to bundle at /ca-certs/ca.crt"
          else
            echo "[ca-injector] CA injection disabled; system bundle at /ca-certs/ca.crt"
          fi
        resources:
          requests:
            memory: 16Mi
            cpu: 10m
          limits:
            memory: 64Mi
            cpu: 50m
        volumeMounts:
        - name: ca-certs
          mountPath: /ca-certs
      - name: prepare-data-dirs
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          mkdir -p /service-data/active
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "50m"
            memory: "64Mi"
        volumeMounts:
        - name: valhalla-data
          mountPath: /service-data
        - &id001
          name: ca-certs
          mountPath: /ca-certs
          readOnly: true
        env:
        - &id002
          name: SSL_CERT_FILE
          value: /ca-certs/ca.crt
        - &id003
          name: CURL_CA_BUNDLE
          value: /ca-certs/ca.crt
        - &id004
          name: REQUESTS_CA_BUNDLE
          value: /ca-certs/ca.crt
        - &id005
          name: NODE_EXTRA_CA_CERTS
          value: /ca-certs/ca.crt
      - name: wait-for-tiles
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          until [ -f /service-data/active/valhalla_tiles.tar ]; do
            echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ') Waiting for Valhalla tiles at /service-data/active/valhalla_tiles.tar ..."
            sleep 30
          done
          echo "Tiles found — starting Valhalla service."
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "50m"
            memory: "64Mi"
        volumeMounts:
        - name: valhalla-data
          mountPath: /service-data
        - *id001
        env:
        - *id002
        - *id003
        - *id004
        - *id005
      containers:
      - name: valhalla
        image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
        imagePullPolicy: Always
        command: ["/valhalla/scripts/run.sh", "build_tiles"]
        env:
        - name: use_tiles_ignore_pbf
          value: "True"
        - name: serve_tiles
          value: "True"
        - name: force_rebuild
          value: "False"
        - name: server_threads
          value: "6"
        - *id002
        - *id003
        - *id004
        - *id005
        resources:
          requests:
            memory: "4Gi"
            cpu: "4"
          limits:
            memory: "16Gi"
            cpu: "8"
        ports:
        - containerPort: 8002
        volumeMounts:
        - name: valhalla-data
          mountPath: /custom_files
          subPath: active
        - *id001
      volumes:
      - name: valhalla-data
        persistentVolumeClaim:
          claimName: valhalla
      - name: ca-certs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: valhalla
  namespace: osm
spec:
  type: NodePort
  selector:
    app: valhalla
  ports:
  - name: http
    port: 8002
    targetPort: 8002
    nodePort: 30082
