apiVersion: apps/v1
kind: Deployment
metadata:
  name: valhalla
  namespace: osm
  labels:
    app: valhalla
spec:
  replicas: 2
  selector:
    matchLabels:
      app: valhalla
  template:
    metadata:
      labels:
        app: valhalla
    spec:
      nodeSelector:
        osm: "true"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: valhalla
              topologyKey: topology.kubernetes.io/zone
      initContainers:
      - name: ca-injector
        image: alpine:3.20
        imagePullPolicy: IfNotPresent
        env:
        - name: CA_ENABLED
          valueFrom:
            configMapKeyRef:
              name: osm-ca-bundle
              key: ca-enabled
        - name: CA_CRT
          valueFrom:
            configMapKeyRef:
              name: osm-ca-bundle
              key: ca.crt
        command:
        - /bin/sh
        - -c
        args:
        - |
          set -eu
          # Install system CA bundle (may be a no-op if already present).
          apk add --no-cache ca-certificates >/dev/null 2>&1 || true
          # Seed /ca-certs/ca.crt with the system bundle so env vars always point
          # to a valid file, even when the custom CA is disabled.
          if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
            cp /etc/ssl/certs/ca-certificates.crt /ca-certs/ca.crt
          else
            touch /ca-certs/ca.crt
          fi
          if [ "${CA_ENABLED}" = "true" ] && [ -n "${CA_CRT}" ]; then
            # Append the custom Root CA to the bundle so public CAs stay trusted too.
            printf '\n%s\n' "${CA_CRT}" >> /ca-certs/ca.crt
            touch /ca-certs/ca-enabled
            echo "[ca-injector] Custom CA appended to bundle at /ca-certs/ca.crt"
          else
            echo "[ca-injector] CA injection disabled; system bundle at /ca-certs/ca.crt"
          fi
        resources:
          requests:
            memory: 16Mi
            cpu: 10m
          limits:
            memory: 64Mi
            cpu: 50m
        volumeMounts:
        - name: ca-certs
          mountPath: /ca-certs
      - name: prepare-data-dirs
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          mkdir -p /service-data/active
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "50m"
            memory: "64Mi"
        volumeMounts:
        - name: valhalla-data
          mountPath: /service-data
        - name: ca-certs
          mountPath: /ca-certs
          readOnly: true
        env:
        - name: SSL_CERT_FILE
          value: /ca-certs/ca.crt
        - name: CURL_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: REQUESTS_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: NODE_EXTRA_CA_CERTS
          value: /ca-certs/ca.crt
      - name: wait-for-tiles
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          until [ -f /service-data/active/valhalla_tiles.tar ]; do
            echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ') Waiting for Valhalla tiles at /service-data/active/valhalla_tiles.tar ..."
            sleep 30
          done
          echo "Tiles found — starting Valhalla service."
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "50m"
            memory: "64Mi"
        volumeMounts:
        - name: valhalla-data
          mountPath: /service-data
        - name: ca-certs
          mountPath: /ca-certs
          readOnly: true
        env:
        - name: SSL_CERT_FILE
          value: /ca-certs/ca.crt
        - name: CURL_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: REQUESTS_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: NODE_EXTRA_CA_CERTS
          value: /ca-certs/ca.crt
      - name: prepare-runtime-files
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          mkdir -p /runtime
          find /runtime -mindepth 1 -maxdepth 1 -exec rm -rf {} \;
          if [ -f /service-data/active/valhalla.json ]; then
            cp /service-data/active/valhalla.json /runtime/valhalla.json
          else
            cp /config/valhalla.json /runtime/valhalla.json
          fi
          if [ -f /service-data/active/.file_hashes.txt ]; then
            cp /service-data/active/.file_hashes.txt /runtime/.file_hashes.txt
          else
            : > /runtime/.file_hashes.txt
          fi
          find /service-data/active -mindepth 1 -maxdepth 1 | while read -r src; do
            name="$(basename "${src}")"
            case "${name}" in
              valhalla.json|.file_hashes.txt) continue ;;
            esac
            ln -s "/shared-data/active/${name}" "/runtime/${name}"
          done
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "50m"
            memory: "64Mi"
        volumeMounts:
        - name: valhalla-data
          mountPath: /service-data
        - name: valhalla-runtime
          mountPath: /runtime
        - name: valhalla-config
          mountPath: /config
          readOnly: true
        - name: ca-certs
          mountPath: /ca-certs
          readOnly: true
        env:
        - name: SSL_CERT_FILE
          value: /ca-certs/ca.crt
        - name: CURL_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: REQUESTS_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: NODE_EXTRA_CA_CERTS
          value: /ca-certs/ca.crt
      containers:
      - name: valhalla
        image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
        imagePullPolicy: Always
        command: ["/valhalla/scripts/run.sh", "build_tiles"]
        env:
        - name: use_tiles_ignore_pbf
          value: "True"
        - name: serve_tiles
          value: "True"
        - name: force_rebuild
          value: "False"
        - name: server_threads
          value: "6"
        - name: SSL_CERT_FILE
          value: /ca-certs/ca.crt
        - name: CURL_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: REQUESTS_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: NODE_EXTRA_CA_CERTS
          value: /ca-certs/ca.crt
        resources:
          requests:
            memory: "4Gi"
            cpu: "4"
          limits:
            memory: "16Gi"
            cpu: "8"
        ports:
        - containerPort: 8002
        volumeMounts:
        - name: valhalla-runtime
          mountPath: /custom_files
        - name: valhalla-data
          mountPath: /shared-data
          readOnly: true
        - name: ca-certs
          mountPath: /ca-certs
          readOnly: true
      volumes:
      - name: valhalla-data
        persistentVolumeClaim:
          claimName: valhalla
      - name: valhalla-runtime
        emptyDir: {}
      - name: valhalla-config
        configMap:
          name: osm-valhalla-config
      - name: ca-certs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: valhalla
  namespace: osm
spec:
  type: NodePort
  selector:
    app: valhalla
  ports:
  - name: http
    port: 8002
    targetPort: 8002
    nodePort: 30082
