apiVersion: apps/v1
kind: Deployment
metadata:
  name: pelias-libpostal
  namespace: osm
spec:
  replicas: 1
  selector:
    matchLabels: {app: pelias-libpostal}
  template:
    metadata:
      labels: {app: pelias-libpostal}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {osm: "true"}
      containers:
      - name: libpostal
        image: localosm/pelias-libpostal:2026-10-21
        imagePullPolicy: IfNotPresent
        ports:
        - {name: http, containerPort: 4400}
        resources:
          requests: {cpu: 250m, memory: 2Gi}
          limits: {cpu: "2", memory: 4Gi}
        startupProbe:
          tcpSocket: {port: http}
          periodSeconds: 10
          failureThreshold: 60
        readinessProbe:
          tcpSocket: {port: http}
          periodSeconds: 10
        livenessProbe:
          tcpSocket: {port: http}
          periodSeconds: 30
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pelias-libpostal
  namespace: osm
spec:
  selector: {app: pelias-libpostal}
  ports:
  - {name: http, port: 4400, targetPort: http}
