apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pelias
  namespace: osm
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn-static
  resources:
    requests:
      storage: 200Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pelias
  namespace: osm
  labels:
    app: pelias
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pelias
  template:
    metadata:
      labels:
        app: pelias
    spec:
      nodeSelector:
        osm: "true"
      securityContext:
        fsGroup: 1000
      containers:
      - name: elasticsearch
        image: pelias/elasticsearch:7.17.27
        imagePullPolicy: IfNotPresent
        env:
        - name: discovery.type
          value: single-node
        - name: cluster.name
          value: pelias
        - name: ES_JAVA_OPTS
          value: "-Xms6g -Xmx6g"
        - name: xpack.security.enabled
          value: "false"
        - &id001
          name: SSL_CERT_FILE
          value: /ca-certs/ca.crt
        - &id002
          name: CURL_CA_BUNDLE
          value: /ca-certs/ca.crt
        - &id003
          name: REQUESTS_CA_BUNDLE
          value: /ca-certs/ca.crt
        - &id004
          name: NODE_EXTRA_CA_CERTS
          value: /ca-certs/ca.crt
        - name: JAVA_TOOL_OPTIONS
          value: -Djavax.net.ssl.trustStore=/ca-certs/cacerts -Djavax.net.ssl.trustStoreType=JKS -Djavax.net.ssl.trustStorePassword=changeit
        ports:
        - containerPort: 9200
        - containerPort: 9300
        resources:
          requests:
            memory: "8Gi"
            cpu: "3"
          limits:
            memory: "16Gi"
            cpu: "8"
        readinessProbe:
          httpGet:
            path: /_cluster/health?wait_for_status=yellow&timeout=5s
            port: 9200
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        startupProbe:
          httpGet:
            path: /_cluster/health?wait_for_status=yellow&timeout=5s
            port: 9200
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 90
        volumeMounts:
        - name: pelias-data
          mountPath: /usr/share/elasticsearch/data
        - &id005
          name: ca-certs
          mountPath: /ca-certs
          readOnly: true
      - name: api
        image: pelias/api:v7.9.0
        imagePullPolicy: IfNotPresent
        env:
        - name: PORT
          value: "4000"
        - name: CPUS
          value: "2"
        - name: PELIAS_CONFIG
          value: /code/pelias.json
        - *id001
        - *id002
        - *id003
        - *id004
        ports:
        - containerPort: 4000
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "2"
        readinessProbe:
          httpGet:
            path: /v1
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12
        startupProbe:
          httpGet:
            path: /v1
            port: 4000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        volumeMounts:
        - name: pelias-config
          mountPath: /code/pelias.json
          subPath: runtime-pelias.json
        - *id005
      volumes:
      - name: pelias-data
        persistentVolumeClaim:
          claimName: pelias
      - name: pelias-config
        configMap:
          name: osm-pelias-config
      - name: ca-certs
        emptyDir: {}
      initContainers:
      - name: ca-injector
        image: alpine:3.20
        imagePullPolicy: IfNotPresent
        env:
        - name: CA_ENABLED
          valueFrom:
            configMapKeyRef:
              name: osm-ca-bundle
              key: ca-enabled
        - name: CA_CRT
          valueFrom:
            configMapKeyRef:
              name: osm-ca-bundle
              key: ca.crt
        command:
        - /bin/sh
        - -c
        args:
        - |
          set -eu
          # Install system CA bundle (may be a no-op if already present).
          apk add --no-cache ca-certificates >/dev/null 2>&1 || true
          # Seed /ca-certs/ca.crt with the system bundle so env vars always point
          # to a valid file, even when the custom CA is disabled.
          if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
            cp /etc/ssl/certs/ca-certificates.crt /ca-certs/ca.crt
          else
            touch /ca-certs/ca.crt
          fi
          if [ "${CA_ENABLED}" = "true" ] && [ -n "${CA_CRT}" ]; then
            # Append the custom Root CA to the bundle so public CAs stay trusted too.
            printf '\n%s\n' "${CA_CRT}" >> /ca-certs/ca.crt
            touch /ca-certs/ca-enabled
            echo "[ca-injector] Custom CA appended to bundle at /ca-certs/ca.crt"
          else
            echo "[ca-injector] CA injection disabled; system bundle at /ca-certs/ca.crt"
          fi
        resources:
          requests:
            memory: 16Mi
            cpu: 10m
          limits:
            memory: 64Mi
            cpu: 50m
        volumeMounts:
        - &id006
          name: ca-certs
          mountPath: /ca-certs
      - name: java-ca-injector
        image: eclipse-temurin:22-jdk
        imagePullPolicy: IfNotPresent
        env:
        - name: CA_ENABLED
          valueFrom:
            configMapKeyRef:
              name: osm-ca-bundle
              key: ca-enabled
        command:
        - /bin/sh
        - -c
        args:
        - |
          set -eu
          # Locate the JVM's default truststore.
          JAVA_CACERTS=""
          for p in \
            "${JAVA_HOME:-/opt/java/openjdk}/lib/security/cacerts" \
            "/usr/local/openjdk-22/lib/security/cacerts" \
            "/usr/local/openjdk-21/lib/security/cacerts" \
            "/etc/ssl/certs/java/cacerts"; do
            if [ -f "${p}" ]; then JAVA_CACERTS="${p}"; break; fi
          done
          if [ -z "${JAVA_CACERTS}" ]; then
            JAVA_CACERTS=$(find / -path /proc -prune -o -name cacerts -type f -print 2>/dev/null | head -1)
          fi
          if [ -z "${JAVA_CACERTS}" ]; then
            echo "[java-ca-injector] No system cacerts found; skipping."
            exit 0
          fi
          # Copy system truststore so JAVA_TOOL_OPTIONS always points to a valid file.
          cp "${JAVA_CACERTS}" /ca-certs/cacerts
          if [ "${CA_ENABLED}" = "true" ] && [ -f /ca-certs/ca-enabled ]; then
            keytool -noprompt -importcert -alias osm-root-ca \
              -file /ca-certs/ca.crt \
              -keystore /ca-certs/cacerts \
              -storepass changeit \
              -trustcacerts 2>&1 || true
            echo "[java-ca-injector] Custom CA imported into /ca-certs/cacerts"
          else
            echo "[java-ca-injector] CA disabled; system cacerts at /ca-certs/cacerts"
          fi
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            memory: 512Mi
            cpu: 200m
        volumeMounts:
        - *id006
---
apiVersion: v1
kind: Service
metadata:
  name: pelias
  namespace: osm
spec:
  type: NodePort
  selector:
    app: pelias
  ports:
  - name: api
    port: 4000
    targetPort: 4000
    nodePort: 30088
---
apiVersion: v1
kind: Service
metadata:
  name: pelias-elasticsearch
  namespace: osm
spec:
  type: ClusterIP
  selector:
    app: pelias
  ports:
  - name: http
    port: 9200
    targetPort: 9200
