apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pelias
  namespace: osm
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 200Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pelias
  namespace: osm
  labels:
    app: pelias
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pelias
  template:
    metadata:
      labels:
        app: pelias
    spec:
      nodeSelector:
        osm: "true"
      securityContext:
        fsGroup: 1000
      containers:
        - name: elasticsearch
          image: pelias/elasticsearch:7.17.27
          imagePullPolicy: IfNotPresent
          env:
            - name: discovery.type
              value: single-node
            - name: cluster.name
              value: pelias
            - name: ES_JAVA_OPTS
              value: "-Xms4g -Xmx4g"
            - name: xpack.security.enabled
              value: "false"
          ports:
            - containerPort: 9200
            - containerPort: 9300
          resources:
            requests:
              memory: "6Gi"
              cpu: "2"
            limits:
              memory: "12Gi"
              cpu: "6"
          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=5s
              port: 9200
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          startupProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=5s
              port: 9200
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          volumeMounts:
            - name: pelias-data
              mountPath: /usr/share/elasticsearch/data
        - name: api
          image: pelias/api:master
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "4000"
            - name: CPUS
              value: "2"
            - name: PELIAS_CONFIG
              value: /code/pelias.json
          ports:
            - containerPort: 4000
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "2"
          readinessProbe:
            httpGet:
              path: /v1
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          startupProbe:
            httpGet:
              path: /v1
              port: 4000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: pelias-config
              mountPath: /code/pelias.json
              subPath: runtime-pelias.json
      volumes:
        - name: pelias-data
          persistentVolumeClaim:
            claimName: pelias
        - name: pelias-config
          configMap:
            name: osm-pelias-config
---
apiVersion: v1
kind: Service
metadata:
  name: pelias
  namespace: osm
spec:
  type: NodePort
  selector:
    app: pelias
  ports:
    - name: api
      port: 4000
      targetPort: 4000
      nodePort: 30088
---
apiVersion: v1
kind: Service
metadata:
  name: pelias-elasticsearch
  namespace: osm
spec:
  type: ClusterIP
  selector:
    app: pelias
  ports:
    - name: http
      port: 9200
      targetPort: 9200
