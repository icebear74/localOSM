apiVersion: v1
kind: ServiceAccount
metadata:
  name: import-orchestrator
  namespace: osm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: import-orchestrator
  namespace: osm
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "patch", "update"]
- apiGroups: ["apps"]
  resources: ["deployments/scale"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: import-orchestrator
  namespace: osm
subjects:
- kind: ServiceAccount
  name: import-orchestrator
  namespace: osm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: import-orchestrator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: import-orchestrator
  namespace: osm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: import-orchestrator
  template:
    metadata:
      labels:
        app: import-orchestrator
    spec:
      serviceAccountName: import-orchestrator
      nodeSelector:
        osm: "true"
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      containers:
      - name: import-orchestrator
        image: alpine/k8s:1.30.0
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "/scripts/import-orchestrator.sh"]
        env:
        - name: OSM_NAMESPACE
          value: osm
        - name: OSM_MANIFEST_DIR
          value: /manifests
        - name: OSM_STATE_DIR
          value: /state
        - name: OSM_CONFIG_DIR
          value: /config
        - name: OSM_DATA_DIR
          value: /mnt/OSM
        - name: OSM_TEMP_DIR
          value: __OSM_TEMP_DIR__
        - name: OSM_JOB_TTL_SECONDS
          value: "259200"
        - name: SSL_CERT_FILE
          value: /ca-certs/ca.crt
        - name: CURL_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: REQUESTS_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: NODE_EXTRA_CA_CERTS
          value: /ca-certs/ca.crt
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
        - name: orchestrator-script
          mountPath: /scripts
        - name: manifests
          mountPath: /manifests
        - name: state
          mountPath: /state
        - name: status-config
          mountPath: /config/status
        - name: nominatim-config
          mountPath: /config/nominatim
        - name: valhalla-config
          mountPath: /config/valhalla
        - name: tileserver-config
          mountPath: /config/tileserver
        - name: data
          mountPath: /mnt/OSM
        - name: temp-data
          mountPath: __OSM_TEMP_DIR__
        - name: ca-certs
          mountPath: /ca-certs
          readOnly: true
      volumes:
      - name: orchestrator-script
        hostPath:
          path: /mnt/OSM/scripts
          type: DirectoryOrCreate
      - name: manifests
        hostPath:
          path: /mnt/OSM/manifests
          type: DirectoryOrCreate
      - name: state
        persistentVolumeClaim:
          claimName: osm-status
      - name: status-config
        configMap:
          name: osm-status-config
      - name: nominatim-config
        configMap:
          name: osm-nominatim-import-config
      - name: valhalla-config
        configMap:
          name: osm-valhalla-import-config
      - name: tileserver-config
        configMap:
          name: osm-tileserver-import-config
      - name: data
        hostPath:
          path: /mnt/OSM
          type: DirectoryOrCreate
      - name: temp-data
        persistentVolumeClaim:
          claimName: osm-temp
      - name: ca-certs
        emptyDir: {}
      initContainers:
      - name: ca-injector
        image: alpine:3.20
        imagePullPolicy: IfNotPresent
        env:
        - name: CA_ENABLED
          valueFrom:
            configMapKeyRef:
              name: osm-ca-bundle
              key: ca-enabled
        - name: CA_CRT
          valueFrom:
            configMapKeyRef:
              name: osm-ca-bundle
              key: ca.crt
        command:
        - /bin/sh
        - -c
        args:
        - |
          set -eu
          # Install system CA bundle (may be a no-op if already present).
          apk add --no-cache ca-certificates >/dev/null 2>&1 || true
          # Seed /ca-certs/ca.crt with the system bundle so env vars always point
          # to a valid file, even when the custom CA is disabled.
          if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
            cp /etc/ssl/certs/ca-certificates.crt /ca-certs/ca.crt
          else
            touch /ca-certs/ca.crt
          fi
          if [ "${CA_ENABLED}" = "true" ] && [ -n "${CA_CRT}" ]; then
            # Append the custom Root CA to the bundle so public CAs stay trusted too.
            printf '\n%s\n' "${CA_CRT}" >> /ca-certs/ca.crt
            touch /ca-certs/ca-enabled
            echo "[ca-injector] Custom CA appended to bundle at /ca-certs/ca.crt"
          else
            echo "[ca-injector] CA injection disabled; system bundle at /ca-certs/ca.crt"
          fi
        resources:
          requests:
            memory: 16Mi
            cpu: 10m
          limits:
            memory: 64Mi
            cpu: 50m
        volumeMounts:
        - name: ca-certs
          mountPath: /ca-certs
