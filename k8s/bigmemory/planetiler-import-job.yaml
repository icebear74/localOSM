apiVersion: batch/v1
kind: Job
metadata:
  name: tileserver-import
  namespace: osm
  labels:
    app: tileserver-import
    osm-job-type: tileserver-import
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels:
        app: tileserver-import
        osm-job-type: tileserver-import
    spec:
      serviceAccountName: planetiler-import
      nodeSelector:
        osm: "true"
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
      - name: ca-injector
        image: alpine:3.20
        imagePullPolicy: IfNotPresent
        env:
        - name: CA_ENABLED
          valueFrom:
            configMapKeyRef:
              name: osm-ca-bundle
              key: ca-enabled
        - name: CA_CRT
          valueFrom:
            configMapKeyRef:
              name: osm-ca-bundle
              key: ca.crt
        command:
        - /bin/sh
        - -c
        args:
        - |
          set -eu
          # Install system CA bundle (may be a no-op if already present).
          apk add --no-cache ca-certificates >/dev/null 2>&1 || true
          # Seed /ca-certs/ca.crt with the system bundle so env vars always point
          # to a valid file, even when the custom CA is disabled.
          if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
            cp /etc/ssl/certs/ca-certificates.crt /ca-certs/ca.crt
          else
            touch /ca-certs/ca.crt
          fi
          if [ "${CA_ENABLED}" = "true" ] && [ -n "${CA_CRT}" ]; then
            # Append the custom Root CA to the bundle so public CAs stay trusted too.
            printf '\n%s\n' "${CA_CRT}" >> /ca-certs/ca.crt
            printf '%s\n' "${CA_CRT}" > /ca-certs/custom-ca.crt
            touch /ca-certs/ca-enabled
            echo "[ca-injector] Custom CA appended to bundle at /ca-certs/ca.crt and staged at /ca-certs/custom-ca.crt"
          else
            echo "[ca-injector] CA injection disabled; system bundle at /ca-certs/ca.crt"
          fi
        resources:
          requests:
            memory: 16Mi
            cpu: 10m
          limits:
            memory: 64Mi
            cpu: 50m
        volumeMounts:
        - name: ca-certs
          mountPath: /ca-certs
      - name: java-ca-injector
        image: eclipse-temurin:22-jdk
        imagePullPolicy: IfNotPresent
        env:
        - name: CA_ENABLED
          valueFrom:
            configMapKeyRef:
              name: osm-ca-bundle
              key: ca-enabled
        command:
        - /bin/sh
        - -c
        args:
        - |
          set -eu
          # Locate the JVM's default truststore.
          JAVA_CACERTS=""
          for p in \
            "${JAVA_HOME:-/opt/java/openjdk}/lib/security/cacerts" \
            "/usr/local/openjdk-22/lib/security/cacerts" \
            "/usr/local/openjdk-21/lib/security/cacerts" \
            "/etc/ssl/certs/java/cacerts"; do
            if [ -f "${p}" ]; then JAVA_CACERTS="${p}"; break; fi
          done
          if [ -z "${JAVA_CACERTS}" ]; then
            JAVA_CACERTS=$(find / -path /proc -prune -o -name cacerts -type f -print 2>/dev/null | head -1)
          fi
          if [ -z "${JAVA_CACERTS}" ]; then
            if [ "${CA_ENABLED}" = "true" ] && [ -f /ca-certs/ca-enabled ] && [ -s /ca-certs/custom-ca.crt ]; then
              echo "[java-ca-injector] ERROR: No system cacerts found for custom CA import" >&2
              exit 1
            fi
            echo "[java-ca-injector] No system cacerts found; using container default truststore"
            exit 0
          fi
          # Copy system truststore so JAVA_TOOL_OPTIONS always points to a valid file.
          cp "${JAVA_CACERTS}" /ca-certs/cacerts
          chmod 0644 /ca-certs/cacerts

          STORE_TYPE=""
          if keytool -list -keystore /ca-certs/cacerts -storepass changeit -storetype PKCS12 >/dev/null 2>&1; then
            STORE_TYPE="PKCS12"
          elif keytool -list -keystore /ca-certs/cacerts -storepass changeit -storetype JKS >/dev/null 2>&1; then
            STORE_TYPE="JKS"
          else
            echo "[java-ca-injector] ERROR: Unable to open /ca-certs/cacerts as PKCS12 or JKS" >&2
            exit 1
          fi
          printf '%s\n' "${STORE_TYPE}" > /ca-certs/java-truststore-type
          echo "[java-ca-injector] Detected truststore type: ${STORE_TYPE}"

          if [ "${CA_ENABLED}" = "true" ] && [ -f /ca-certs/ca-enabled ] && [ -s /ca-certs/custom-ca.crt ]; then
            if keytool -list -keystore /ca-certs/cacerts -storepass changeit -storetype "${STORE_TYPE}" -alias osm-root-ca >/dev/null 2>&1; then
              keytool -delete -alias osm-root-ca \
                -keystore /ca-certs/cacerts \
                -storepass changeit \
                -storetype "${STORE_TYPE}"
            fi
            keytool -noprompt -importcert -alias osm-root-ca \
              -file /ca-certs/custom-ca.crt \
              -keystore /ca-certs/cacerts \
              -storepass changeit \
              -storetype "${STORE_TYPE}" \
              -trustcacerts
            if keytool -list -keystore /ca-certs/cacerts -storepass changeit -storetype "${STORE_TYPE}" -alias osm-root-ca >/dev/null 2>&1; then
              echo "[java-ca-injector] Custom CA imported into /ca-certs/cacerts as alias osm-root-ca"
            else
              echo "[java-ca-injector] ERROR: Alias osm-root-ca not found after import" >&2
              exit 1
            fi
          elif [ "${CA_ENABLED}" = "true" ]; then
            echo "[java-ca-injector] ERROR: CA enabled but /ca-certs/custom-ca.crt is missing or empty" >&2
            exit 1
          else
            echo "[java-ca-injector] CA disabled; system cacerts at /ca-certs/cacerts"
          fi
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            memory: 512Mi
            cpu: 200m
        volumeMounts:
        - name: ca-certs
          mountPath: /ca-certs
      - name: preflight
        image: busybox:1.36
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          echo '=== Planetiler Tile Generation ==='
          test -f /planet/europa.osm.pbf
          mkdir -p /osm-temp/tileserver/work /tools /osm-status
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        volumeMounts:
        - name: planet
          mountPath: /planet
        - name: osm-temp
          mountPath: /osm-temp
        - name: tools
          mountPath: /tools
        - name: osm-status
          mountPath: /osm-status
        - name: ca-certs
          mountPath: /ca-certs
          readOnly: true
        env:
        - name: SSL_CERT_FILE
          value: /ca-certs/ca.crt
        - name: CURL_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: REQUESTS_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: NODE_EXTRA_CA_CERTS
          value: /ca-certs/ca.crt
      - name: fetch-tools
        image: curlimages/curl:8.10.1
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          if [ ! -s /tools/planetiler.jar ]; then
            curl --cacert /ca-certs/ca.crt -fsSL -o /tools/planetiler.jar https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar
          fi
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        volumeMounts:
        - name: tools
          mountPath: /tools
        - name: ca-certs
          mountPath: /ca-certs
          readOnly: true
        env:
        - name: SSL_CERT_FILE
          value: /ca-certs/ca.crt
        - name: CURL_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: REQUESTS_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: NODE_EXTRA_CA_CERTS
          value: /ca-certs/ca.crt
      - name: fetch-sources
        image: alpine:3.20
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          mkdir -p /osm-temp/tileserver/data/sources /osm-temp/tileserver/work
          if [ ! -s /osm-temp/tileserver/data/sources/lake_centerline.shp.zip ]; then
            wget --ca-certificate=/ca-certs/ca.crt -q -O /osm-temp/tileserver/data/sources/lake_centerline.shp.zip https://github.com/acalcutt/osm-lakelines/releases/latest/download/lake_centerline.shp.zip
          fi
          if [ ! -s /osm-temp/tileserver/data/sources/water-polygons-split-3857.zip ]; then
            wget --ca-certificate=/ca-certs/ca.crt -q -O /osm-temp/tileserver/data/sources/water-polygons-split-3857.zip https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip
          fi
          if [ ! -s /osm-temp/tileserver/data/sources/natural_earth_vector.sqlite.zip ]; then
            wget --ca-certificate=/ca-certs/ca.crt -q -O /osm-temp/tileserver/data/sources/natural_earth_vector.sqlite.zip https://naciscdn.org/naturalearth/packages/natural_earth_vector.sqlite.zip
          fi
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "512Mi"
        volumeMounts:
        - name: osm-temp
          mountPath: /osm-temp
        - name: ca-certs
          mountPath: /ca-certs
          readOnly: true
        env:
        - name: SSL_CERT_FILE
          value: /ca-certs/ca.crt
        - name: CURL_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: REQUESTS_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: NODE_EXTRA_CA_CERTS
          value: /ca-certs/ca.crt
      containers:
      - name: tileserver-import
        image: eclipse-temurin:22-jdk
        imagePullPolicy: Always
        workingDir: /osm-temp/tileserver
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          capabilities:
            add:
            - SYS_ADMIN
        resources:
          requests:
            memory: "30Gi"
            cpu: "5"
          limits:
            memory: "180Gi"
            cpu: "40"
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu

          PLANETILER_JAR=/tools/planetiler.jar
          SOURCE_OSM=/planet/europa.osm.pbf
          SOURCE_DIR=/osm-temp/tileserver/data/sources
          TEMP_DIR=/osm-temp/tileserver/work
          OUTPUT_NEW="${TEMP_DIR}/planet.mbtiles.new"
          OUTPUT_READY="${TEMP_DIR}/planet.mbtiles"

          trim_mount() {
            mountpoint="$1"
            if command -v fstrim >/dev/null 2>&1; then
              echo "[INFO] fstrim ${mountpoint}"
              fstrim "${mountpoint}" || echo "[WARN] fstrim failed for ${mountpoint}; continuing"
            fi
          }

          cleanup_temp_dir() {
            if [ -d "${TEMP_DIR}" ]; then
              find "${TEMP_DIR}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            fi
          }

          cleanup() {
            cleanup_temp_dir
            trim_mount /planet
            trim_mount /osm-temp
            trim_mount /tools
          }
          trap cleanup EXIT

          rm -f "${OUTPUT_NEW}" "${OUTPUT_READY}"
          mkdir -p "${TEMP_DIR}" "${SOURCE_DIR}"

          for source_file in lake_centerline.shp.zip water-polygons-split-3857.zip natural_earth_vector.sqlite.zip; do
            source_path="${SOURCE_DIR}/${source_file}"
            if [ ! -s "${source_path}" ]; then
              echo "[ERROR] Missing or empty source file: ${source_path}" >&2
              exit 1
            fi
          done

          detect_java_truststore_type() {
            if [ ! -s /ca-certs/cacerts ]; then
              echo "[INFO] /ca-certs/cacerts not present; using container default truststore"
              return 0
            fi
            if [ -s /ca-certs/java-truststore-type ]; then
              JAVA_TRUSTSTORE_TYPE="$(tr -d '[:space:]' < /ca-certs/java-truststore-type)"
            else
              JAVA_TRUSTSTORE_TYPE=""
            fi
            if [ -z "${JAVA_TRUSTSTORE_TYPE}" ]; then
              if keytool -list -keystore /ca-certs/cacerts -storepass changeit -storetype PKCS12 >/dev/null 2>&1; then
                JAVA_TRUSTSTORE_TYPE="PKCS12"
              elif keytool -list -keystore /ca-certs/cacerts -storepass changeit -storetype JKS >/dev/null 2>&1; then
                JAVA_TRUSTSTORE_TYPE="JKS"
              else
                echo "[ERROR] Unable to determine Java truststore type for /ca-certs/cacerts" >&2
                exit 1
              fi
            fi
            JAVA_TRUSTSTORE_OPTIONS="-Djavax.net.ssl.trustStore=/ca-certs/cacerts -Djavax.net.ssl.trustStoreType=${JAVA_TRUSTSTORE_TYPE} -Djavax.net.ssl.trustStorePassword=changeit"
            JAVA_TOOL_OPTIONS_BASE="$(printf '%s\n' "${JAVA_TOOL_OPTIONS:-}" | sed -e 's/[[:space:]]*-Djavax\.net\.ssl\.trustStore=[^[:space:]]*//g' -e 's/[[:space:]]*-Djavax\.net\.ssl\.trustStoreType=[^[:space:]]*//g' -e 's/[[:space:]]*-Djavax\.net\.ssl\.trustStorePassword=[^[:space:]]*//g' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/[[:space:]][[:space:]]*/ /g')"
            if [ -n "${JAVA_TOOL_OPTIONS_BASE}" ]; then
              export JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS_BASE} ${JAVA_TRUSTSTORE_OPTIONS}"
            else
              export JAVA_TOOL_OPTIONS="${JAVA_TRUSTSTORE_OPTIONS}"
            fi
          }

          PROFILE_SOURCE_ROOT="${TEMP_DIR}/profile"
          PROFILE_SOURCE="${PROFILE_SOURCE_ROOT}/com/onthegomap/planetiler/custom/CustomProfile.java"
          USE_JAVA="true"
          mkdir -p "$(dirname "${PROFILE_SOURCE}")"
          if [ -f /config/use_java ]; then
            USE_JAVA="$(tr '[:upper:]' '[:lower:]' < /config/use_java | tr -d '[:space:]')"
          fi
          detect_java_truststore_type

          if [ "${USE_JAVA}" = "true" ] && [ -f /config/CustomProfile.java ]; then
            cp /config/CustomProfile.java "${PROFILE_SOURCE}"
            javac -cp "${PLANETILER_JAR}" -d "${PROFILE_SOURCE_ROOT}" "${PROFILE_SOURCE}"
            java -Xmx64g -cp "${PLANETILER_JAR}:${PROFILE_SOURCE_ROOT}" com.onthegomap.planetiler.custom.CustomProfile \
              --osm-path="${SOURCE_OSM}" \
              --tmpdir="${TEMP_DIR}" \
              --output="${OUTPUT_NEW}" \
              --force \
              --download=false \
              --data-dir=/osm-temp/tileserver/data \
              --nodemap-type=sparsearray \
              --nodemap-storage=ram \
              --threads=16 \
              --arguments=journal_mode=WAL,synchronous=OFF \
              --minzoom=0 \
              --maxzoom=16 \
              --extra-osm-tags=shop,building,construction,name,name:de,name:en,wheelchair,amenity,highway,landuse,tourism,attraction,railway,roller_coaster,colour,color,layer,maxspeed,oneway
          else
            java -Xmx64g -jar "${PLANETILER_JAR}" \
              --osm-path="${SOURCE_OSM}" \
              --tmpdir="${TEMP_DIR}" \
              --output="${OUTPUT_NEW}" \
              --data-dir=/osm-temp/tileserver/data \
              --force \
              --download=false \
              --nodemap-type=sparsearray \
              --nodemap-storage=ram \
              --threads=16 \
              --arguments=journal_mode=WAL,synchronous=OFF \
              --minzoom=0 \
              --maxzoom=16 \
              --extra-osm-tags=shop,building,construction,name,name:de,name:en,wheelchair,amenity,highway,landuse,tourism,attraction,railway,roller_coaster,colour,color,layer,maxspeed,oneway
          fi

          sync
          mv -f "${OUTPUT_NEW}" "${OUTPUT_READY}"
          echo "[INFO] Planetiler build finished at ${OUTPUT_READY}; central copy/promote job will activate it."
        volumeMounts:
        - name: planet
          mountPath: /planet
        - name: osm-temp
          mountPath: /osm-temp
        - name: osm-status
          mountPath: /osm-status
        - name: tools
          mountPath: /tools
        - name: planetiler-profile-config
          mountPath: /config
          readOnly: true
        - name: ca-certs
          mountPath: /ca-certs
          readOnly: true
        env:
        - name: SSL_CERT_FILE
          value: /ca-certs/ca.crt
        - name: CURL_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: REQUESTS_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: NODE_EXTRA_CA_CERTS
          value: /ca-certs/ca.crt
      volumes:
      - name: planet
        persistentVolumeClaim:
          claimName: planet
      - name: osm-temp
        persistentVolumeClaim:
          claimName: osm-temp
      - name: osm-status
        persistentVolumeClaim:
          claimName: osm-status
      - name: tools
        emptyDir: {}
      - name: planetiler-profile-config
        configMap:
          name: osm-tileserver-import-profile-config
          optional: true
      - name: ca-certs
        emptyDir: {}
