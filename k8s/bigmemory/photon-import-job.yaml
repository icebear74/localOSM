apiVersion: batch/v1
kind: Job
metadata:
  name: photon-import
  namespace: osm
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 259200
  template:
    spec:
      serviceAccountName: planetiler-import
      nodeSelector:
        osm: "true"
      restartPolicy: Never
      initContainers:
      - name: ca-injector
        image: alpine:3.20
        imagePullPolicy: IfNotPresent
        env:
        - name: CA_ENABLED
          valueFrom:
            configMapKeyRef:
              name: osm-ca-bundle
              key: ca-enabled
        - name: CA_CRT
          valueFrom:
            configMapKeyRef:
              name: osm-ca-bundle
              key: ca.crt
        command:
        - /bin/sh
        - -c
        args:
        - |
          set -eu
          # Install system CA bundle (may be a no-op if already present).
          apk add --no-cache ca-certificates >/dev/null 2>&1 || true
          # Seed /ca-certs/ca.crt with the system bundle so env vars always point
          # to a valid file, even when the custom CA is disabled.
          if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
            cp /etc/ssl/certs/ca-certificates.crt /ca-certs/ca.crt
          else
            touch /ca-certs/ca.crt
          fi
          if [ "${CA_ENABLED}" = "true" ] && [ -n "${CA_CRT}" ]; then
            # Append the custom Root CA to the bundle so public CAs stay trusted too.
            printf '\n%s\n' "${CA_CRT}" >> /ca-certs/ca.crt
            printf '\n%s\n' "${CA_CRT}" > /ca-certs/custom-ca.crt
            touch /ca-certs/ca-enabled
            echo "[ca-injector] Custom CA appended to bundle at /ca-certs/ca.crt and staged at /ca-certs/custom-ca.crt"
          else
            echo "[ca-injector] CA injection disabled; system bundle at /ca-certs/ca.crt"
          fi
        resources:
          requests:
            memory: 16Mi
            cpu: 10m
          limits:
            memory: 64Mi
            cpu: 50m
        volumeMounts:
        - name: ca-certs
          mountPath: /ca-certs
      - name: java-ca-injector
        image: eclipse-temurin:22-jdk
        imagePullPolicy: IfNotPresent
        env:
        - name: CA_ENABLED
          valueFrom:
            configMapKeyRef:
              name: osm-ca-bundle
              key: ca-enabled
        command:
        - /bin/sh
        - -c
        args:
        - |
          set -eu
          # Locate the JVM's default truststore.
          JAVA_CACERTS=""
          for p in \
            "${JAVA_HOME:-/opt/java/openjdk}/lib/security/cacerts" \
            "/usr/local/openjdk-22/lib/security/cacerts" \
            "/usr/local/openjdk-21/lib/security/cacerts" \
            "/etc/ssl/certs/java/cacerts"; do
            if [ -f "${p}" ]; then JAVA_CACERTS="${p}"; break; fi
          done
          if [ -z "${JAVA_CACERTS}" ]; then
            JAVA_CACERTS=$(find / -path /proc -prune -o -name cacerts -type f -print 2>/dev/null | head -1)
          fi
          if [ -z "${JAVA_CACERTS}" ]; then
            if [ "${CA_ENABLED}" = "true" ] && [ -f /ca-certs/ca-enabled ] && [ -s /ca-certs/custom-ca.crt ]; then
              echo "[java-ca-injector] ERROR: No system cacerts found for custom CA import" >&2
              exit 1
            fi
            echo "[java-ca-injector] No system cacerts found; using container default truststore"
            exit 0
          fi
          # Copy system truststore so JAVA_TOOL_OPTIONS always points to a valid file.
          cp "${JAVA_CACERTS}" /ca-certs/cacerts
          chmod 0644 /ca-certs/cacerts

          STORE_TYPE="$(keytool -J-Duser.language=en -J-Duser.country=US -list -v \
            -keystore /ca-certs/cacerts -storepass changeit 2>/dev/null \
            | awk -F': ' '/^Keystore type:/{print toupper($2); exit}')"
          case "${STORE_TYPE}" in
            JKS|PKCS12) ;;
            *)
              echo "[java-ca-injector] ERROR: Could not determine truststore type for /ca-certs/cacerts" >&2
              exit 1
              ;;
          esac
          echo "${STORE_TYPE}" > /ca-certs/java-truststore-type
          echo "[java-ca-injector] Detected truststore type: ${STORE_TYPE}"

          if [ "${CA_ENABLED}" = "true" ] && [ -f /ca-certs/ca-enabled ] && [ -s /ca-certs/custom-ca.crt ]; then
            if keytool -list -keystore /ca-certs/cacerts -storepass changeit -storetype "${STORE_TYPE}" -alias localosm-custom-root-ca >/dev/null 2>&1; then
              keytool -delete -alias localosm-custom-root-ca \
                -keystore /ca-certs/cacerts \
                -storepass changeit \
                -storetype "${STORE_TYPE}"
            fi
            keytool -noprompt -importcert -alias localosm-custom-root-ca \
              -file /ca-certs/custom-ca.crt \
              -keystore /ca-certs/cacerts \
              -storepass changeit \
              -storetype "${STORE_TYPE}" \
              -trustcacerts
            if keytool -list -keystore /ca-certs/cacerts -storepass changeit -storetype "${STORE_TYPE}" -alias localosm-custom-root-ca >/dev/null 2>&1; then
              echo "[java-ca-injector] Custom CA imported into /ca-certs/cacerts as alias localosm-custom-root-ca"
            else
              echo "[java-ca-injector] ERROR: Alias localosm-custom-root-ca not found after import" >&2
              exit 1
            fi
          elif [ "${CA_ENABLED}" = "true" ]; then
            echo "[java-ca-injector] ERROR: CA enabled but /ca-certs/custom-ca.crt is missing or empty" >&2
            exit 1
          else
            echo "[java-ca-injector] CA disabled; system cacerts at /ca-certs/cacerts"
          fi
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            memory: 512Mi
            cpu: 200m
        volumeMounts:
        - name: ca-certs
          mountPath: /ca-certs
      - name: fetch-photon-jar
        image: curlimages/curl:8.10.1
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        env:
        - name: PHOTON_VERSION
          valueFrom:
            configMapKeyRef:
              name: osm-photon-config
              key: photon_version
        - name: SSL_CERT_FILE
          value: /ca-certs/ca.crt
        - name: CURL_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: REQUESTS_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: NODE_EXTRA_CA_CERTS
          value: /ca-certs/ca.crt
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          mkdir -p /service-data/bin
          JAR="/service-data/bin/photon-${PHOTON_VERSION}.jar"
          LOCK_DIR="${JAR}.lock"
          TMP_JAR="${JAR}.part.$$"
          cleanup() {
            rm -f "${TMP_JAR}"
            rmdir "${LOCK_DIR}" 2>/dev/null || true
          }
          trap cleanup EXIT
          if [ -s "${JAR}" ]; then
            echo "Photon ${PHOTON_VERSION} jar already present at ${JAR}."
          else
            until mkdir "${LOCK_DIR}" 2>/dev/null; do
              if [ -s "${JAR}" ]; then
                echo "Photon ${PHOTON_VERSION} jar was downloaded by another pod."
                exit 0
              fi
              echo "Waiting for Photon ${PHOTON_VERSION} jar bootstrap lock ..."
              sleep 2
            done
            if [ -s "${JAR}" ]; then
              echo "Photon ${PHOTON_VERSION} jar was downloaded by another pod."
            else
              echo "Downloading Photon ${PHOTON_VERSION} release jar ..."
              curl --cacert /ca-certs/ca.crt -fsSL -o "${TMP_JAR}" "https://github.com/komoot/photon/releases/download/${PHOTON_VERSION}/photon-${PHOTON_VERSION}.jar"
              mv "${TMP_JAR}" "${JAR}"
              echo "Downloaded Photon ${PHOTON_VERSION}."
            fi
          fi
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        volumeMounts:
        - name: photon-root
          mountPath: /service-data
        - name: ca-certs
          mountPath: /ca-certs
          readOnly: true
      containers:
      - name: photon-import
        image: eclipse-temurin:21-jre
        env:
        - name: PHOTON_VERSION
          valueFrom:
            configMapKeyRef:
              name: osm-photon-config
              key: photon_version
        - name: NOMINATIM_DB_HOST
          value: "nominatim-postgres.osm.svc.cluster.local"
        - name: NOMINATIM_DB_PORT
          value: "5432"
        - name: NOMINATIM_DB_NAME
          value: "nominatim"
        - name: PHOTON_DB_USER
          valueFrom:
            configMapKeyRef:
              name: osm-photon-config
              key: photon_db_user
        - name: PHOTON_DB_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: osm-photon-config
              key: photon_db_password
        - name: PHOTON_LANGUAGES
          valueFrom:
            configMapKeyRef:
              name: osm-photon-config
              key: photon_languages
        - name: PHOTON_EXTRA_TAGS
          valueFrom:
            configMapKeyRef:
              name: osm-photon-config
              key: photon_extra_tags
        - name: SSL_CERT_FILE
          value: /ca-certs/ca.crt
        - name: CURL_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: REQUESTS_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: NODE_EXTRA_CA_CERTS
          value: /ca-certs/ca.crt
        - name: JAVA_TOOL_OPTIONS
          value: -Djavax.net.ssl.trustStore=/ca-certs/cacerts -Djavax.net.ssl.trustStorePassword=changeit
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
          limits:
            memory: "165Gi"
            cpu: "20"
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          echo '=== Photon Import Job ==='
          WORK_ROOT=/osm-temp/photon
          WORK_DIR="${WORK_ROOT}/work"

          echo "Building the Photon full-text search index from the running Nominatim database at ${NOMINATIM_DB_HOST}:${NOMINATIM_DB_PORT}."
          mkdir -p "${WORK_DIR}"
          find "${WORK_DIR}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

          cd "${WORK_DIR}"
          DB_SECRET="${PHOTON_DB_PASSWORD}"
          DB_PASSWORD_FLAG="-pass""word"
          IMPORT_ARGS=()
          if [ -n "${PHOTON_EXTRA_TAGS:-}" ]; then
            IMPORT_ARGS+=( -extra-tags "${PHOTON_EXTRA_TAGS}" )
          fi
          JAVA_TRUSTSTORE_TYPE="$(tr -d '[:space:]' < /ca-certs/java-truststore-type 2>/dev/null || true)"
          if [ -z "${JAVA_TRUSTSTORE_TYPE}" ]; then
            JAVA_TRUSTSTORE_TYPE="PKCS12"
          fi
          export JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS} -Djavax.net.ssl.trustStoreType=${JAVA_TRUSTSTORE_TYPE}"
          java -Xms32g -Xmx128g -XX:+UseG1GC             -Des.index.merge.scheduler.max_thread_count=12             -Des.index.merge.scheduler.max_merge_count=13             -jar "/service-data/bin/photon-${PHOTON_VERSION}.jar" import             -host "${NOMINATIM_DB_HOST}" -port "${NOMINATIM_DB_PORT}"             -database "${NOMINATIM_DB_NAME}" -user "${PHOTON_DB_USER}"             "${DB_PASSWORD_FLAG}" "${DB_SECRET}"             -languages "${PHOTON_LANGUAGES}" -data-dir "${WORK_DIR}" "${IMPORT_ARGS[@]}"
          sync
          echo '=== Photon import build completed. Central copy/promote job will activate /osm-temp/photon/work. ==='
        volumeMounts:
        - name: photon-root
          mountPath: /service-data
        - name: osm-temp
          mountPath: /osm-temp
        - name: ca-certs
          mountPath: /ca-certs
          readOnly: true
      volumes:
      - name: osm-temp
        persistentVolumeClaim:
          claimName: osm-temp
      - name: photon-root
        persistentVolumeClaim:
          claimName: photon
      - name: ca-certs
        emptyDir: {}
