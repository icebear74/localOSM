apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: planet
  namespace: osm
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: odfin-fs-ec-4-2 
  resources:
    requests:
      storage: 300Gi
