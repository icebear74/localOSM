apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: planet
  namespace: osm
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: cephfs-ec-2-4-zone
  resources:
    requests:
      storage: 300Gi
