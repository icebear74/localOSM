apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: planet
  namespace: osm
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: csi-cephfs-ec
  resources:
    requests:
      storage: 300Gi
