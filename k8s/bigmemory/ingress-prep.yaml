apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: osm-web
  namespace: osm
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: haproxy
  rules:
    - host: web.localosm.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
  tls:
    - hosts:
        - web.localosm.example
      secretName: optadata.io.secret
---
