apiVersion: v1
kind: ConfigMap
metadata:
  name: osm-tileserver-import-profile-config
  namespace: osm
data:
  use_java: "false"
  CustomProfile.java: |
    package com.onthegomap.planetiler.custom;

    import com.onthegomap.planetiler.FeatureCollector;
    import com.onthegomap.planetiler.config.Arguments;
    import com.onthegomap.planetiler.Planetiler;
    import com.onthegomap.planetiler.reader.SourceFeature;
    import java.nio.file.Path;
    import org.openmaptiles.OpenMapTilesProfile;
    import org.openmaptiles.generated.OpenMapTilesSchema;

    /**
     * Erweiterung des Standard-OpenMapTiles-Profils.
     *
     * Behält alle Standard-Features bei und ergänzt zusätzliche Layer/Attribute für
     * Freizeitpark-Attraktionen, Schienen-/Parkbahnen und Baustellen.
     */
    public class CustomProfile extends OpenMapTilesProfile {
      public CustomProfile(Planetiler planetiler) {
        super(planetiler);
      }

      private static String rollerCoasterValue(SourceFeature feature) {
        return feature.getString("roller_coaster", "").trim();
      }

      private static boolean isAttractionTransit(SourceFeature feature) {
        String rollerCoaster = rollerCoasterValue(feature);
        return (!rollerCoaster.isEmpty() && !"no".equalsIgnoreCase(rollerCoaster))
          || feature.hasTag("attraction", "roller_coaster", "water_slide")
          || feature.hasTag("railway", "coaster", "narrow_gauge", "monorail", "miniature");
      }

      private static String attractionTransitSubclass(SourceFeature feature) {
        String rollerCoaster = rollerCoasterValue(feature);
        return !rollerCoaster.isEmpty() && !"no".equalsIgnoreCase(rollerCoaster) ? rollerCoaster :
          feature.getString("attraction", feature.getString("railway", "roller_coaster"));
      }

      @Override
      public void processFeature(SourceFeature feature, FeatureCollector features) {
        if (feature.canBeLine() && isAttractionTransit(feature)) {
          var line = features.line("transportation")
            .setBufferPixels(4)
            .setAttr("class", "transit")
            .setAttr("subclass", attractionTransitSubclass(feature))
            .setMinZoom(11);
          String name = feature.getString("name", null);
          if (name != null && !name.isBlank()) {
            line.setAttr("name", name);
          }
          if (feature.hasTag("layer")) {
            line.setAttr("layer", feature.getLong("layer"));
          }
          return;
        }

        super.processFeature(feature, features);

        if (feature.hasTag("tourism", "theme_park", "water_park")
            || feature.hasTag("landuse", "attraction")
            || feature.hasTag("attraction")) {
          if (feature.canBePolygon()) {
            features.polygon("landuse")
              .setAttr("class", "theme_park")
              .setAttr("subclass", feature.getString("attraction", feature.getString("tourism", "attraction")))
              .setMinZoom(9);
          }

          if (feature.isPoint()) {
            features.point("poi")
              .setAttr("class", "attraction")
              .setAttr("subclass", feature.getString("attraction", "generic"))
              .setAttr("name", feature.getString("name"))
              .setMinZoom(12);
          }
        }

        if (feature.canBeLine() && (feature.hasTag("highway", "construction") || feature.hasTag("construction"))) {
          features.line("transportation")
            .setBufferPixels(4)
            .setAttr("class", "construction")
            .setAttr("construction", feature.getString("construction", "road"))
            .setMinZoom(11);
        }

        if (feature.canBePolygon() && feature.hasTag("building", "construction")) {
          features.polygon("building")
            .setAttr("class", "construction")
            .setMinZoom(13);
        }

        if (feature.canBePolygon() && feature.hasTag("landuse", "construction")) {
          features.polygon("landuse")
            .setAttr("class", "construction")
            .setMinZoom(10);
        }
      }

      public static void main(String[] args) throws Exception {
        Arguments arguments = Arguments.fromArgs(args);

        // Default paths kept only as a fallback for local/manual runs. In the k8s import job
        // these are always overridden via CLI arguments (--osm-path=..., --output=...,
        // --lake_centerlines_path=..., --water_polygons_path=..., --natural_earth_path=...),
        // so nothing here is actually hard-coded during a real import.
        Path dataDir = Path.of("data");
        Path sourcesDir = dataDir.resolve("sources");

        Planetiler.create(arguments)
          .setDefaultLanguages(OpenMapTilesSchema.LANGUAGES)
          .setProfile(CustomProfile::new)
          // Same three auxiliary sources the stock OpenMapTilesMain registers. Without these,
          // the water/ocean/background layers have no geometry to render, which is what was
          // causing the all-black tiles when use_java=true: --lake_centerlines_path,
          // --water_polygons_path and --natural_earth_path passed by the import job were being
          // silently ignored because this profile never wired up the matching sources.
          .addShapefileSource("EPSG:3857", OpenMapTilesProfile.LAKE_CENTERLINE_SOURCE,
            sourcesDir.resolve("lake_centerline.shp.zip"),
            "https://dev.maptiler.download/geodata/omt/lake_centerline.shp.zip")
          .addShapefileSource(OpenMapTilesProfile.WATER_POLYGON_SOURCE,
            sourcesDir.resolve("water-polygons-split-3857.zip"),
            "https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip")
          .addNaturalEarthSource(OpenMapTilesProfile.NATURAL_EARTH_SOURCE,
            sourcesDir.resolve("natural_earth_vector.sqlite.zip"),
            "https://dev.maptiler.download/geodata/omt/natural_earth_vector.sqlite.zip")
          // "osm" source: defaults to /planet/europa.osm.pbf but is overridden by the
          // --osm-path=... argument the import job always passes.
          .addOsmSource(OpenMapTilesProfile.OSM_SOURCE, Path.of("/planet/europa.osm.pbf"))
          // Output: defaults to /tileserver-gl/planet-NEW.mbtiles but is overridden by the
          // --output=... argument the import job always passes.
          .overwriteOutput("/tileserver-gl/planet-NEW.mbtiles")
          .run();
      }
    }
