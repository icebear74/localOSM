apiVersion: apps/v1
kind: Deployment
metadata:
  name: tileserver-gl
  namespace: osm
  labels:
    app: tileserver-gl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tileserver-gl
  template:
    metadata:
      labels:
        app: tileserver-gl
    spec:
      nodeSelector:
        osm: "true"
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      initContainers:
      - name: ca-injector
        image: alpine:3.20
        imagePullPolicy: IfNotPresent
        env:
        - name: CA_ENABLED
          valueFrom:
            configMapKeyRef:
              name: osm-ca-bundle
              key: ca-enabled
        - name: CA_CRT
          valueFrom:
            configMapKeyRef:
              name: osm-ca-bundle
              key: ca.crt
        command:
        - /bin/sh
        - -c
        args:
        - |
          set -eu
          # Install system CA bundle (may be a no-op if already present).
          apk add --no-cache ca-certificates >/dev/null 2>&1 || true
          # Seed /ca-certs/ca.crt with the system bundle so env vars always point
          # to a valid file, even when the custom CA is disabled.
          if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
            cp /etc/ssl/certs/ca-certificates.crt /ca-certs/ca.crt
          else
            touch /ca-certs/ca.crt
          fi
          if [ "${CA_ENABLED}" = "true" ] && [ -n "${CA_CRT}" ]; then
            # Append the custom Root CA to the bundle so public CAs stay trusted too.
            printf '\n%s\n' "${CA_CRT}" >> /ca-certs/ca.crt
            touch /ca-certs/ca-enabled
            echo "[ca-injector] Custom CA appended to bundle at /ca-certs/ca.crt"
          else
            echo "[ca-injector] CA injection disabled; system bundle at /ca-certs/ca.crt"
          fi
        resources:
          requests:
            memory: 16Mi
            cpu: 10m
          limits:
            memory: 64Mi
            cpu: 50m
        volumeMounts:
        - name: ca-certs
          mountPath: /ca-certs
      - name: init-config
        image: alpine:3.20
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          mkdir -p /data/fonts /data/sprites /data/icons

          for style_file in style.json dark_style.json blue_style.json futuristic_style.json; do
            if [ -f "/style-source/${style_file}" ] && [ ! -f "/data/${style_file}" ]; then
              cp "/style-source/${style_file}" "/data/${style_file}"
              echo "[INFO] TileServer: installed initial ${style_file} from ConfigMap tileserver-style"
            fi
          done

          if [ ! -f /data/style.json ]; then
            printf '%s\n' '{"version":8,"name":"LocalOSM","sources":{"openmaptiles":{"type":"vector","url":"mbtiles://{v3}"}},"glyphs":"{fontstack}/{range}.pbf","layers":[{"id":"background","type":"background","paint":{"background-color":"#f2efe9"}}]}' > /data/style.json
          fi

          if [ ! -f /data/config.json ]; then
            styles_json='"osm":{"style":"/data/style.json"}'
            if [ -f /data/dark_style.json ]; then
              styles_json="${styles_json},\"osm-dark\":{\"style\":\"/data/dark_style.json\"}"
            fi
            if [ -f /data/blue_style.json ]; then
              styles_json="${styles_json},\"osm-blue\":{\"style\":\"/data/blue_style.json\"}"
            fi
            if [ -f /data/futuristic_style.json ]; then
              styles_json="${styles_json},\"osm-futuristic\":{\"style\":\"/data/futuristic_style.json\"}"
            fi
            printf '%s\n' "{\"options\":{\"paths\":{\"root\":\"/data\",\"fonts\":\"fonts\",\"sprites\":\"sprites\",\"icons\":\"icons\"},\"serveAllFonts\":true,\"cors\":true},\"styles\":{${styles_json}},\"data\":{\"v3\":{\"mbtiles\":\"planet.mbtiles\"}}}" > /data/config.json
          fi

          if [ -n "$(find /data/fonts -type f -name '*.pbf' -print -quit 2>/dev/null)" ]; then
            echo "[✓] Fonts verified and available"
          else
            echo "[!] WARNING: No glyph files found below /data/fonts."
          fi
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        volumeMounts:
        - name: tileserver-data
          mountPath: /data
        - name: tileserver-style
          mountPath: /style-source
          readOnly: true
        - name: ca-certs
          mountPath: /ca-certs
          readOnly: true
        env:
        - name: SSL_CERT_FILE
          value: /ca-certs/ca.crt
        - name: CURL_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: REQUESTS_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: NODE_EXTRA_CA_CERTS
          value: /ca-certs/ca.crt
      containers:
      - name: tileserver-gl
        image: maptiler/tileserver-gl:latest
        imagePullPolicy: Always
        args: ["/data/config.json"]
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        env:
        - name: PORT
          value: "8080"
        - name: SSL_CERT_FILE
          value: /ca-certs/ca.crt
        - name: CURL_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: REQUESTS_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: NODE_EXTRA_CA_CERTS
          value: /ca-certs/ca.crt
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: tileserver-data
          mountPath: /data
        - name: dshm
          mountPath: /dev/shm
        - name: ca-certs
          mountPath: /ca-certs
          readOnly: true
      volumes:
      - name: tileserver-data
        persistentVolumeClaim:
          claimName: tileserver-gl
      - name: tileserver-style
        configMap:
          name: tileserver-style
          optional: true
        # TileServer-GL renders raster tiles server-side via MapLibre GL Native's
        # headless GL backend, which needs shared memory to allocate its GL
        # context/framebuffers. Kubernetes containers default to a tiny 64Mi
        # /dev/shm, which is enough for vector (.pbf) tile serving (no rendering
        # involved) but too small for raster rendering, causing raster tiles to
        # fail/return blank while vector tiles keep working fine.
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: ca-certs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tileserver-gl
  namespace: osm
spec:
  type: NodePort
  selector:
    app: tileserver-gl
  ports:
  - name: http
    port: 80
    targetPort: 8080
    nodePort: 30085
