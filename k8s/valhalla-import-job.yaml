apiVersion: batch/v1
kind: Job
metadata:
  name: valhalla-import
  namespace: osm
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: planetiler-import
      nodeSelector:
        osm: "true"
      restartPolicy: Never
      initContainers:
      - name: ca-injector
        image: alpine:3.20
        imagePullPolicy: IfNotPresent
        env:
        - name: CA_ENABLED
          valueFrom:
            configMapKeyRef:
              name: osm-ca-bundle
              key: ca-enabled
        - name: CA_CRT
          valueFrom:
            configMapKeyRef:
              name: osm-ca-bundle
              key: ca.crt
        command:
        - /bin/sh
        - -c
        args:
        - |
          set -eu
          # Install system CA bundle (may be a no-op if already present).
          apk add --no-cache ca-certificates >/dev/null 2>&1 || true
          # Seed /ca-certs/ca.crt with the system bundle so env vars always point
          # to a valid file, even when the custom CA is disabled.
          if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
            cp /etc/ssl/certs/ca-certificates.crt /ca-certs/ca.crt
          else
            touch /ca-certs/ca.crt
          fi
          if [ "${CA_ENABLED}" = "true" ] && [ -n "${CA_CRT}" ]; then
            # Append the custom Root CA to the bundle so public CAs stay trusted too.
            printf '\n%s\n' "${CA_CRT}" >> /ca-certs/ca.crt
            touch /ca-certs/ca-enabled
            echo "[ca-injector] Custom CA appended to bundle at /ca-certs/ca.crt"
          else
            echo "[ca-injector] CA injection disabled; system bundle at /ca-certs/ca.crt"
          fi
        resources:
          requests:
            memory: 16Mi
            cpu: 10m
          limits:
            memory: 64Mi
            cpu: 50m
        volumeMounts:
        - name: ca-certs
          mountPath: /ca-certs
      containers:
      - name: valhalla-import
        image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
        imagePullPolicy: Always
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        env:
        - name: serve_tiles
          value: "False"
        - name: force_rebuild
          value: "False"
        - name: build_admins
          value: "True"
        - name: build_time_zones
          value: "True"
        - name: build_tar
          value: "True"
        - name: SSL_CERT_FILE
          value: /ca-certs/ca.crt
        - name: CURL_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: REQUESTS_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: NODE_EXTRA_CA_CERTS
          value: /ca-certs/ca.crt
        resources:
          requests:
            memory: "18Gi"
            cpu: "4"
          limits:
            memory: "64Gi"
            cpu: "20"
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          echo '=== Valhalla Import Job ==='
          SOURCE_PBF=/planet/europa.osm.pbf
          WORK_ROOT=/osm-temp/valhalla
          WORK_DIR="${WORK_ROOT}/work"
          CONFIG_PATH=/tmp/valhalla-import.json

          test -f "${SOURCE_PBF}" || { echo "ERROR: ${SOURCE_PBF} not found"; exit 1; }
          PBF_SIZE=$(du -sh "${SOURCE_PBF}" | cut -f1)
          echo "Found PBF file (${PBF_SIZE}). Building routing graph ..."

          mkdir -p "${WORK_DIR}"
          find "${WORK_DIR}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

          if [ -s /ca-certs/ca.crt ] && [ -w /etc/ssl/certs/ca-certificates.crt ]; then
            cp /ca-certs/ca.crt /etc/ssl/certs/ca-certificates.crt
          fi

          sed             -e "s|/data/tiles|${WORK_DIR}/tiles|g"             -e "s|/data/valhalla_tiles.tar|${WORK_DIR}/valhalla_tiles.tar|g"             -e "s|/data/traffic.tar|${WORK_DIR}/traffic.tar|g"             -e "s|/data/timezone.sqlite|${WORK_DIR}/timezone.sqlite|g"             -e "s|/data/admin.sqlite|${WORK_DIR}/admin.sqlite|g"             /config/valhalla.json > "${CONFIG_PATH}"

          valhalla_build_tiles -c "${CONFIG_PATH}" "${SOURCE_PBF}" -j 16
          echo '=== Tile build complete. Creating tile extract archive ...'
          valhalla_build_extract -c "${CONFIG_PATH}" -e "${WORK_DIR}/valhalla_tiles.tar" -t -O
          sync
          echo '=== Valhalla import build completed. Central copy/promote job will activate /osm-temp/valhalla/work. ==='
        volumeMounts:
        - name: osm-temp
          mountPath: /osm-temp
        - name: valhalla-config
          mountPath: /config
        - name: planet
          mountPath: /planet
        - name: ca-certs
          mountPath: /ca-certs
          readOnly: true
      volumes:
      - name: osm-temp
        persistentVolumeClaim:
          claimName: osm-temp
      - name: valhalla-config
        configMap:
          name: osm-valhalla-import-config
      - name: planet
        persistentVolumeClaim:
          claimName: planet
      - name: ca-certs
        emptyDir: {}
