apiVersion: v1
kind: ConfigMap
metadata:
  name: valhalla-importer-manifest
  namespace: osm
data:
  job.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: valhalla-importer-JOB_SUFFIX
      namespace: osm
      labels:
        app: valhalla-importer
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: osm-orchestrator
          initContainers:
            - name: dispatcher
              image: bitnami/kubectl:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  NAMESPACE=osm
                  BLUE_REPLICAS=$(kubectl get deployment valhalla-blue -n $NAMESPACE -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "0")
                  GREEN_REPLICAS=$(kubectl get deployment valhalla-green -n $NAMESPACE -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "0")
                  echo "Blue replicas: $BLUE_REPLICAS  Green replicas: $GREEN_REPLICAS"
                  if [ "$GREEN_REPLICAS" -gt 0 ] && [ "$BLUE_REPLICAS" -eq 0 ]; then ACTIVE_COLOR=green; elif [ "$BLUE_REPLICAS" -gt 0 ] && [ "$GREEN_REPLICAS" -eq 0 ]; then ACTIVE_COLOR=blue; else ACTIVE_COLOR=green; fi
                  if [ "$ACTIVE_COLOR" = "green" ]; then TARGET_COLOR=blue; else TARGET_COLOR=green; fi
                  echo "Active: $ACTIVE_COLOR  Target: $TARGET_COLOR"
                  echo "$TARGET_COLOR" > /mnt/shared/target-color
              volumeMounts:
                - name: shared-data
                  mountPath: /mnt/shared
            - name: wait-planet
              image: alpine:3.20
              command: ["/bin/sh", "-c"]
              args:
                - |
                  MAX_RETRIES=120
                  RETRY=0
                  while [ -f /mnt/planet/planet-update.lock ]; do
                    RETRY=$((RETRY+1))
                    if [ $RETRY -ge $MAX_RETRIES ]; then
                      echo "Max retries reached waiting for planet lock – proceeding anyway."
                      break
                    fi
                    echo "Waiting for planet-update.lock to be removed (attempt $RETRY/$MAX_RETRIES) ..."
                    sleep 30
                  done
                  echo "Planet lock released or not present. Proceeding."
              volumeMounts:
                - name: planet-storage
                  mountPath: /mnt/planet
                  readOnly: true
          containers:
            - name: importer
              image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
              imagePullPolicy: Always
              securityContext:
                runAsUser: 0
                runAsGroup: 0
              env:
                - name: serve_tiles
                  value: "False"
                - name: force_rebuild
                  value: "False"
                - name: build_admins
                  value: "True"
                - name: build_time_zones
                  value: "True"
                - name: build_tar
                  value: "True"
              resources:
                requests:
                  memory: "18Gi"
                  cpu: "4"
                limits:
                  memory: "64Gi"
                  cpu: "20"
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  TARGET_COLOR=$(cat /mnt/shared/target-color)
                  DATA_DIR="/mnt/valhalla/${TARGET_COLOR}"
                  echo "Importing to $TARGET_COLOR PVC at $DATA_DIR"
                  find "$DATA_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
                  test -f /pipeline/europa_mitte_final.osm.pbf || { echo 'ERROR: /pipeline/europa_mitte_final.osm.pbf not found'; exit 1; }
                  mkdir -p "$DATA_DIR/tiles"
                  valhalla_build_tiles -c /config/valhalla.json /pipeline/europa_mitte_final.osm.pbf -j 16
                  valhalla_build_extract -c /config/valhalla.json -e "$DATA_DIR/valhalla_tiles.tar" -O
              volumeMounts:
                - name: shared-data
                  mountPath: /mnt/shared
                  readOnly: true
                - name: planet-storage
                  mountPath: /pipeline
                  readOnly: true
                - name: valhalla-blue
                  mountPath: /mnt/valhalla/blue
                - name: valhalla-green
                  mountPath: /mnt/valhalla/green
                - name: valhalla-config
                  mountPath: /config
          volumes:
            - name: shared-data
              emptyDir: {}
            - name: planet-storage
              persistentVolumeClaim:
                claimName: planet-storage-pvc
            - name: valhalla-blue
              persistentVolumeClaim:
                claimName: valhalla-blue-pvc
            - name: valhalla-green
              persistentVolumeClaim:
                claimName: valhalla-green-pvc
            - name: valhalla-config
              configMap:
                name: osm-valhalla-import-config
