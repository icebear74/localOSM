apiVersion: v1
kind: ConfigMap
metadata:
  name: nominatim-importer-manifest
  namespace: osm
data:
  job.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: nominatim-importer-JOB_SUFFIX
      namespace: osm
      labels:
        app: nominatim-importer
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 43200
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: osm-orchestrator
          securityContext:
            fsGroup: 100
          initContainers:
            - name: dispatcher
              image: bitnami/kubectl:1.29
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  NAMESPACE=osm
                  BLUE_REPLICAS=$(kubectl get deployment nominatim-blue -n $NAMESPACE -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "0")
                  GREEN_REPLICAS=$(kubectl get deployment nominatim-green -n $NAMESPACE -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "0")
                  echo "Blue replicas: $BLUE_REPLICAS  Green replicas: $GREEN_REPLICAS"
                  if [ "$GREEN_REPLICAS" -gt 0 ] && [ "$BLUE_REPLICAS" -eq 0 ]; then
                    ACTIVE_COLOR=green
                  elif [ "$BLUE_REPLICAS" -gt 0 ] && [ "$GREEN_REPLICAS" -eq 0 ]; then
                    ACTIVE_COLOR=blue
                  else
                    ACTIVE_COLOR=green
                  fi
                  if [ "$ACTIVE_COLOR" = "green" ]; then
                    TARGET_COLOR=blue
                  else
                    TARGET_COLOR=green
                  fi
                  echo "Active: $ACTIVE_COLOR  Target: $TARGET_COLOR"
                  echo "$TARGET_COLOR" > /mnt/shared/target-color
              volumeMounts:
                - name: shared-data
                  mountPath: /mnt/shared
            - name: wait-planet
              image: alpine:3.20
              command: ["/bin/sh", "-c"]
              args:
                - |
                  MAX_RETRIES=120
                  RETRY=0
                  while [ -f /mnt/planet/planet-update.lock ]; do
                    RETRY=$((RETRY+1))
                    if [ $RETRY -ge $MAX_RETRIES ]; then
                      echo "Max retries reached waiting for planet lock – proceeding anyway."
                      break
                    fi
                    echo "Waiting for planet-update.lock to be removed (attempt $RETRY/$MAX_RETRIES) ..."
                    sleep 30
                  done
                  echo "Planet lock released or not present. Proceeding."
              volumeMounts:
                - name: planet-storage
                  mountPath: /mnt/planet
                  readOnly: true
          containers:
            - name: importer
              image: mediagis/nominatim:4.5
              imagePullPolicy: IfNotPresent
              env:
                - name: PBF_PATH
                  value: /pipeline/europa_mitte_final.osm.pbf
                - name: NOMINATIM_PASSWORD
                  valueFrom:
                    configMapKeyRef:
                      name: osm-nominatim-import-config
                      key: import_password
                - name: THREADS
                  valueFrom:
                    configMapKeyRef:
                      name: osm-nominatim-import-config
                      key: import_threads
                - name: NOMINATIM_OSM2PGSQL_CACHE
                  valueFrom:
                    configMapKeyRef:
                      name: osm-nominatim-import-config
                      key: import_cache_mb
                - name: NOMINATIM_FLATNODE_FILE
                  value: /var/lib/postgresql/16/main/flatnodes.bin
              resources:
                requests:
                  memory: "48Gi"
                  cpu: "8"
                limits:
                  memory: "96Gi"
                  cpu: "20"
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  TARGET_COLOR=$(cat /mnt/shared/target-color)
                  echo "Importing to $TARGET_COLOR PVC"
                  # /var/lib/postgresql/16/main must physically be the chosen
                  # colour's PVC. Symlinking it here (application-level, in the
                  # main container's own writable rootfs) instead of using a
                  # Kubernetes subPath into an emptyDir avoids the kubelet
                  # subPath-symlink-escape check (CVE-2021-25741 hardening),
                  # which otherwise rejects this pod at container-creation time
                  # with CreateContainerConfigError because the "target" path
                  # is a symlink pointing outside its own volume.
                  rm -rf /var/lib/postgresql/16/main
                  ln -s "/mnt/nominatim-${TARGET_COLOR}" /var/lib/postgresql/16/main
                  find /var/lib/postgresql/16/main -mindepth 1 -maxdepth 1 -exec rm -rf {} +
                  /app/config.sh
                  if id nominatim >/dev/null 2>&1; then
                    echo "user nominatim already exists"
                  else
                    useradd -m -p "${NOMINATIM_PASSWORD}" nominatim
                  fi
                  if [ -n "${NOMINATIM_OSM2PGSQL_CACHE:-}" ]; then
                    sed -i '/nominatim import/ s/--threads \$THREADS/--threads \$THREADS --osm2pgsql-cache \$NOMINATIM_OSM2PGSQL_CACHE --flatnode-file \$NOMINATIM_FLATNODE_FILE/g' /app/init.sh
                  else
                    sed -i '/nominatim import/ s/--threads \$THREADS/--threads \$THREADS --flatnode-file \$NOMINATIM_FLATNODE_FILE/g' /app/init.sh
                  fi
                  /app/init.sh
                  sleep 10
                  su -c "psql -c 'CHECKPOINT;'" postgres
                  sleep 5
                  touch /var/lib/postgresql/16/main/import-finished
                  rm -f "${NOMINATIM_FLATNODE_FILE}"
              volumeMounts:
                - name: shared-data
                  mountPath: /mnt/shared
                  readOnly: true
                - name: planet-storage
                  mountPath: /pipeline
                  readOnly: true
                - name: nominatim-blue
                  mountPath: /mnt/nominatim-blue
                - name: nominatim-green
                  mountPath: /mnt/nominatim-green
                - name: nominatim-postgres-tuning
                  mountPath: /etc/postgresql/16/main/conf.d/zz-tuning.conf
                  subPath: import-tuning.conf
                  readOnly: true
          volumes:
            - name: shared-data
              emptyDir: {}
            - name: planet-storage
              persistentVolumeClaim:
                claimName: planet-storage-pvc
            - name: nominatim-blue
              persistentVolumeClaim:
                claimName: nominatim-blue-pvc
            - name: nominatim-green
              persistentVolumeClaim:
                claimName: nominatim-green-pvc
            - name: nominatim-postgres-tuning
              configMap:
                name: nominatim-postgres-tuning
                items:
                  - key: import-tuning.conf
                    path: import-tuning.conf
