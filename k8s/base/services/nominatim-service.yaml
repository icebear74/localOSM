apiVersion: v1
kind: Service
metadata:
  name: nominatim
  namespace: osm
  labels:
    app: nominatim
spec:
  type: NodePort
  selector:
    app: nominatim
    active: "true"
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 31081
---
apiVersion: v1
kind: Service
metadata:
  name: nominatim-postgres
  namespace: osm
spec:
  type: ClusterIP
  selector:
    app: nominatim
    active: "true"
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
