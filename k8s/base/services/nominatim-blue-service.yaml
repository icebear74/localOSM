apiVersion: v1
kind: Service
metadata:
  name: nominatim-blue
  namespace: osm
  labels:
    app: nominatim
    color: blue
spec:
  type: NodePort
  selector:
    app: nominatim
    color: blue
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 31082
---
apiVersion: v1
kind: Service
metadata:
  name: nominatim-postgres-blue
  namespace: osm
spec:
  type: ClusterIP
  selector:
    app: nominatim
    color: blue
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
