# Green direct-access service – always routes to the green deployment regardless
# of which colour is currently active. Useful for testing/debugging.
apiVersion: v1
kind: Service
metadata:
  name: tileserver-green
  namespace: osm
  labels:
    app: tileserver
    color: green
spec:
  type: NodePort
  selector:
    app: tileserver
    color: green
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 31087
