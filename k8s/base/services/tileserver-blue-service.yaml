# Blue direct-access service – always routes to the blue deployment regardless
# of which colour is currently active. Useful for testing/debugging.
apiVersion: v1
kind: Service
metadata:
  name: tileserver-blue
  namespace: osm
  labels:
    app: tileserver
    color: blue
spec:
  type: NodePort
  selector:
    app: tileserver
    color: blue
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 31086
