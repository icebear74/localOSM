apiVersion: v1
kind: Service
metadata:
  name: nominatim-green
  namespace: osm
  labels:
    app: nominatim
    color: green
spec:
  type: NodePort
  selector:
    app: nominatim
    color: green
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 31083
---
apiVersion: v1
kind: Service
metadata:
  name: nominatim-postgres-green
  namespace: osm
spec:
  type: ClusterIP
  selector:
    app: nominatim
    color: green
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
