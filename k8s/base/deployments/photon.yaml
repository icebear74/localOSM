apiVersion: apps/v1
kind: Deployment
metadata:
  name: photon
  namespace: osm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: photon
  template:
    metadata:
      labels:
        app: photon
    spec:
      initContainers:
        - name: fetch-photon-jar
          image: curlimages/curl:8.10.1
          env:
            - name: PHOTON_VERSION
              valueFrom:
                configMapKeyRef:
                  name: osm-photon-config
                  key: photon_version
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              JAR="/photon/bin/photon-${PHOTON_VERSION}.jar"
              if [ ! -s "${JAR}" ]; then
                curl -fsSL -o "${JAR}.part" "https://github.com/komoot/photon/releases/download/${PHOTON_VERSION}/photon-${PHOTON_VERSION}.jar"
                mv "${JAR}.part" "${JAR}"
              fi
          volumeMounts:
            - name: photon-data
              mountPath: /photon
        - name: wait-for-data
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              until [ -d /photon/data/photon_data ]; do
                echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ') Waiting for Photon data ..."
                sleep 30
              done
          volumeMounts:
            - name: photon-data
              mountPath: /photon
      containers:
        - name: photon
          image: eclipse-temurin:21-jre
          env:
            - name: PHOTON_VERSION
              valueFrom:
                configMapKeyRef:
                  name: osm-photon-config
                  key: photon_version
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              exec java -jar "/photon/bin/photon-${PHOTON_VERSION}.jar" serve -listen-ip 0.0.0.0 -listen-port 2322 -cors-any -data-dir /photon/data
          ports:
            - containerPort: 2322
          readinessProbe:
            httpGet:
              path: /status
              port: 2322
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: photon-data
              mountPath: /photon
      volumes:
        - name: photon-data
          persistentVolumeClaim:
            claimName: photon-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: photon
  namespace: osm
spec:
  type: NodePort
  selector:
    app: photon
  ports:
    - name: http
      port: 2322
      targetPort: 2322
      nodePort: 30087
