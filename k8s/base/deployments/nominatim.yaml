apiVersion: apps/v1
kind: Deployment
metadata:
  name: nominatim
  namespace: osm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nominatim
  template:
    metadata:
      labels:
        app: nominatim
    spec:
      securityContext:
        fsGroup: 100
      terminationGracePeriodSeconds: 3660
      initContainers:
        - name: wait-for-data
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              until [ -f /nominatim-db/PG_VERSION ] && [ -f /nominatim-db/import-finished ]; do
                echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ') Waiting for imported Nominatim database ..."
                sleep 5
              done
          volumeMounts:
            - name: nominatim-data
              mountPath: /nominatim-db
              readOnly: true
      containers:
        - name: nominatim
          image: mediagis/nominatim:4.5
          imagePullPolicy: IfNotPresent
          env:
            - name: NOMINATIM_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: osm-nominatim-import-config
                  key: import_password
            - name: THREADS
              valueFrom:
                configMapKeyRef:
                  name: osm-nominatim-import-config
                  key: import_threads
            - name: PBF_PATH
              value: /nominatim/data/import/europa_mitte_final.osm.pbf
            - name: PGCTLTIMEOUT
              value: "3600"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              PG_CTL_CONF=/etc/postgresql/16/main/pg_ctl.conf
              mkdir -p "$(dirname "${PG_CTL_CONF}")"
              echo "pg_ctl_options = '-t ${PGCTLTIMEOUT}'" > "${PG_CTL_CONF}"
              exec /app/start.sh
          ports:
            - containerPort: 8080
            - containerPort: 5432
          readinessProbe:
            httpGet:
              path: /status
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: nominatim-data
              mountPath: /var/lib/postgresql/16/main
            - name: planet-storage
              mountPath: /nominatim/data/import
              readOnly: true
            - name: nominatim-postgres-tuning
              mountPath: /etc/postgresql/16/main/conf.d/zz-tuning.conf
              subPath: runtime-tuning.conf
              readOnly: true
      volumes:
        - name: nominatim-data
          persistentVolumeClaim:
            claimName: nominatim-pvc
        - name: planet-storage
          persistentVolumeClaim:
            claimName: planet-storage-pvc
        - name: nominatim-postgres-tuning
          configMap:
            name: nominatim-postgres-tuning
            items:
              - key: runtime-tuning.conf
                path: runtime-tuning.conf
---
apiVersion: v1
kind: Service
metadata:
  name: nominatim
  namespace: osm
spec:
  type: NodePort
  selector:
    app: nominatim
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081
