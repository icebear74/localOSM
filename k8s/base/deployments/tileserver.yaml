apiVersion: apps/v1
kind: Deployment
metadata:
  name: tileserver-gl
  namespace: osm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tileserver-gl
  template:
    metadata:
      labels:
        app: tileserver-gl
    spec:
      initContainers:
        - name: init-config
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /data/fonts
              if [ -f /style-source/style.json ] && [ ! -f /data/style.json ]; then
                cp /style-source/style.json /data/style.json
              fi
              if [ -f /data/map.mbtiles ]; then
                printf '%s\n' '{"options":{"paths":{"root":"/","fonts":"/data/fonts","sprites":"","icons":""},"serveAllFonts":true,"cors":true},"styles":{"osm":{"style":"/data/style.json"}},"data":{"v3":{"mbtiles":"/data/map.mbtiles"}}}' > /data/config.json
                if [ ! -f /data/style.json ]; then
                  printf '%s\n' '{"version":8,"name":"LocalOSM","sources":{"openmaptiles":{"type":"vector","url":"mbtiles://{v3}"}},"glyphs":"{fontstack}/{range}.pbf","layers":[{"id":"background","type":"background","paint":{"background-color":"#f2efe9"}}]}' > /data/style.json
                fi
              else
                printf '%s\n' '{"options":{"paths":{"root":"","fonts":"/data/fonts","sprites":"","icons":""},"serveAllFonts":true,"cors":true},"styles":{},"data":{}}' > /data/config.json
              fi
          volumeMounts:
            - name: tileserver-data
              mountPath: /data
            - name: tileserver-style
              mountPath: /style-source
              readOnly: true
      containers:
        - name: tileserver-gl
          image: maptiler/tileserver-gl:latest
          imagePullPolicy: Always
          args: ["/data/config.json"]
          env:
            - name: PORT
              value: "80"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: tileserver-data
              mountPath: /data
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: tileserver-data
          persistentVolumeClaim:
            claimName: tileserver-pvc
        - name: tileserver-style
          configMap:
            name: tileserver-style
            optional: true
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tileserver-gl
  namespace: osm
spec:
  type: NodePort
  selector:
    app: tileserver-gl
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30085
