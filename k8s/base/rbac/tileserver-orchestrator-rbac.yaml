apiVersion: v1
kind: ServiceAccount
metadata:
  name: tileserver-orchestrator
  namespace: osm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tileserver-orchestrator
  namespace: osm
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tileserver-orchestrator
  namespace: osm
subjects:
  - kind: ServiceAccount
    name: tileserver-orchestrator
    namespace: osm
roleRef:
  kind: Role
  name: tileserver-orchestrator
  apiGroup: rbac.authorization.k8s.io
