apiVersion: apps/v1
kind: Deployment
metadata:
  name: photon
  namespace: osm
  labels:
    app: photon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: photon
  template:
    metadata:
      labels:
        app: photon
    spec:
      nodeSelector:
        osm: "true"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: photon
              topologyKey: topology.kubernetes.io/zone
      initContainers:
      - name: ca-injector
        image: alpine:3.20
        imagePullPolicy: IfNotPresent
        env:
        - name: CA_ENABLED
          valueFrom:
            configMapKeyRef:
              name: osm-ca-bundle
              key: ca-enabled
        - name: CA_CRT
          valueFrom:
            configMapKeyRef:
              name: osm-ca-bundle
              key: ca.crt
        command:
        - /bin/sh
        - -c
        args:
        - |
          set -eu
          # Install system CA bundle (may be a no-op if already present).
          apk add --no-cache ca-certificates >/dev/null 2>&1 || true
          # Seed /ca-certs/ca.crt with the system bundle so env vars always point
          # to a valid file, even when the custom CA is disabled.
          if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
            cp /etc/ssl/certs/ca-certificates.crt /ca-certs/ca.crt
          else
            touch /ca-certs/ca.crt
          fi
          if [ "${CA_ENABLED}" = "true" ] && [ -n "${CA_CRT}" ]; then
            # Append the custom Root CA to the bundle so public CAs stay trusted too.
            printf '\n%s\n' "${CA_CRT}" >> /ca-certs/ca.crt
            touch /ca-certs/ca-enabled
            echo "[ca-injector] Custom CA appended to bundle at /ca-certs/ca.crt"
          else
            echo "[ca-injector] CA injection disabled; system bundle at /ca-certs/ca.crt"
          fi
        resources:
          requests:
            memory: 16Mi
            cpu: 10m
          limits:
            memory: 64Mi
            cpu: 50m
        volumeMounts:
        - name: ca-certs
          mountPath: /ca-certs
      - name: java-ca-injector
        image: eclipse-temurin:22-jdk
        imagePullPolicy: IfNotPresent
        env:
        - name: CA_ENABLED
          valueFrom:
            configMapKeyRef:
              name: osm-ca-bundle
              key: ca-enabled
        command:
        - /bin/sh
        - -c
        args:
        - |
          set -eu
          # Locate the JVM's default truststore.
          JAVA_CACERTS=""
          for p in \
            "${JAVA_HOME:-/opt/java/openjdk}/lib/security/cacerts" \
            "/usr/local/openjdk-22/lib/security/cacerts" \
            "/usr/local/openjdk-21/lib/security/cacerts" \
            "/etc/ssl/certs/java/cacerts"; do
            if [ -f "${p}" ]; then JAVA_CACERTS="${p}"; break; fi
          done
          if [ -z "${JAVA_CACERTS}" ]; then
            JAVA_CACERTS=$(find / -path /proc -prune -o -name cacerts -type f -print 2>/dev/null | head -1)
          fi
          if [ -z "${JAVA_CACERTS}" ]; then
            echo "[java-ca-injector] No system cacerts found; skipping."
            exit 0
          fi
          # Copy system truststore so JAVA_TOOL_OPTIONS always points to a valid file.
          cp "${JAVA_CACERTS}" /ca-certs/cacerts
          if [ "${CA_ENABLED}" = "true" ] && [ -f /ca-certs/ca-enabled ]; then
            keytool -noprompt -importcert -alias osm-root-ca \
              -file /ca-certs/ca.crt \
              -keystore /ca-certs/cacerts \
              -storepass changeit \
              -storetype PKCS12 \
              -trustcacerts 2>&1 || true
            echo "[java-ca-injector] Custom CA imported into /ca-certs/cacerts"
          else
            echo "[java-ca-injector] CA disabled; system cacerts at /ca-certs/cacerts"
          fi
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            memory: 512Mi
            cpu: 200m
        volumeMounts:
        - name: ca-certs
          mountPath: /ca-certs
      - name: fetch-photon-jar
        image: curlimages/curl:8.10.1
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        env:
        - name: PHOTON_VERSION
          valueFrom:
            configMapKeyRef:
              name: osm-photon-config
              key: photon_version
        - name: SSL_CERT_FILE
          value: /ca-certs/ca.crt
        - name: CURL_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: REQUESTS_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: NODE_EXTRA_CA_CERTS
          value: /ca-certs/ca.crt
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          mkdir -p /photon-store/bin
          JAR="/photon-store/bin/photon-${PHOTON_VERSION}.jar"
          LOCK_DIR="${JAR}.lock"
          TMP_JAR="${JAR}.part.$$"
          cleanup() {
            rm -f "${TMP_JAR}"
            rmdir "${LOCK_DIR}" 2>/dev/null || true
          }
          trap cleanup EXIT
          if [ -s "${JAR}" ]; then
            echo "Photon ${PHOTON_VERSION} jar already present at ${JAR}."
          else
            until mkdir "${LOCK_DIR}" 2>/dev/null; do
              if [ -s "${JAR}" ]; then
                echo "Photon ${PHOTON_VERSION} jar was downloaded by another pod."
                exit 0
              fi
              echo "Waiting for Photon ${PHOTON_VERSION} jar bootstrap lock ..."
              sleep 2
            done
            if [ -s "${JAR}" ]; then
              echo "Photon ${PHOTON_VERSION} jar was downloaded by another pod."
            else
              echo "Downloading Photon ${PHOTON_VERSION} release jar ..."
              curl -fsSL -o "${TMP_JAR}" "https://github.com/komoot/photon/releases/download/${PHOTON_VERSION}/photon-${PHOTON_VERSION}.jar"
              mv "${TMP_JAR}" "${JAR}"
              echo "Downloaded Photon ${PHOTON_VERSION}."
            fi
          fi
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        volumeMounts:
        - name: photon-storage
          mountPath: /photon-store
        - name: ca-certs
          mountPath: /ca-certs
          readOnly: true
      - name: wait-for-data
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          until [ -d /photon-store/active/photon_data ]; do
            echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ') Waiting for the Photon search index at /photon-store/active/photon_data ..."
            sleep 30
          done
          echo "Photon search index found — starting Photon service."
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "50m"
            memory: "64Mi"
        volumeMounts:
        - name: photon-storage
          mountPath: /photon-store
        - name: ca-certs
          mountPath: /ca-certs
          readOnly: true
        env:
        - name: SSL_CERT_FILE
          value: /ca-certs/ca.crt
        - name: CURL_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: REQUESTS_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: NODE_EXTRA_CA_CERTS
          value: /ca-certs/ca.crt
      - name: copy-index-to-ram
        image: alpine:3.20
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          SRC="/photon-store/active/photon_data"
          DST="/photon-ram/active/photon_data"

          echo "[copy-index-to-ram] $(date -u '+%Y-%m-%dT%H:%M:%SZ') Starting copy of OpenSearch index to RAM disk ..."
          echo "[copy-index-to-ram] Source : ${SRC}"
          echo "[copy-index-to-ram] Destination: ${DST}"

          # Determine total size for progress reporting
          TOTAL_BYTES=$(du -sb "${SRC}" 2>/dev/null | awk '{print $1}' || echo 0)
          TOTAL_MB=$(( TOTAL_BYTES / 1048576 ))
          echo "[copy-index-to-ram] Total size to copy: ${TOTAL_MB} MiB"

          mkdir -p "${DST}"

          # Count total files for progress
          TOTAL_FILES=$(find "${SRC}" -type f | wc -l)
          echo "[copy-index-to-ram] Total files to copy: ${TOTAL_FILES}"

          COPIED=0
          COPIED_BYTES=0
          LAST_REPORT=0

          find "${SRC}" -type f | while read -r FILE; do
            REL="${FILE#${SRC}/}"
            DEST_FILE="${DST}/${REL}"
            mkdir -p "$(dirname "${DEST_FILE}")"
            cp "${FILE}" "${DEST_FILE}"
            COPIED=$(( COPIED + 1 ))
            FILE_BYTES=$(stat -c '%s' "${FILE}" 2>/dev/null || echo 0)
            COPIED_BYTES=$(( COPIED_BYTES + FILE_BYTES ))
            COPIED_MB=$(( COPIED_BYTES / 1048576 ))
            # Report progress every 500 files
            if [ $(( COPIED % 500 )) -eq 0 ] || [ "${COPIED}" -eq "${TOTAL_FILES}" ]; then
              PCT=0
              if [ "${TOTAL_BYTES}" -gt 0 ]; then
                PCT=$(( COPIED_BYTES * 100 / TOTAL_BYTES ))
              fi
              echo "[copy-index-to-ram] $(date -u '+%Y-%m-%dT%H:%M:%SZ') Progress: ${COPIED}/${TOTAL_FILES} files, ${COPIED_MB}/${TOTAL_MB} MiB copied (${PCT}%)"
            fi
          done

          echo "[copy-index-to-ram] $(date -u '+%Y-%m-%dT%H:%M:%SZ') Copy complete. Verifying ..."
          DEST_BYTES=$(du -sb "${DST}" 2>/dev/null | awk '{print $1}' || echo 0)
          DEST_MB=$(( DEST_BYTES / 1048576 ))
          echo "[copy-index-to-ram] $(date -u '+%Y-%m-%dT%H:%M:%SZ') RAM disk index size: ${DEST_MB} MiB — ready."
        resources:
          requests:
            cpu: "500m"
            memory: "256Mi"
          limits:
            cpu: "2"
            memory: "26Gi"
        volumeMounts:
        - name: photon-storage
          mountPath: /photon-store
          readOnly: true
        - name: photon-ramdisk
          mountPath: /photon-ram
      - name: prepare-runtime-files
        image: busybox:1.36
        env:
        - name: PHOTON_VERSION
          valueFrom:
            configMapKeyRef:
              name: osm-photon-config
              key: photon_version
        - name: SSL_CERT_FILE
          value: /ca-certs/ca.crt
        - name: CURL_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: REQUESTS_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: NODE_EXTRA_CA_CERTS
          value: /ca-certs/ca.crt
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          JAR="/photon-store/bin/photon-${PHOTON_VERSION}.jar"
          test -s "${JAR}" || { echo "ERROR: ${JAR} missing"; exit 1; }
          test -d /photon-ram/active/photon_data || { echo "ERROR: /photon-ram/active/photon_data missing"; exit 1; }
          test -d /photon-ram/active/photon_data/node_1/data/nodes/0 || { echo "ERROR: /photon-ram/active/photon_data/node_1/data/nodes/0 missing"; exit 1; }
          ln -sfn /photon-lock/node.lock /photon-ram/active/photon_data/node_1/data/nodes/0/node.lock
          : > /photon-lock/node.lock
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "50m"
            memory: "64Mi"
        volumeMounts:
        - name: photon-storage
          mountPath: /photon-store
          readOnly: true
        - name: photon-ramdisk
          mountPath: /photon-ram
        - name: ca-certs
          mountPath: /ca-certs
          readOnly: true
        - name: photon-lock
          mountPath: /photon-lock
      containers:
      - name: photon
        image: eclipse-temurin:21-jre
        env:
        - name: PHOTON_VERSION
          valueFrom:
            configMapKeyRef:
              name: osm-photon-config
              key: photon_version
        - name: SSL_CERT_FILE
          value: /ca-certs/ca.crt
        - name: CURL_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: REQUESTS_CA_BUNDLE
          value: /ca-certs/ca.crt
        - name: NODE_EXTRA_CA_CERTS
          value: /ca-certs/ca.crt
        - name: JAVA_TOOL_OPTIONS
          value: -Djavax.net.ssl.trustStore=/ca-certs/cacerts -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=changeit
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          exec java -jar "/photon-store/bin/photon-${PHOTON_VERSION}.jar" serve \
            -listen-ip 0.0.0.0 -listen-port 2322 -cors-any -data-dir /photon-ram/active
        ports:
        - containerPort: 2322
        resources:
          requests:
            memory: "3Gi"
            cpu: "1"
          limits:
            memory: "44Gi"
            cpu: "4"
        readinessProbe:
          httpGet:
            path: /status
            port: 2322
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 30
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /status
            port: 2322
          periodSeconds: 10
          failureThreshold: 60
          timeoutSeconds: 5
        volumeMounts:
        - name: photon-storage
          mountPath: /photon-store
          readOnly: true
        - name: photon-ramdisk
          mountPath: /photon-ram
        - name: photon-lock
          mountPath: /photon-lock
        - name: ca-certs
          mountPath: /ca-certs
          readOnly: true
      volumes:
      - name: photon-storage
        persistentVolumeClaim:
          claimName: photon
      - name: photon-ramdisk
        emptyDir:
          medium: Memory
          sizeLimit: 40Gi
      - name: photon-lock
        emptyDir: {}
      - name: ca-certs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: photon
  namespace: osm
spec:
  type: NodePort
  selector:
    app: photon
  ports:
  - name: http
    port: 2322
    targetPort: 2322
    nodePort: 30087
