apiVersion: v1
kind: ConfigMap
metadata:
  name: osm-auto-update-filter-config
  namespace: osm
data:
  welt_filter.txt: |
    n/place=country,state,region,city,ocean,sea
    r/boundary=administrative+admin_level=1,2,3,4
    n/natural=ocean,sea,bay,strait
    w/natural=ocean,sea,bay,strait
    r/natural=ocean,sea,bay,strait
    w/water=lake,reservoir
    r/water=lake,reservoir
    n/water=lake,reservoir
    w/waterway=river
    r/waterway=river
    n/waterway=river
    n/tourism=theme_park
    w/tourism=theme_park
    r/tourism=theme_park
    n/leisure=water_park
    w/leisure=water_park
    r/leisure=water_park
    n/attraction=roller_coaster
    w/attraction=roller_coaster
    r/attraction=roller_coaster
    w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link
    n/highway=motorway_junction
    n/construction=theme_park
    w/construction=theme_park
    r/construction=theme_park
    
