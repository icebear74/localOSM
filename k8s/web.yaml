apiVersion: v1
kind: ConfigMap
metadata:
  name: osm-web-app
  namespace: osm
data:
  app.py: |
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    import gzip
    import json
    import math
    import os
    import re
    import urllib.parse
    import urllib.request
    import urllib.error

    HOST = os.environ.get("WEB_HOST", "0.0.0.0")
    PORT = int(os.environ.get("WEB_PORT", "8080"))

    def _load_service_targets():
        raw = os.environ.get("SERVICE_TARGETS_JSON", "")
        if not raw:
            return {}
        try:
            payload = json.loads(raw)
        except Exception:
            return {}
        if not isinstance(payload, dict):
            return {}
        cleaned = {}
        for key, value in payload.items():
            if isinstance(value, str) and value.strip():
                cleaned[key] = value.strip()
        return cleaned

    SERVICE_TARGETS = _load_service_targets()
    VALHALLA_URL = SERVICE_TARGETS.get("valhalla", os.environ.get("VALHALLA_URL", "http://valhalla.osm.svc.cluster.local:8002"))
    NOMINATIM_URL = SERVICE_TARGETS.get("nominatim", os.environ.get("NOMINATIM_URL", "http://nominatim.osm.svc.cluster.local:8080"))
    PHOTON_URL = SERVICE_TARGETS.get("photon", os.environ.get("PHOTON_URL", "http://photon.osm.svc.cluster.local:2322"))
    PELIAS_URL = SERVICE_TARGETS.get("pelias", os.environ.get("PELIAS_URL", "http://pelias.osm.svc.cluster.local:4000"))
    TILESERVER_URL = SERVICE_TARGETS.get("tileserver", os.environ.get("TILESERVER_URL", "http://tileserver-gl.osm.svc.cluster.local"))
    STATUS_URL = SERVICE_TARGETS.get("status", os.environ.get("STATUS_URL", ""))
    PLANET_UPDATE_REQUEST_FILE = os.environ.get("PLANET_UPDATE_REQUEST_FILE", "/state/planet-update-request.flag")
    PLANET_UPDATE_STATUS_FILE = os.environ.get("PLANET_UPDATE_STATUS_FILE", "/status/planet-update.json")

    INDEX_HTML = """<!doctype html>
    <html lang="de">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>localOSM – Routing &amp; Karte</title>
      <link rel="stylesheet" href="/static/maplibre-gl.css"/>
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        #header { background: #2c7ab5; color: #fff; padding: 0.6rem 1rem; display: flex; align-items: center; gap: 1rem; }
        #header h1 { font-size: 1.1rem; }
        #header a { color: #cde; font-size: 0.85rem; text-decoration: none; }
        #main { display: flex; flex: 1; overflow: hidden; }
        #map-container { flex: 1; position: relative; display: flex; }
        #sidebar { width: 340px; min-width: 280px; background: #f8f9fa; border-right: 1px solid #ddd;
                   display: flex; flex-direction: column; overflow-y: auto; padding: 1rem; gap: 0.75rem; }
        #map { flex: 1; height: 100%; }
        label { font-size: 0.8rem; font-weight: 600; color: #444; display: block; margin-bottom: 2px; }
        label input[type="checkbox"] { display: inline; width: auto; margin-right: 0.5rem; }
        input, select { width: 100%; padding: 0.45rem 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.85rem; }
        .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
        .btn { padding: 0.55rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: 600; width: 100%; }
        .btn-primary { background: #2c7ab5; color: #fff; }
        .btn-secondary { background: #6c757d; color: #fff; }
        .btn:hover { filter: brightness(1.1); }
        #result-box { background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 0.75rem; font-size: 0.82rem; }
        #result-box .ok { color: #1a7a1a; font-weight: 600; }
        #result-box .err { color: #c00; font-weight: 600; }
        .hint { font-size: 0.75rem; color: #888; }
        #planet-update-box { background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 0.75rem; font-size: 0.82rem; }
        #planet-update-box .pu-status { font-size: 0.78rem; color: #555; margin-top: 0.4rem; }
        #planet-update-box .ok { color: #1a7a1a; font-weight: 600; }
        #planet-update-box .err { color: #c00; font-weight: 600; }
        .section-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: #777; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
        .geocode-row { display: flex; gap: 4px; }
        .geocode-row input { flex: 1; }
        .geocode-row button { white-space: nowrap; padding: 0 0.6rem; border: 1px solid #ccc; border-radius: 4px; background: #e9ecef; cursor: pointer; font-size: 0.8rem; }
        .photon-search { position: relative; }
        .photon-search input { border-color: #2c7ab5; }
        .pelias-search { position: relative; }
        .pelias-search input { border-color: #b55a2c; }
        .photon-results, .pelias-results { position: absolute; z-index: 20; left: 0; right: 0; top: 100%; background: #fff; border: 1px solid #ccc;
                          border-top: none; border-radius: 0 0 4px 4px; max-height: 220px; overflow-y: auto; box-shadow: 0 4px 8px rgba(0,0,0,.15); display: none; }
        .photon-results div, .pelias-results div { padding: 0.4rem 0.5rem; font-size: 0.8rem; cursor: pointer; border-bottom: 1px solid #eee; }
        .photon-results div:last-child, .pelias-results div:last-child { border-bottom: none; }
        .photon-results div:hover, .photon-results div.active,
        .pelias-results div:hover, .pelias-results div.active { background: #eaf2f8; }
        .hidden { display: none !important; }
        .advanced-options { display: none; }
        .advanced-options.visible { display: block; }
        .advanced-param { display: flex; flex-direction: column; gap: 0.25rem; }
        .advanced-param .advanced-param-toggle { display: flex; align-items: center; gap: 0.35rem; font-size: 0.78rem; color: #4a4a4a; }
        .advanced-param input:disabled, .advanced-param select:disabled { opacity: 0.6; background: #f1f3f5; }
        #zoom-display { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.6); color: #fff; padding: 6px 10px; border-radius: 4px; font-size: 0.85rem; font-weight: 600; z-index: 10; pointer-events: none; }
      </style>
    </head>
    <body>
    <div id="header">
      <h1>&#127757; localOSM</h1>
      <a href="#" id="status-link" data-port="30083">Status-Dashboard &rarr;</a>
    </div>
    <div id="main">
      <div id="sidebar">
      <div>
        <label>Suchdienst</label>
        <select id="geocoder-provider" onchange="updateGeocoderUi()">
          <option value="photon_nominatim">Photon + Nominatim</option>
          <option value="pelias">Pelias</option>
        </select>
        </div>
      <div class="section-title">Start</div>
      <div class="photon-search provider-photon-only">
        <label>Volltextsuche (Photon)</label>
        <input id="startPhoton" placeholder="Ab 3 Zeichen tippen ..." autocomplete="off"
               oninput="onPhotonInput('start')" onkeydown="onPhotonKeydown(event, 'start')">
        <div id="startPhotonResults" class="photon-results"></div>
      </div>
      <div class="pelias-search provider-pelias-only">
        <label>Volltextsuche (Pelias)</label>
        <input id="startPelias" placeholder="Ab 3 Zeichen tippen ..." autocomplete="off"
               oninput="onPeliasInput('start')" onkeydown="onPeliasKeydown(event, 'start')">
        <div id="startPeliasResults" class="pelias-results"></div>
      </div>
        <div>
          <label>Adresse suchen</label>
          <div class="geocode-row">
            <input id="startAddr" placeholder="z.B. Brandenburger Tor, Berlin">
            <button onclick="geocode('start')">&#128269;</button>
          </div>
        </div>
        <div class="row2">
          <div><label>Breitengrad</label><input id="startLat" placeholder="wird per Klick/Suche gesetzt" step="any"></div>
          <div><label>Längengrad</label><input id="startLon" placeholder="wird per Klick/Suche gesetzt" step="any"></div>
        </div>

        <div class="section-title">Ziel</div>
        <div class="photon-search provider-photon-only">
          <label>Volltextsuche (Photon)</label>
          <input id="endPhoton" placeholder="Ab 3 Zeichen tippen ..." autocomplete="off"
                 oninput="onPhotonInput('end')" onkeydown="onPhotonKeydown(event, 'end')">
          <div id="endPhotonResults" class="photon-results"></div>
        </div>
        <div class="pelias-search provider-pelias-only">
          <label>Volltextsuche (Pelias)</label>
          <input id="endPelias" placeholder="Ab 3 Zeichen tippen ..." autocomplete="off"
                 oninput="onPeliasInput('end')" onkeydown="onPeliasKeydown(event, 'end')">
          <div id="endPeliasResults" class="pelias-results"></div>
        </div>
        <div>
          <label>Adresse suchen</label>
          <div class="geocode-row">
            <input id="endAddr" placeholder="z.B. Alexanderplatz, Berlin">
            <button onclick="geocode('end')">&#128269;</button>
          </div>
        </div>
        <div class="row2">
          <div><label>Breitengrad</label><input id="endLat" placeholder="wird per Klick/Suche gesetzt" step="any"></div>
          <div><label>Längengrad</label><input id="endLon" placeholder="wird per Klick/Suche gesetzt" step="any"></div>
        </div>

        <div class="section-title">Optionen</div>
        <div class="row2">
          <div>
            <label>Verkehrsmittel</label>
            <select id="costing">
              <option value="auto">Auto</option>
              <option value="pedestrian">Zu Fuß</option>
              <option value="bicycle">Fahrrad</option>
              <option value="truck">LKW</option>
            </select>
          </div>
          <div>
            <label>Einheiten</label>
            <select id="units">
              <option value="km">km</option>
              <option value="miles">Meilen</option>
            </select>
          </div>
        </div>
        <div class="row2">
          <div>
            <label style="display:flex;align-items:center;gap:0.35rem">
              <input id="advanced-options-enabled" type="checkbox">
              Erweiterte Angaben
            </label>
            <div class="hint" style="margin-top:0.25rem">Wenn deaktiviert, wirkt nur noch der Route-Tradeoff.</div>
          </div>
          <div></div>
        </div>
        <div class="row2">
          <div>
            <label>Route-Tradeoff</label>
            <input id="shortest" type="range" min="0" max="1" step="0.1" value="0.2">
            <div class="hint" id="shortest-value" style="margin-top:0.25rem">0.2 (eher schnell; 0.0–0.4 = schnell, 0.5–1.0 = kurz)</div>
          </div>
          <div></div>
        </div>
        <div id="advanced-options" class="advanced-options">
          <div class="row2">
            <div class="advanced-param">
              <label class="advanced-param-toggle" for="toll_penalty_enabled">
                <input id="toll_penalty_enabled" type="checkbox" data-target="toll_penalty">
