            </div>
            <div class="advanced-param">
              <label class="advanced-param-toggle" for="ferry_penalty_enabled">
                <input id="ferry_penalty_enabled" type="checkbox" data-target="ferry_penalty">
                Fähren-Willigkeit (0–1)
              </label>
              <input id="ferry_penalty" type="number" min="0" max="1" step="0.1" value="0.5" title="Gültige Werte: 0.0 bis 1.0; 0.0 = vermeiden, 1.0 = bevorzugen" disabled>
            </div>
          </div>
          <div class="row2">
            <div class="advanced-param">
              <label class="advanced-param-toggle" for="tunnel_penalty_enabled">
                <input id="tunnel_penalty_enabled" type="checkbox" data-target="tunnel_penalty">
                Tunnel-Penalty
              </label>
              <input id="tunnel_penalty" type="number" min="0" step="1" value="0" title="Gültige Werte: 0 oder positive ganze Zahlen; höher = stärker vermeiden" disabled>
            </div>
            <div class="advanced-param">
              <label class="advanced-param-toggle" for="highway_penalty_enabled">
                <input id="highway_penalty_enabled" type="checkbox" data-target="highway_penalty">
                Autobahn-Willigkeit (0–1)
              </label>
              <input id="highway_penalty" type="number" min="0" max="1" step="0.1" value="0.5" title="Gültige Werte: 0.0 bis 1.0; 0.0 = vermeiden, 1.0 = bevorzugen" disabled>
            </div>
          </div>
          <div class="row2">
            <div class="advanced-param">
              <label class="advanced-param-toggle" for="unpaved_penalty_enabled">
                <input id="unpaved_penalty_enabled" type="checkbox" data-target="unpaved_penalty">
                Unbefestigte Wege-Penalty
              </label>
              <input id="unpaved_penalty" type="number" min="0" step="1" value="0" title="Gültige Werte: 0 oder positive ganze Zahlen; höher = stärker vermeiden" disabled>
            </div>
            <div class="advanced-param">
              <label class="advanced-param-toggle" for="living_street_penalty_enabled">
                <input id="living_street_penalty_enabled" type="checkbox" data-target="living_street_penalty">
                Wohnstraßen-Willigkeit (0–1)
              </label>
              <input id="living_street_penalty" type="number" min="0" max="1" step="0.1" value="0.1" title="Gültige Werte: 0.0 bis 1.0; 0.0 = vermeiden, 1.0 = bevorzugen" disabled>
            </div>
          </div>
          <div class="row2">
            <div class="advanced-param">
              <label class="advanced-param-toggle" for="primary_penalty_enabled">
                <input id="primary_penalty_enabled" type="checkbox" data-target="primary_penalty">
                Primärstraßen-Willigkeit (0–1)
              </label>
              <input id="primary_penalty" type="number" min="0" max="1" step="0.1" value="0.5" title="Gültige Werte: 0.0 bis 1.0; 0.0 = vermeiden, 1.0 = bevorzugen" disabled>
            </div>
            <div></div>
          </div>
          <div class="row2">
            <div class="advanced-param">
              <label class="advanced-param-toggle" for="top_speed_enabled">
                <input id="top_speed_enabled" type="checkbox" data-target="top_speed">
                Max. Geschwindigkeit (km/h)
              </label>
              <input id="top_speed" type="number" min="1" step="1" value="120" disabled>
            </div>
            <div class="advanced-param">
              <label class="advanced-param-toggle" for="width_enabled">
                <input id="width_enabled" type="checkbox" data-target="width">
                Fahrzeugbreite (m)
              </label>
              <input id="width" type="number" min="0.1" step="0.1" value="2.0" disabled>
            </div>
          </div>
          <div class="row2">
            <div class="advanced-param">
              <label class="advanced-param-toggle" for="height_enabled">
                <input id="height_enabled" type="checkbox" data-target="height">
                Fahrzeughöhe (m)
              </label>
              <input id="height" type="number" min="0.1" step="0.1" value="2.0" disabled>
            </div>
            <div class="advanced-param">
              <label class="advanced-param-toggle" for="length_enabled">
                <input id="length_enabled" type="checkbox" data-target="length">
                Fahrzeuglänge (m)
              </label>
              <input id="length" type="number" min="0.1" step="0.1" value="5.0" disabled>
            </div>
          </div>
          <div class="row2">
            <div class="advanced-param">
              <label class="advanced-param-toggle" for="weight_enabled">
                <input id="weight_enabled" type="checkbox" data-target="weight">
                Fahrzeuggewicht (kg)
              </label>
              <input id="weight" type="number" min="100" step="100" value="1800" disabled>
            </div>
            <div class="advanced-param">
              <label class="advanced-param-toggle" for="axle_load_enabled">
                <input id="axle_load_enabled" type="checkbox" data-target="axle_load">
                Achslast (kg)
              </label>
              <input id="axle_load" type="number" min="100" step="100" value="1000" disabled>
            </div>
          </div>
          <div class="row2">
            <div class="advanced-param">
              <label class="advanced-param-toggle" for="hazmat_enabled">
                <input id="hazmat_enabled" type="checkbox" data-target="hazmat">
                Gefährliche Stoffe
              </label>
              <select id="hazmat" disabled><option value="">Nein</option><option value="true">Ja</option></select>
            </div>
            <div class="advanced-param">
              <label class="advanced-param-toggle" for="use_service_enabled">
                <input id="use_service_enabled" type="checkbox" data-target="use_service">
                Service-Strecken
              </label>
              <select id="use_service" disabled><option value="true">Erlauben</option><option value="false">Vermeiden</option></select>
            </div>
          </div>
          <div class="row2">
            <div class="advanced-param">
              <label class="advanced-param-toggle" for="use_trails_enabled">
                <input id="use_trails_enabled" type="checkbox" data-target="use_trails">
                Wegenetz: Pfade
              </label>
              <select id="use_trails" disabled><option value="true">Erlauben</option><option value="false" selected>Vermeiden</option></select>
            </div>
            <div class="advanced-param">
              <label class="advanced-param-toggle" for="use_tracks_enabled">
                <input id="use_tracks_enabled" type="checkbox" data-target="use_tracks">
                Wegenetz: Tracks
              </label>
              <select id="use_tracks" disabled><option value="true">Erlauben</option><option value="false" selected>Vermeiden</option></select>
            </div>
          </div>
          <div class="row2">
            <div class="advanced-param">
              <label class="advanced-param-toggle" for="use_residential_enabled">
                <input id="use_residential_enabled" type="checkbox" data-target="use_residential">
                Wegenetz: Wohnstraßen
              </label>
              <select id="use_residential" disabled><option value="true">Erlauben</option><option value="false">Vermeiden</option></select>
            </div>
            <div class="advanced-param">
              <label class="advanced-param-toggle" for="use_primary_enabled">
                <input id="use_primary_enabled" type="checkbox" data-target="use_primary">
                Wegenetz: Primär
              </label>
              <select id="use_primary" disabled><option value="true">Erlauben</option><option value="false">Vermeiden</option></select>
            </div>
          </div>
        </div>
        <div class="row2">
          <div>
            <label>Route-Anweisungen</label>
            <select id="instruction-language">
              <option value="de">Deutsch</option>
              <option value="en">English</option>
            </select>
            <div class="hint">Sprache der Route-Anweisungen.</div>
          </div>
          <div></div>
        </div>
        <div class="row2">
          <button class="btn btn-secondary" onclick="saveRouteDefaults()">⭐ Als Standard speichern</button>
          <button class="btn btn-secondary" onclick="resetRouteDefaults()">↺ Standard zurücksetzen</button>
        </div>
        <button class="btn btn-primary" onclick="doRoute()">&#128205; Route berechnen</button>
        <button class="btn btn-secondary" onclick="doDistance()">&#8596; Nur Distanz</button>
        <p class="hint">Tipp: Klicke auf die Karte, um Start- (1. Klick) und Zielpunkt (2. Klick) zu setzen. Die erweiterten Optionen lassen sich als Browser-Standard speichern.</p>
        <div id="result-box">Noch keine Anfrage.</div>
        <div id="route-instructions" class="hint" style="margin-top:0.75rem"></div>
        
        <div class="section-title">Planet-Update</div>
        <div id="planet-update-box">
          <div id="pu-status-line" class="pu-status">Lade Status...</div>
          <div id="pu-mtime-line" class="pu-status"></div>
          <button class="btn btn-secondary" style="margin-top:0.5rem" onclick="triggerPlanetUpdate()">&#127758; Planet-Update jetzt starten</button>
        </div>
      </div>
      <div id="map-container" style="flex:1;position:relative;">
        <div id="map"></div>
        <div id="zoom-display">Zoom: 9</div>
      </div>
    </div>

    <script src="/static/maplibre-gl.js"></script>
    <script id="service-targets-json" type="application/json">{{SERVICE_TARGETS_JSON}}</script>
    <script>
    var SERVICE_TARGETS = {};
    try {
      SERVICE_TARGETS = JSON.parse(document.getElementById('service-targets-json').textContent || '{}');
    } catch (e) {}
    function resolveServiceTarget(key, fallbackBase) {
      var configured = (SERVICE_TARGETS && SERVICE_TARGETS[key]) || '';
      if (configured) return configured.replace(/\/+$/, '');
      return fallbackBase.replace(/\/+$/, '');
    }
    function updateLinks() {
      var baseUrl = location.protocol + '//' + location.hostname;
      var statusUrl = resolveServiceTarget('status', baseUrl + ':30083');
      var statusLink = document.getElementById('status-link');
      if (statusLink) statusLink.href = statusUrl + '/';
    }
    updateLinks();

    // ---- Planet-Update Panel ----
    function loadPlanetUpdateStatus() {
      fetch('/api/planet-update/status')
        .then(function(r) { return r.json(); })
        .then(function(d) {
          var sl = document.getElementById('pu-status-line');
          var ml = document.getElementById('pu-mtime-line');
          if (d.error) { sl.innerHTML = "<span class='err'>Fehler: " + d.error + "</span>"; return; }
          if (d.running) {
            sl.innerHTML = '&#9203; Läuft gerade &hellip; (gestartet: ' + (d.last_run_at || '?') + ')';
          } else if (d.last_success_at) {
            sl.innerHTML = "<span class='ok'>&#10003; Letzter Erfolg:</span> " + d.last_success_at;
          } else {
            sl.innerHTML = 'Noch nie ausgeführt.';
          }
          if (d.last_error) {
            sl.innerHTML += "<br><span class='err'>Fehler: " + d.last_error + "</span>";
          }
          ml.textContent = d.output_file_mtime ? 'Datenstand: ' + d.output_file_mtime : '';
        })
        .catch(function() {
          document.getElementById('pu-status-line').innerHTML = "<span class='err'>Status nicht verfügbar.</span>";
        });
    }
    function triggerPlanetUpdate() {
      fetch('/api/planet-update/trigger', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'})
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (d.error) { alert('Fehler: ' + d.error); return; }
          alert(d.message || 'Planet-Update angefordert.');
          setTimeout(loadPlanetUpdateStatus, 1500);
        })
        .catch(function() { alert('Planet-Update konnte nicht angefordert werden.'); });
    }
    loadPlanetUpdateStatus();
    setInterval(loadPlanetUpdateStatus, 30000);

    var map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          openmaptiles: {
            type: 'vector',
            tiles: [location.protocol + '//' + location.host + '/tiles/{z}/{x}/{y}.pbf'],
            minzoom: 0,
            maxzoom: 16
          }
        },
        glyphs: location.protocol + '//' + location.host + '/fonts/{fontstack}/{range}.pbf',
        layers: [
          {id:'background',type:'background',paint:{'background-color':'#f2efe9'}},
