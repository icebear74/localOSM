          {id:'place-city',type:'symbol',source:'openmaptiles','source-layer':'place',filter:['in','class','city'],layout:{'text-field':['coalesce',['get','name:de'],['get','name:en'],['get','name']],'text-font':['KlokanTech Noto Sans Regular'],'text-size':['interpolate',['linear'],['zoom'],6,11,10,15,14,18]},paint:{'text-color':'#222','text-halo-color':'rgba(255,255,255,0.9)','text-halo-width':2}},
          {id:'place-town',type:'symbol',source:'openmaptiles','source-layer':'place',filter:['==','class','town'],minzoom:8,layout:{'text-field':['coalesce',['get','name:de'],['get','name:en'],['get','name']],'text-font':['KlokanTech Noto Sans Regular'],'text-size':['interpolate',['linear'],['zoom'],8,10,12,14,16,17]},paint:{'text-color':'#333','text-halo-color':'rgba(255,255,255,0.9)','text-halo-width':1.5}},
          {id:'place-village',type:'symbol',source:'openmaptiles','source-layer':'place',filter:['==','class','village'],minzoom:10,layout:{'text-field':['coalesce',['get','name:de'],['get','name:en'],['get','name']],'text-font':['KlokanTech Noto Sans Regular'],'text-size':['interpolate',['linear'],['zoom'],10,10,14,13]},paint:{'text-color':'#444','text-halo-color':'rgba(255,255,255,0.9)','text-halo-width':1.5}},
          {id:'place-suburb',type:'symbol',source:'openmaptiles','source-layer':'place',filter:['in','class','suburb','quarter','neighbourhood'],minzoom:12,layout:{'text-field':['coalesce',['get','name:de'],['get','name:en'],['get','name']],'text-font':['KlokanTech Noto Sans Regular'],'text-size':11},paint:{'text-color':'#555','text-halo-color':'rgba(255,255,255,0.9)','text-halo-width':1.5}},
          {id:'place-hamlet',type:'symbol',source:'openmaptiles','source-layer':'place',filter:['in','class','hamlet','isolated_dwelling'],minzoom:13,layout:{'text-field':['coalesce',['get','name:de'],['get','name:en'],['get','name']],'text-font':['KlokanTech Noto Sans Regular'],'text-size':10},paint:{'text-color':'#666','text-halo-color':'rgba(255,255,255,0.9)','text-halo-width':1.5}}
        ]
      },
      center: [10, 50],
      zoom: 2,
      attributionControl: true
    });

    // Firefox sometimes computes a 0-size WebGL canvas when the map is created
    // inside a flexbox layout before the surrounding layout has settled, leaving
    // a blank map until the window is manually resized (Chromium/Edge are more
    // forgiving here). Force a resize once the container has its final size,
    // and keep the map in sync with later container size changes.
    if (window.ResizeObserver) {
      new ResizeObserver(function() { map.resize(); }).observe(document.getElementById('map-container'));
    }
    window.addEventListener('resize', function() { map.resize(); });

    // The style embedded above is only a fallback so the map is usable
    // immediately. Swap it for the style actually configured in TileServer-GL
    // (e.g. via the Maputnik style editor) as soon as it is available, so the
    // routing window shows the same style as the tile server.
    fetch('/api/style').then(function(resp) {
      if (!resp.ok) throw new Error('style fetch failed: ' + resp.status);
      return resp.json();
    }).then(function(styleJson) {
      map.setStyle(styleJson);
    }).catch(function(e) {
      console.warn('Falling back to built-in style; failed to load configured TileServer-GL style:', e);
    });

    // The map is interactive (pan/zoom/click) from the moment it is created,
    // even before any address has been searched -- users can already explore
    // the imported area and click to set start/end points.
    map.on('load', function() {
      map.resize();
      fitToDataBounds();
    });

    // Zoom/center on the actual extent of the imported map data instead of a
    // hardcoded location, so e.g. an import that only contains Luxembourg
    // opens centered on Luxembourg rather than on an unrelated default.
    async function fitToDataBounds() {
      try {
        var resp = await fetch('/api/bounds');
        var data = await resp.json();
        var b = data.bounds;
        if (Array.isArray(b) && b.length === 4 && b.every(function(v) { return typeof v === 'number' && isFinite(v); })) {
          map.fitBounds([[b[0], b[1]], [b[2], b[3]]], {padding: 40, animate: false});
        }
      } catch (e) { /* keep the default world view if bounds are unavailable */ }
    }

    var markers = { start: null, end: null };
    var clickState = 0; // 0=start, 1=end

    function setMarker(which, lat, lon) {
      var bg = which === 'start' ? '#2c7ab5' : '#c0392b';
      var label = which === 'start' ? 'S' : 'Z';
      var el = document.createElement('div');
      el.style.cssText = 'background:' + bg + ';color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:bold;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)';
      el.textContent = label;
      if (markers[which]) markers[which].remove();
      markers[which] = new maplibregl.Marker({element: el, anchor: 'center'})
        .setLngLat([lon, lat])
        .addTo(map);
      document.getElementById(which + 'Lat').value = lat.toFixed(6);
      document.getElementById(which + 'Lon').value = lon.toFixed(6);
    }

    map.on('click', function(e) {
      var lat = e.lngLat.lat, lon = e.lngLat.lng;
      if (clickState === 0) {
        setMarker('start', lat, lon);
        reverseGeocode('start', lat, lon);
        clickState = 1;
      } else {
        setMarker('end', lat, lon);
        reverseGeocode('end', lat, lon);
        clickState = 0;
        doRoute();
      }
    });

    // Update zoom level display
    function updateZoomDisplay() {
      var zoomLevel = Math.round(map.getZoom() * 10) / 10;
      document.getElementById('zoom-display').textContent = 'Zoom: ' + zoomLevel.toFixed(1);
    }
    map.on('zoom', updateZoomDisplay);
    map.on('move', updateZoomDisplay);
    updateZoomDisplay(); // Initialize on load

    // Reverse geocode a coordinate and populate the address input
    async function reverseGeocode(which, lat, lon) {
      try {
        var provider = document.getElementById('geocoder-provider').value || 'photon_nominatim';
        var resp = await fetch('/api/reverse?provider=' + encodeURIComponent(provider) + '&lat=' + lat + '&lon=' + lon);
        var data = await resp.json();
        if (!data.error && data.display_name) {
          document.getElementById(which + 'Addr').value = data.display_name;
        }
      } catch(e) { /* silently ignore */ }
    }

    // Valhalla uses 1e-6 precision polyline encoding
    function decodePolyline(encoded) {
      var coords = [], index = 0, lat = 0, lng = 0;
      while (index < encoded.length) {
        var b, shift = 0, result = 0;
        do { b = encoded.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lat += (result & 1) ? ~(result >> 1) : (result >> 1);
        shift = 0; result = 0;
        do { b = encoded.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lng += (result & 1) ? ~(result >> 1) : (result >> 1);
        coords.push([lat / 1e6, lng / 1e6]);
      }
      return coords;
    }

    function drawRoute(trip) {
      var allCoords = [];
      (trip.legs || []).forEach(function(leg) {
        decodePolyline(leg.shape || '').forEach(function(c) {
          allCoords.push([c[1], c[0]]); // MapLibre GL uses [lng, lat]
        });
      });
      if (allCoords.length === 0) return;
      var geojson = {type:'Feature',geometry:{type:'LineString',coordinates:allCoords}};
      if (map.getSource('route')) {
        map.getSource('route').setData(geojson);
      } else {
        map.addSource('route', {type:'geojson', data: geojson});
        map.addLayer({id:'route-line',type:'line',source:'route',
          paint:{'line-color':'#2c7ab5','line-width':5,'line-opacity':0.8}});
      }
      var bounds = allCoords.reduce(function(b, c) { return b.extend(c); },
        new maplibregl.LngLatBounds(allCoords[0], allCoords[0]));
      map.fitBounds(bounds, {padding: 30});
    }

    function fmtDuration(secs) {
      if (secs < 60) return secs + ' s';
      var m = Math.floor(secs / 60), s = secs % 60;
      if (m < 60) return m + ' min ' + (s > 0 ? s + ' s' : '');
      var h = Math.floor(m / 60); m = m % 60;
      return h + ' h ' + (m > 0 ? m + ' min' : '');
    }

    function updateShortestLabel() {
      var el = document.getElementById('shortest');
      var valueEl = document.getElementById('shortest-value');
      if (!el || !valueEl) return;
      var value = parseFloat(el.value);
      if (!isFinite(value)) value = 0.2;
      var mode = value < 0.5 ? 'eher schnell' : 'eher kurz';
      valueEl.textContent = value.toFixed(1) + ' (' + mode + '; 0.0–0.4 = schnell, 0.5–1.0 = kurz)';
    }

    function normalizeInstructionValue(value) {
      if (typeof value === 'string') return value;
      if (Array.isArray(value)) return value.join(', ');
      if (value == null) return '';
      return String(value);
    }

    function formatInstruction(maneuver, language) {
      var lang = language === 'en' ? 'en' : 'de';
      var type = normalizeInstructionValue(maneuver && maneuver.type).toLowerCase();
      var modifier = normalizeInstructionValue(maneuver && maneuver.modifier).toLowerCase();
      var streetNames = [];
      if (Array.isArray(maneuver && maneuver.street_names)) streetNames = maneuver.street_names;
      else if (Array.isArray(maneuver && maneuver.streets)) streetNames = maneuver.streets;
      var streetText = streetNames.length ? (lang === 'en' ? ' onto ' + streetNames.join(', ') : ' auf ' + streetNames.join(', ')) : '';
      switch (type) {
        case 'depart':
          return lang === 'en' ? 'Start' + streetText + '.' : 'Starten Sie' + streetText + '.';
        case 'arrive':
          return lang === 'en' ? 'Arrive at destination.' : 'Ziel erreicht.';
        case 'turn':
          if (modifier === 'right') return lang === 'en' ? 'Turn right' + streetText + '.' : 'Biegen Sie rechts ab' + streetText + '.';
          if (modifier === 'left') return lang === 'en' ? 'Turn left' + streetText + '.' : 'Biegen Sie links ab' + streetText + '.';
          if (modifier === 'slight right') return lang === 'en' ? 'Bear right' + streetText + '.' : 'Leicht rechts weiter' + streetText + '.';
          if (modifier === 'slight left') return lang === 'en' ? 'Bear left' + streetText + '.' : 'Leicht links weiter' + streetText + '.';
          if (modifier === 'u_turn') return lang === 'en' ? 'Make a U-turn' + streetText + '.' : 'Wenden Sie' + streetText + '.';
          return lang === 'en' ? 'Turn' + streetText + '.' : 'Biegen Sie ab' + streetText + '.';
        case 'continue':
          return lang === 'en' ? 'Continue' + streetText + '.' : 'Weiterfahren' + streetText + '.';
        case 'merge':
          return lang === 'en' ? 'Merge onto' + streetText + '.' : 'Fahren Sie auf die Hauptstraße' + streetText + '.';
        case 'roundabout':
          return lang === 'en' ? 'Enter the roundabout and take the desired exit.' : 'Fahren Sie in den Kreisverkehr und verlassen Sie ihn an der gewünschten Ausfahrt.';
        case 'exit roundabout':
          return lang === 'en' ? 'Exit the roundabout' + streetText + '.' : 'Verlassen Sie den Kreisverkehr' + streetText + '.';
        case 'fork':
          return lang === 'en' ? 'At the fork, follow the direction' + streetText + '.' : 'An der Abzweigung halten Sie sich an die Richtung' + streetText + '.';
        case 'ramp':
          return lang === 'en' ? 'Take the ramp' + streetText + '.' : 'Fahren Sie auf die Auffahrt' + streetText + '.';
        case 'use lane':
          return lang === 'en' ? 'Use the appropriate lane' + streetText + '.' : 'Nutzen Sie die passende Spur' + streetText + '.';
        case 'destination':
          return lang === 'en' ? 'Arrive at destination' + streetText + '.' : 'Ziel erreichen' + streetText + '.';
        default:
          return maneuver && maneuver.instruction ? maneuver.instruction : (lang === 'en' ? 'Continue.' : 'Weiterfahren.');
      }
    }

    function buildRouteInstructions(trip, language) {
      var instructions = [];
      var instructionCounter = 0;
      (trip && trip.legs || []).forEach(function(leg) {
        (leg.maneuvers || []).forEach(function(maneuver) {
          var text = formatInstruction(maneuver, language);
          if (text) {
            instructionCounter += 1;
            instructions.push(instructionCounter + '. ' + text);
          }
        });
      });
      return instructions;
    }

    function getInstructionLanguage() {
      var el = document.getElementById('instruction-language');
      return el && el.value === 'en' ? 'en' : 'de';
    }

    function renderRouteInstructions(trip) {
      var container = document.getElementById('route-instructions');
      if (!container) return;
      var instructions = buildRouteInstructions(trip, getInstructionLanguage());
      if (!instructions.length) {
        container.innerHTML = '';
        return;
      }
      container.innerHTML = '<div class="section-title">Route-Anweisungen</div><ol style="margin:0.25rem 0 0 1rem;padding:0;display:grid;gap:0.35rem">' + instructions.map(function(text) { return '<li>' + esc(text) + '</li>'; }).join('') + '</ol>';
    }

    var ROUTE_DEFAULTS_KEY = 'localosm.routing.defaults';

    function getRouteDefaults() {
      try {
        var stored = localStorage.getItem(ROUTE_DEFAULTS_KEY);
        return stored ? JSON.parse(stored) : {};
      } catch (e) {
        return {};
      }
    }

    function setFieldValue(id, value) {
      var el = document.getElementById(id);
      if (!el) return;
      if (el.type === 'checkbox') {
        el.checked = !!value;
      } else if (el.tagName === 'SELECT') {
        el.value = value || el.options[0].value;
      } else {
        el.value = value == null ? '' : value;
      }
    }

    function isAdvancedOptionsEnabled() {
      var el = document.getElementById('advanced-options-enabled');
      return !!(el && el.checked);
    }

    function setAdvancedOptionsVisibility() {
      var container = document.getElementById('advanced-options');
      var toggle = document.getElementById('advanced-options-enabled');
      if (!container || !toggle) return;
      container.classList.toggle('visible', toggle.checked);
      syncAdvancedInputStates();
    }

    function syncAdvancedInputStates() {
      var advancedEnabled = isAdvancedOptionsEnabled();
      var toggles = document.querySelectorAll('#advanced-options input[type="checkbox"][data-target]');
      Array.prototype.forEach.call(toggles, function(toggle) {
        var targetId = toggle.getAttribute('data-target');
        var target = document.getElementById(targetId);
        toggle.disabled = !advancedEnabled;
        if (target) {
          target.disabled = !advancedEnabled || !toggle.checked;
        }
      });
    }

    function applyRouteDefaults() {
      var defaults = getRouteDefaults();
      var shortestValue = defaults.shortest;
      if (typeof shortestValue === 'boolean') {
        shortestValue = shortestValue ? 1 : 0;
      } else if (typeof shortestValue !== 'number' || !isFinite(shortestValue)) {
        shortestValue = 0.2;
      }
      var advancedOptionsEnabled = defaults.advanced_options_enabled === true;
      var tollValue = defaults.use_tolls != null ? defaults.use_tolls : (defaults.toll_penalty != null ? defaults.toll_penalty : 0.5);
      var ferryValue = defaults.use_ferry != null ? defaults.use_ferry : (defaults.ferry_penalty != null ? defaults.ferry_penalty : 0.5);
      var highwayValue = defaults.use_highways != null ? defaults.use_highways : (defaults.highway_penalty != null ? defaults.highway_penalty : 0.5);
      var livingStreetValue = defaults.use_living_streets != null ? defaults.use_living_streets : (defaults.living_street_penalty != null ? defaults.living_street_penalty : 0.1);
      var primaryValue = defaults.use_primary != null ? defaults.use_primary : (defaults.primary_penalty != null ? defaults.primary_penalty : 0.5);
      var entries = [
        ['costing', defaults.costing || 'auto'],
        ['units', defaults.units || 'km'],
        ['instruction-language', defaults.instruction_language || 'de'],
        ['toll_penalty', tollValue],
        ['ferry_penalty', ferryValue],
        ['tunnel_penalty', defaults.tunnel_penalty == null ? 0 : defaults.tunnel_penalty],
        ['highway_penalty', highwayValue],
        ['unpaved_penalty', defaults.unpaved_penalty == null ? 0 : defaults.unpaved_penalty],
        ['living_street_penalty', livingStreetValue],
        ['primary_penalty', primaryValue],
        ['shortest', shortestValue],
        ['top_speed', defaults.top_speed == null ? 120 : defaults.top_speed],
        ['width', defaults.width == null ? 2.0 : defaults.width],
        ['height', defaults.height == null ? 2.0 : defaults.height],
        ['length', defaults.length == null ? 5.0 : defaults.length],
        ['weight', defaults.weight == null ? 1800 : defaults.weight],
        ['axle_load', defaults.axle_load == null ? 1000 : defaults.axle_load],
        ['hazmat', defaults.hazmat ? 'true' : ''],
        ['use_service', defaults.use_service === false ? 'false' : 'true'],
        ['use_trails', defaults.use_trails === true ? 'true' : 'false'],
        ['use_tracks', defaults.use_tracks === true ? 'true' : 'false'],
        ['use_residential', defaults.use_residential === false ? 'false' : 'true'],
        ['use_primary', defaults.use_primary === false ? 'false' : 'true'],
        ['advanced-options-enabled', advancedOptionsEnabled]
      ];
      entries.forEach(function(item) {
        setFieldValue(item[0], item[1]);
      });
      var toggleEntries = [
        ['toll_penalty_enabled', defaults.use_tolls_enabled === true || defaults.toll_penalty_enabled === true],
        ['ferry_penalty_enabled', defaults.use_ferry_enabled === true || defaults.ferry_penalty_enabled === true],
        ['tunnel_penalty_enabled', defaults.tunnel_penalty_enabled === true],
        ['highway_penalty_enabled', defaults.use_highways_enabled === true || defaults.highway_penalty_enabled === true],
        ['unpaved_penalty_enabled', defaults.unpaved_penalty_enabled === true],
        ['living_street_penalty_enabled', defaults.use_living_streets_enabled === true || defaults.living_street_penalty_enabled === true],
        ['primary_penalty_enabled', defaults.use_primary_enabled === true || defaults.primary_penalty_enabled === true],
        ['use_primary_enabled', defaults.use_primary_select_enabled != null ? defaults.use_primary_select_enabled : (defaults.use_primary_enabled === true || defaults.primary_penalty_enabled === true)],
        ['top_speed_enabled', defaults.top_speed_enabled === true],
        ['width_enabled', defaults.width_enabled === true],
        ['height_enabled', defaults.height_enabled === true],
        ['length_enabled', defaults.length_enabled === true],
        ['weight_enabled', defaults.weight_enabled === true],
        ['axle_load_enabled', defaults.axle_load_enabled === true],
        ['hazmat_enabled', defaults.hazmat_enabled === true],
        ['use_service_enabled', defaults.use_service_enabled === true],
        ['use_trails_enabled', defaults.use_trails_enabled === true],
        ['use_tracks_enabled', defaults.use_tracks_enabled === true],
        ['use_residential_enabled', defaults.use_residential_enabled === true]
      ];
      toggleEntries.forEach(function(item) {
        setFieldValue(item[0], item[1]);
      });
      setAdvancedOptionsVisibility();
      updateShortestLabel();
    }

    function saveRouteDefaults() {
      var payload = getPayload();
      try {
        localStorage.setItem(ROUTE_DEFAULTS_KEY, JSON.stringify(payload));
        alert('Routing-Standards gespeichert.');
      } catch (e) {
        alert('Standards konnten nicht gespeichert werden.');
      }
    }

    function resetRouteDefaults() {
      try {
        localStorage.removeItem(ROUTE_DEFAULTS_KEY);
      } catch (e) {}
      applyRouteDefaults();
      alert('Routing-Standards zurückgesetzt.');
    }

    function getPayload() {
      var shortestRaw = document.getElementById('shortest').value;
      var shortestValue = parseFloat(shortestRaw);
      if (!isFinite(shortestValue)) shortestValue = 0.2;
      var advancedOptionsEnabled = isAdvancedOptionsEnabled();
      var payload = {
        start: { lat: parseFloat(document.getElementById('startLat').value),
                 lon: parseFloat(document.getElementById('startLon').value) },
        end:   { lat: parseFloat(document.getElementById('endLat').value),
                 lon: parseFloat(document.getElementById('endLon').value) },
        costing: document.getElementById('costing').value,
        units:   document.getElementById('units').value,
        instruction_language: document.getElementById('instruction-language').value,
        shortest: shortestValue,
        advanced_options_enabled: advancedOptionsEnabled
      };
      if (advancedOptionsEnabled) {
        payload.use_tolls_enabled = document.getElementById('toll_penalty_enabled').checked;
        payload.use_ferry_enabled = document.getElementById('ferry_penalty_enabled').checked;
        payload.tunnel_penalty_enabled = document.getElementById('tunnel_penalty_enabled').checked;
        payload.use_highways_enabled = document.getElementById('highway_penalty_enabled').checked;
        payload.unpaved_penalty_enabled = document.getElementById('unpaved_penalty_enabled').checked;
        payload.use_living_streets_enabled = document.getElementById('living_street_penalty_enabled').checked;
        payload.use_primary_enabled = document.getElementById('primary_penalty_enabled').checked;
        payload.use_primary_select_enabled = document.getElementById('use_primary_enabled').checked;
        payload.top_speed_enabled = document.getElementById('top_speed_enabled').checked;
        payload.width_enabled = document.getElementById('width_enabled').checked;
        payload.height_enabled = document.getElementById('height_enabled').checked;
        payload.length_enabled = document.getElementById('length_enabled').checked;
        payload.weight_enabled = document.getElementById('weight_enabled').checked;
        payload.axle_load_enabled = document.getElementById('axle_load_enabled').checked;
        payload.hazmat_enabled = document.getElementById('hazmat_enabled').checked;
        payload.use_service_enabled = document.getElementById('use_service_enabled').checked;
        payload.use_trails_enabled = document.getElementById('use_trails_enabled').checked;
        payload.use_tracks_enabled = document.getElementById('use_tracks_enabled').checked;
        payload.use_residential_enabled = document.getElementById('use_residential_enabled').checked;
        if (payload.use_tolls_enabled) payload.use_tolls = parseFloat(document.getElementById('toll_penalty').value);
        if (payload.use_ferry_enabled) payload.use_ferry = parseFloat(document.getElementById('ferry_penalty').value);
        if (payload.tunnel_penalty_enabled) payload.tunnel_penalty = parseFloat(document.getElementById('tunnel_penalty').value);
        if (payload.use_highways_enabled) payload.use_highways = parseFloat(document.getElementById('highway_penalty').value);
        if (payload.unpaved_penalty_enabled) payload.unpaved_penalty = parseFloat(document.getElementById('unpaved_penalty').value);
        if (payload.use_living_streets_enabled) payload.use_living_streets = parseFloat(document.getElementById('living_street_penalty').value);
        if (payload.use_primary_enabled) {
          payload.use_primary = parseFloat(document.getElementById('primary_penalty').value);
        } else if (document.getElementById('use_primary_enabled').checked) {
          payload.use_primary = document.getElementById('use_primary').value === 'true' ? 1.0 : 0.0;
        }
        if (payload.top_speed_enabled) payload.top_speed = parseFloat(document.getElementById('top_speed').value);
        if (payload.width_enabled) payload.width = parseFloat(document.getElementById('width').value);
        if (payload.height_enabled) payload.height = parseFloat(document.getElementById('height').value);
        if (payload.length_enabled) payload.length = parseFloat(document.getElementById('length').value);
        if (payload.weight_enabled) payload.weight = parseFloat(document.getElementById('weight').value);
        if (payload.axle_load_enabled) payload.axle_load = parseFloat(document.getElementById('axle_load').value);
        if (payload.hazmat_enabled) payload.hazmat = document.getElementById('hazmat').value === 'true';
        if (payload.use_service_enabled) payload.use_service = document.getElementById('use_service').value === 'true';
        if (payload.use_trails_enabled) payload.use_trails = document.getElementById('use_trails').value === 'true';
        if (payload.use_tracks_enabled) payload.use_tracks = document.getElementById('use_tracks').value === 'true';
        if (payload.use_residential_enabled) payload.use_residential = document.getElementById('use_residential').value === 'true';
      }
      return payload;
    }

    function hasValidPoints(payload) {
      return isFinite(payload.start.lat) && isFinite(payload.start.lon) &&
             isFinite(payload.end.lat) && isFinite(payload.end.lon);
    }

    var shortestInput = document.getElementById('shortest');
    if (shortestInput) {
      shortestInput.addEventListener('input', updateShortestLabel);
      shortestInput.addEventListener('change', updateShortestLabel);
    }
    var advancedToggle = document.getElementById('advanced-options-enabled');
    if (advancedToggle) {
      advancedToggle.addEventListener('change', setAdvancedOptionsVisibility);
    }
    var advancedOptionToggles = document.querySelectorAll('#advanced-options input[type="checkbox"][data-target]');
    Array.prototype.forEach.call(advancedOptionToggles, function(toggle) {
      toggle.addEventListener('change', syncAdvancedInputStates);
    });
    applyRouteDefaults();

    async function doRoute() {
      var box = document.getElementById('result-box');
      var payload = getPayload();
      if (!hasValidPoints(payload)) {
        box.innerHTML = '<span class="err">Bitte Start und Ziel setzen (Adresse suchen oder auf die Karte klicken).</span>';
        return;
      }
      box.innerHTML = '&#8987; Route wird berechnet ...';
      try {
        var resp = await fetch('/api/route', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        var data = await resp.json();
        if (data.error) {
          box.innerHTML = '<span class="err">Fehler: ' + data.error + '</span>';
          return;
        }
        var units = data.units || 'km';
        var dist = data.distance != null ? data.distance.toFixed(2) + ' ' + units : '?';
        var time = data.time_seconds != null ? fmtDuration(Math.round(data.time_seconds)) : '?';
        box.innerHTML = '<span class="ok">&#10003; Route gefunden</span><br>' +
          'Distanz: <b>' + dist + '</b><br>Fahrzeit: <b>' + time + '</b>';
        if (data.trip) {
          drawRoute(data.trip);
          renderRouteInstructions(data.trip);
        } else {
          renderRouteInstructions(null);
        }
        setMarker('start', payload.start.lat, payload.start.lon);
        setMarker('end', payload.end.lat, payload.end.lon);
      } catch(err) {
        box.innerHTML = '<span class="err">Netzwerkfehler: ' + err + '</span>';
      }
    }

    async function doDistance() {
      var box = document.getElementById('result-box');
      var payload = getPayload();
      if (!hasValidPoints(payload)) {
        box.innerHTML = '<span class="err">Bitte Start und Ziel setzen (Adresse suchen oder auf die Karte klicken).</span>';
        return;
      }
      box.innerHTML = '&#8987; Distanz wird berechnet ...';
      try {
        var resp = await fetch('/api/distance', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        var data = await resp.json();
        if (data.error) {
          box.innerHTML = '<span class="err">Fehler: ' + data.error + '</span>';
          return;
        }
        var units = document.getElementById('units').value;
        var dist = data.distance != null ? data.distance.toFixed(2) + ' ' + units : '?';
        var time = data.time_seconds != null ? fmtDuration(Math.round(data.time_seconds)) : '?';
        box.innerHTML = '<span class="ok">&#10003; Distanz ermittelt</span><br>' +
          'Distanz: <b>' + dist + '</b><br>Fahrzeit: <b>' + time + '</b>';
      } catch(err) {
        box.innerHTML = '<span class="err">Netzwerkfehler: ' + err + '</span>';
      }
    }

    async function geocode(which) {
      var addrInput = document.getElementById(which + 'Addr').value.trim();
      if (!addrInput) return;
      var provider = document.getElementById('geocoder-provider').value || 'photon_nominatim';
      var box = document.getElementById('result-box');
      box.innerHTML = '&#128269; Suche: ' + addrInput + ' ...';
      try {
        var resp = await fetch('/api/geocode?provider=' + encodeURIComponent(provider) + '&q=' + encodeURIComponent(addrInput));
        var data = await resp.json();
        if (data.error) { box.innerHTML = '<span class="err">Geocoding-Fehler: ' + data.error + '</span>'; return; }
        var results = data.results || [];
        if (results.length === 0) { box.innerHTML = '<span class="err">Keine Treffer fuer: ' + addrInput + '</span>'; return; }
        var r = results[0];
        setMarker(which, parseFloat(r.lat), parseFloat(r.lon));
        map.flyTo({center: [parseFloat(r.lon), parseFloat(r.lat)], zoom: 15});
        var providerLabel = provider === 'pelias' ? 'Pelias' : 'Photon+Nominatim';
        box.innerHTML = '<span class="ok">&#10003; ' + (which === 'start' ? 'Start' : 'Ziel') + ' gesetzt (' + providerLabel + ')</span><br>' + (r.display_name || '');
      } catch(err) {
        box.innerHTML = '<span class="err">Geocoding-Fehler: ' + err + '</span>';
      }
    }

    function updateGeocoderUi() {
      var provider = document.getElementById('geocoder-provider').value || 'photon_nominatim';
      var photonOnly = provider !== 'pelias';
      var peliasOnly = provider === 'pelias';
      document.querySelectorAll('.provider-photon-only').forEach(function(el) {
        el.classList.toggle('hidden', !photonOnly);
      });
      document.querySelectorAll('.provider-pelias-only').forEach(function(el) {
        el.classList.toggle('hidden', !peliasOnly);
      });
      if (!photonOnly) {
        closePhotonResults('start');
        closePhotonResults('end');
      }
      if (!peliasOnly) {
        closePeliasResults('start');
        closePeliasResults('end');
      }
    }

    // --- Photon full-text search-as-you-type ---------------------------------
    // Extra fields (startPhoton/endPhoton) query Photon (a full search engine
    // on top of the OSM data) starting at the 3rd typed character and show a
    // suggestion dropdown. Picking a suggestion resolves its OSM id/type via
    // Nominatim's /lookup so the normal address/lat/lon fields end up filled
    // exactly like a manual Nominatim search would ("Alternativ geocoding
    // direkt ueber Photon"): if the Nominatim lookup fails, Photon's own
    // coordinates/name are used directly as a fallback so the search still
    // succeeds.
    var photonState = {
      start: { timer: null, requestId: 0, items: [], active: -1 },
      end: { timer: null, requestId: 0, items: [], active: -1 }
    };

    function closePhotonResults(which) {
      var box = document.getElementById(which + 'PhotonResults');
      box.style.display = 'none';
      box.innerHTML = '';
      photonState[which].items = [];
      photonState[which].active = -1;
    }

    function onPhotonInput(which) {
      var state = photonState[which];
      var query = document.getElementById(which + 'Photon').value.trim();
      clearTimeout(state.timer);
      if (query.length < 3) {
        closePhotonResults(which);
        return;
      }
      // Small debounce so we do not fire a request on every single keystroke.
      state.timer = setTimeout(function() { runPhotonSearch(which, query); }, 250);
    }

    async function runPhotonSearch(which, query) {
      var state = photonState[which];
      var myRequestId = ++state.requestId;
      try {
        var resp = await fetch('/api/photon-search?q=' + encodeURIComponent(query) + '&limit=10');
        var data = await resp.json();
        // Ignore stale responses from a previous, slower request.
        if (myRequestId !== state.requestId) return;
        var features = (data.features || []);
        state.items = features;
        renderPhotonResults(which, features);
      } catch (e) {
        if (myRequestId !== state.requestId) return;
        closePhotonResults(which);
      }
    }

    function photonLabel(props) {
      props = props || {};
      var parts = [props.name, props.street, props.city, props.state, props.country].filter(function(p) { return !!p; });
      return parts.join(', ') || 'Unbenannt';
    }

    function renderPhotonResults(which, features) {
      var box = document.getElementById(which + 'PhotonResults');
      var state = photonState[which];
      state.active = -1;
      if (!features.length) {
        box.innerHTML = '<div>Keine Treffer</div>';
        box.style.display = 'block';
        return;
      }
      box.innerHTML = '';
      features.forEach(function(feature, idx) {
        var entry = document.createElement('div');
        entry.textContent = photonLabel(feature.properties);
        entry.dataset.index = idx;
        entry.onclick = function() { selectPhotonResult(which, idx); };
        box.appendChild(entry);
      });
      box.style.display = 'block';
    }

    function onPhotonKeydown(event, which) {
      var state = photonState[which];
      if (!state.items.length) return;
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        state.active = Math.min(state.active + 1, state.items.length - 1);
        highlightPhotonResult(which);
      } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        state.active = Math.max(state.active - 1, 0);
        highlightPhotonResult(which);
      } else if (event.key === 'Enter') {
        event.preventDefault();
        if (state.active >= 0) selectPhotonResult(which, state.active);
      } else if (event.key === 'Escape') {
        closePhotonResults(which);
      }
    }

    function highlightPhotonResult(which) {
      var box = document.getElementById(which + 'PhotonResults');
      var state = photonState[which];
      Array.prototype.forEach.call(box.children, function(child, idx) {
        child.classList.toggle('active', idx === state.active);
      });
    }

    // Selecting a suggestion takes over its OSM id/type and looks it up in
    // Nominatim to populate the normal address field the same way the
    // "Adresse suchen" button does. If that lookup does not succeed (e.g.
    // Nominatim does not carry the object for some reason), Photon's own
    // coordinates/name are used as a direct-geocoding fallback.
    async function selectPhotonResult(which, idx) {
      var state = photonState[which];
      var feature = state.items[idx];
      closePhotonResults(which);
      document.getElementById(which + 'Photon').value = photonLabel(feature.properties);
      var box = document.getElementById('result-box');
      var props = feature.properties || {};
      var coords = (feature.geometry && feature.geometry.coordinates) || null;
      box.innerHTML = '&#128269; Löse Photon-Treffer über Nominatim auf ...';
      try {
        if (!props.osm_type || !props.osm_id) throw new Error('kein osm_id/osm_type in Photon-Ergebnis');
        var resp = await fetch('/api/nominatim-lookup?osm_type=' + encodeURIComponent(props.osm_type) + '&osm_id=' + encodeURIComponent(props.osm_id));
        var data = await resp.json();
        if (data.error || !data.result) throw new Error(data.error || 'keine Nominatim-Entsprechung gefunden');
        var r = data.result;
        document.getElementById(which + 'Addr').value = r.display_name || photonLabel(props);
        setMarker(which, parseFloat(r.lat), parseFloat(r.lon));
        map.flyTo({center: [parseFloat(r.lon), parseFloat(r.lat)], zoom: 15});
        box.innerHTML = '<span class="ok">&#10003; ' + (which === 'start' ? 'Start' : 'Ziel') + ' via Photon+Nominatim gesetzt</span><br>' + (r.display_name || '');
      } catch (err) {
        // Alternative geocoding directly via Photon's own result/coordinates.
        if (coords && coords.length === 2) {
          document.getElementById(which + 'Addr').value = photonLabel(props);
          setMarker(which, coords[1], coords[0]);
          map.flyTo({center: [coords[0], coords[1]], zoom: 15});
          box.innerHTML = '<span class="ok">&#10003; ' + (which === 'start' ? 'Start' : 'Ziel') + ' direkt via Photon gesetzt</span><br>' + photonLabel(props) +
            '<div class="hint">Nominatim-Abgleich nicht möglich (' + esc(String(err)) + '), Photon-Koordinaten direkt übernommen.</div>';
        } else {
          box.innerHTML = '<span class="err">Photon-Auswahl konnte nicht übernommen werden: ' + esc(String(err)) + '</span>';
        }
      }
    }

    document.addEventListener('click', function(event) {
      ['start', 'end'].forEach(function(which) {
        var wrap = document.getElementById(which + 'Photon').closest('.photon-search');
        if (wrap && !wrap.contains(event.target)) closePhotonResults(which);
        var wrapP = document.getElementById(which + 'Pelias') && document.getElementById(which + 'Pelias').closest('.pelias-search');
        if (wrapP && !wrapP.contains(event.target)) closePeliasResults(which);
      });
    });
    // --- Pelias full-text search-as-you-type ---------------------------------
    var peliasState = {
      start: { timer: null, requestId: 0, items: [], active: -1 },
      end:   { timer: null, requestId: 0, items: [], active: -1 }
    };

    function closePeliasResults(which) {
      var box = document.getElementById(which + 'PeliasResults');
      if (!box) return;
      box.style.display = 'none';
      box.innerHTML = '';
      peliasState[which].items = [];
      peliasState[which].active = -1;
    }

    function onPeliasInput(which) {
      var state = peliasState[which];
      var query = document.getElementById(which + 'Pelias').value.trim();
      clearTimeout(state.timer);
      if (query.length < 3) {
        closePeliasResults(which);
        return;
      }
      state.timer = setTimeout(function() { runPeliasSearch(which, query); }, 250);
    }

    async function runPeliasSearch(which, query) {
      var state = peliasState[which];
      var myRequestId = ++state.requestId;
      try {
        var resp = await fetch('/api/pelias-search?q=' + encodeURIComponent(query) + '&limit=10');
        var data = await resp.json();
        if (myRequestId !== state.requestId) return;
        var items = (data.results || []);
        state.items = items;
        renderPeliasResults(which, items);
      } catch (e) {
        if (myRequestId !== state.requestId) return;
        closePeliasResults(which);
      }
    }

    function renderPeliasResults(which, items) {
      var box = document.getElementById(which + 'PeliasResults');
      var state = peliasState[which];
      state.active = -1;
      if (!items.length) {
        box.innerHTML = '<div>Keine Treffer</div>';
        box.style.display = 'block';
        return;
      }
      box.innerHTML = '';
      items.forEach(function(item, idx) {
        var entry = document.createElement('div');
        entry.textContent = item.display_name || 'Unbenannt';
        entry.dataset.index = idx;
        entry.onclick = function() { selectPeliasResult(which, idx); };
        box.appendChild(entry);
      });
      box.style.display = 'block';
    }

    function onPeliasKeydown(event, which) {
      var state = peliasState[which];
      if (!state.items.length) return;
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        state.active = Math.min(state.active + 1, state.items.length - 1);
        highlightPeliasResult(which);
      } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        state.active = Math.max(state.active - 1, 0);
        highlightPeliasResult(which);
      } else if (event.key === 'Enter') {
        event.preventDefault();
        if (state.active >= 0) selectPeliasResult(which, state.active);
      } else if (event.key === 'Escape') {
        closePeliasResults(which);
      }
    }

    function highlightPeliasResult(which) {
      var box = document.getElementById(which + 'PeliasResults');
      var state = peliasState[which];
      Array.prototype.forEach.call(box.children, function(child, idx) {
        child.classList.toggle('active', idx === state.active);
      });
    }

    function selectPeliasResult(which, idx) {
      var state = peliasState[which];
      var item = state.items[idx];
      closePeliasResults(which);
      document.getElementById(which + 'Pelias').value = item.display_name || '';
      document.getElementById(which + 'Addr').value = item.display_name || '';
      setMarker(which, parseFloat(item.lat), parseFloat(item.lon));
      map.flyTo({center: [parseFloat(item.lon), parseFloat(item.lat)], zoom: 15});
      var box = document.getElementById('result-box');
      box.innerHTML = '<span class="ok">&#10003; ' + (which === 'start' ? 'Start' : 'Ziel') + ' via Pelias gesetzt</span><br>' + esc(item.display_name || '');
    }

    function esc(value) {
      return String(value).replace(/[&<>"']/g, function(c) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }

    updateGeocoderUi();
    </script>
    </body>
    </html>
    """

    class Handler(BaseHTTPRequestHandler):
        def _send_json(self, payload, status=200):
            body = json.dumps(payload).encode("utf-8")
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.send_header("Access-Control-Allow-Origin", "*")
            self.end_headers()
            self.wfile.write(body)

        @staticmethod
        def _friendly_error(exc, service_name):
            msg = str(exc)
            if "111" in msg or "Connection refused" in msg or "ConnectionRefused" in msg:
                return (
                    f"{service_name} ist noch nicht erreichbar (startet noch oder importiert Daten). "
                    "Bitte warten und den Status im Dashboard prüfen."
                )
            if "timed out" in msg.lower() or "timeout" in msg.lower():
                return (
                    f"{service_name} antwortet nicht (Timeout). "
                    "Möglicherweise läuft noch ein Daten-Import."
                )
            return msg

        def do_GET(self):
            if self.path in {"/", "/index.html"}:
                html = INDEX_HTML
                if STATUS_URL:
                    html = html.replace("http://NODEIP:30083/", STATUS_URL.rstrip("/") + "/")
                body = html.encode("utf-8")
                self.send_response(200)
                self.send_header("Content-Type", "text/html; charset=utf-8")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
                return

            if self.path == "/favicon.ico":
                # Return a minimal favicon (or 404, browsers don't care much)
                self.send_response(404)
                self.end_headers()
                return

            if self.path == "/healthz":
                self._send_json({"status": "ok"})
                return

            if self.path.startswith("/fonts/"):
                # Proxy MapLibre GL glyph PBF requests to TileServer-GL.
                # TileServer-GL generates PBF files from TTF/OTF sources on demand.
                # This avoids cross-origin requests to TileServer-GL (port 30085).
                font_url = TILESERVER_URL + "/fonts" + self.path[len("/fonts"):]
                try:
                    req = urllib.request.Request(font_url, headers={
                        "User-Agent": "localosm-web/1.0",
                        "Accept-Encoding": "gzip"
                    })
                    with urllib.request.urlopen(req, timeout=10) as response:
                        http_status = response.status
                        body = response.read()
                        content_type = response.headers.get("Content-Type", "application/x-protobuf")
                        content_encoding = response.headers.get("Content-Encoding", "").lower()
                    
                    # Handle gzip decompression (same as tile proxy).
                    is_gzip_header = content_encoding == "gzip"
                    is_gzip_magic = len(body) >= 2 and body[0:2] == b'\x1f\x8b'
                    
                    if is_gzip_header or is_gzip_magic:
                        try:
                            body = gzip.decompress(body)
                        except Exception:
                            pass  # Not valid gzip; send as-is
                    
                    self.send_response(http_status)
                    self.send_header("Content-Type", content_type)
                    self.send_header("Content-Length", str(len(body)))
                    self.send_header("Access-Control-Allow-Origin", "*")
                    self.end_headers()
                    self.wfile.write(body)
                except urllib.error.HTTPError as e:
                    self.send_response(e.code)
                    self.end_headers()
                except Exception:
                    self.send_response(502)
                    self.end_headers()
                return

            if self.path == "/api/style":
                # Serve the style actually configured in TileServer-GL (e.g. via the
                # Maputnik style editor / status dashboard "/api/style"), so the
                # routing window's map matches what is configured there instead of
                # a hardcoded style baked into this page.
                try:
                    req = urllib.request.Request(
                        f"{TILESERVER_URL}/styles/osm/style.json",
                        headers={"User-Agent": "localosm-web/1.0"}
                    )
                    with urllib.request.urlopen(req, timeout=10) as response:
                        text = response.read().decode("utf-8")
                    # TileServer-GL rewrites relative source/glyphs/sprite URLs to
                    # absolute URLs based on the Host header of this request (i.e.
                    # its own internal cluster address). Strip those absolute
                    # prefixes so the browser fetches tiles/fonts/sprites from this
                    # same origin (via the existing /tiles, /fonts and /styles
                    # proxies below), avoiding CORS/network-policy issues.
                    text = re.sub(r'https?://[^"]*?/data/v3', '/tiles', text)
                    text = re.sub(r'https?://[^"]*?/fonts', '/fonts', text)
                    text = re.sub(r'https?://[^"]*?/styles', '/styles', text)
                    style = json.loads(text)
                    self._send_json(style)
                except Exception as exc:  # noqa: BLE001
                    self._send_json({"error": self._friendly_error(exc, "TileServer GL")}, 502)
                return

            if self.path.startswith("/styles/"):
                # Proxy style-relative assets (e.g. sprite.json/sprite.png) that a
                # configured style may reference, from the same origin as /api/style.
                asset_url = TILESERVER_URL + self.path
                try:
                    req = urllib.request.Request(asset_url, headers={
                        "User-Agent": "localosm-web/1.0",
                        "Accept-Encoding": "gzip"
                    })
                    with urllib.request.urlopen(req, timeout=10) as response:
                        http_status = response.status
                        body = response.read()
                        content_type = response.headers.get("Content-Type", "application/octet-stream")
                        content_encoding = response.headers.get("Content-Encoding", "").lower()

                    is_gzip_header = content_encoding == "gzip"
                    is_gzip_magic = len(body) >= 2 and body[0:2] == b'\x1f\x8b'
                    if is_gzip_header or is_gzip_magic:
                        try:
                            body = gzip.decompress(body)
                        except Exception:
                            pass

                    self.send_response(http_status)
                    self.send_header("Content-Type", content_type)
                    self.send_header("Content-Length", str(len(body)))
                    self.send_header("Access-Control-Allow-Origin", "*")
                    self.end_headers()
                    self.wfile.write(body)
                except urllib.error.HTTPError as e:
                    self.send_response(e.code)
                    self.end_headers()
                except Exception:
                    self.send_response(502)
                    self.end_headers()
                return

            if self.path == "/tiles.json":
                # TileServer-GL's style.json advertises its vector source via a
                # "url" field pointing at its own TileJSON endpoint (.../data/v3.json).
                # The /api/style rewriting above turns that absolute URL into
                # "/tiles.json" on this origin (mirroring the /tiles/{z}/{x}/{y}.pbf
                # rewrite used for inline "tiles" arrays), so MapLibre GL requests
                # it here. Proxy TileServer-GL's TileJSON and rewrite its "tiles"
                # array to point back at the /tiles/{z}/{x}/{y}.pbf proxy above,
                # instead of TileServer-GL's own (internal, CORS-blocked) URLs.
                try:
                    req = urllib.request.Request(
                        f"{TILESERVER_URL}/data/v3.json",
                        headers={"User-Agent": "localosm-web/1.0"}
                    )
                    with urllib.request.urlopen(req, timeout=10) as response:
                        tilejson = json.loads(response.read().decode("utf-8"))
                    # MapLibre GL fetches TileJSON "tiles" entries from a worker
                    # context that has no document/page base URL, so (unlike the
                    # "tiles"/"glyphs" fields embedded directly in a style.json,
                    # which MapLibre resolves against the page origin) a leading-
                    # slash relative URL here is rejected with "not a valid URL".
                    # Build an absolute URL instead, using this same request's own
                    # Host header (this deployment is plain HTTP only, no TLS
                    # termination anywhere in front of it, see k8s/web.yaml) so the
                    # tiles are always fetched from this same origin/proxy. Validate
                    # the header against a strict hostname[:port]/IPv4[:port]/
                    # [IPv6][:port] pattern first so a malformed/spoofed Host
                    # header can't inject an arbitrary scheme or extra URL parts
                    # into the response; fall back to the Server header default.
                    host = self.headers.get("Host", "")
                    # Validate as: "[" IPv6 "]" | hostname-label(.hostname-label)*
                    # each followed by an optional ":port". Labels can't start/end
                    # with "-" and consecutive/leading/trailing "." are rejected,
                    # matching standard hostname syntax rules. This deliberately
                    # doesn't fully validate IPv6 grouping/segment-count (accepting
                    # e.g. "[::::]") or reject the syntactically-valid-looking
                    # port "99999" via regex alone (checked numerically below
                    # instead) -- this value is only ever placed into a JSON
                    # string field for the browser's own same-origin tile fetch,
                    # never parsed/executed server-side, so a merely malformed
                    # (as opposed to injected) address/port cannot cause harm
                    # beyond that one client's own tile requests failing.
                    ipv6_part = r"\[[0-9A-Fa-f:]+\]"
                    label_part = r"[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?"
                    hostname_part = rf"{label_part}(\.{label_part})*"
                    port_part = r"(:(?P<port>\d{1,5}))?"
                    host_re = rf"({ipv6_part}|{hostname_part}){port_part}"
                    match = re.fullmatch(host_re, host)
                    port = match.group("port") if match else None
                    if not match or (port is not None and int(port) > 65535):
                        # Malformed/spoofed Host header: fall back to this
                        # HTTPServer's own bind address/port (set at startup,
                        # not client-controlled), so the URL still points back
                        # at this same origin/proxy.
                        host = f"{self.server.server_name}:{self.server.server_port}"
                    tilejson["tiles"] = [f"http://{host}/tiles/{{z}}/{{x}}/{{y}}.pbf"]
                    self._send_json(tilejson)
                except Exception as exc:  # noqa: BLE001
                    self._send_json({"error": self._friendly_error(exc, "TileServer GL")}, 502)
                return

            if self.path.startswith("/tiles/"):
                # Proxy vector tile requests to TileServer-GL via the internal K8s service.
                # This serves tiles from the same origin as the web page, avoiding CORS issues.
                z_x_y = self.path[len("/tiles"):]  # e.g. /14/8845/6436.pbf
                tile_url = TILESERVER_URL + "/data/v3" + z_x_y
                try:
                    # Request gzip encoding to reduce network transfer; will conditionally decompress here
                    # based on Content-Encoding header and gzip magic bytes detection.
                    req = urllib.request.Request(tile_url, headers={
                        "User-Agent": "localosm-web/1.0",
                        "Accept-Encoding": "gzip"
                    })
                    with urllib.request.urlopen(req, timeout=10) as response:
                        http_status = response.status
                        body = response.read()
                        content_type = response.headers.get("Content-Type", "application/x-protobuf")
                        content_encoding = response.headers.get("Content-Encoding", "").lower()
                    
                    # Handle gzip decompression. Check both Content-Encoding header and gzip magic bytes.
                    # TileServer-GL may omit the header but still send gzip data.
                    is_gzip_header = content_encoding == "gzip"
                    is_gzip_magic = len(body) >= 2 and body[0:2] == b'\x1f\x8b'
                    
                    if is_gzip_header or is_gzip_magic:
                        try:
                            body = gzip.decompress(body)
                            if is_gzip_magic and not is_gzip_header:
                                print(f"debug: Detected gzip by magic bytes (no Content-Encoding header) for {tile_url}", flush=True)
                        except (gzip.BadGzipFile, OSError) as e:
                            print(f"error: Gzip decompression failed (body size {len(body)}, header={is_gzip_header}, magic={is_gzip_magic}): {e}", flush=True)
                            # Log additional context when header indicated gzip but decompression failed
                            if is_gzip_header:
                                print(f"error: Content-Encoding header claimed gzip but decompression failed for {tile_url}", flush=True)
                            else:
                                print(f"warning: Malformed gzip data detected for {tile_url}, forwarding as-is", flush=True)
                    
                    if len(body) == 0:
                        print(f"debug: Empty tile response (status={http_status}) from {tile_url}", flush=True)
                    
                    # Forward the upstream HTTP status code (e.g., 204 No Content) instead of always 200.
                    # This allows clients to handle empty/non-existent tiles correctly.
                    try:
                        self.send_response(http_status)
                        self.send_header("Content-Type", content_type)
                        self.send_header("Content-Length", str(len(body)))
                        self.send_header("Cache-Control", "max-age=86400")
                        self.end_headers()
                        if len(body) > 0:
                            self.wfile.write(body)
                    except BrokenPipeError:
                        print(f"debug: Client disconnected while sending tile {z_x_y}", flush=True)
                except urllib.error.HTTPError as e:
                    try:
                        self.send_response(e.code)
                        self.send_header("Content-Length", "0")
                        self.end_headers()
                    except BrokenPipeError:
                        print(f"debug: Client disconnected during error response for {tile_url}", flush=True)
                except Exception as exc:
                    error_msg = f"Tile proxy error: {type(exc).__name__}: {str(exc)}"
                    print(error_msg, flush=True)
                    try:
                        self.send_response(502)
                        self.send_header("Content-Length", "0")
                        self.end_headers()
                    except BrokenPipeError:
                        print(f"debug: Client disconnected during error response for {tile_url}", flush=True)
                return

            if self.path.startswith("/static/"):
                filename = self.path[len("/static/"):]
                allowed = {"maplibre-gl.js": "application/javascript", "maplibre-gl.css": "text/css"}
                if filename not in allowed:
                    self.send_response(404)
                    self.end_headers()
                    return
                filepath = os.path.join("/data/static", filename)
                try:
                    with open(filepath, "rb") as f:
                        body = f.read()
                    self.send_response(200)
                    self.send_header("Content-Type", allowed[filename])
                    self.send_header("Content-Length", str(len(body)))
                    self.end_headers()
                    self.wfile.write(body)
                except FileNotFoundError:
                    self.send_response(503)
                    self.end_headers()
                return

            if self.path == "/api/status":
                self._send_json({"status": "ok", "valhalla": VALHALLA_URL, "nominatim": NOMINATIM_URL, "photon": PHOTON_URL, "pelias": PELIAS_URL})
                return

            if self.path == "/api/bounds":
                # Report the actual extent of the imported map data (from TileServer-GL's
                # TileJSON) so the client can zoom/center on the real data instead of a
                # hardcoded location that may not match what was imported (e.g. Luxembourg).
                try:
                    req = urllib.request.Request(
                        f"{TILESERVER_URL}/data/v3.json",
                        headers={"User-Agent": "localosm-web/1.0"}
                    )
                    with urllib.request.urlopen(req, timeout=5) as response:
                        data = json.loads(response.read().decode("utf-8"))
                    bounds = data.get("bounds")
                    if not (isinstance(bounds, list) and len(bounds) == 4):
                        self._send_json({"bounds": None})
                        return
                    self._send_json({"bounds": bounds})
                except Exception as exc:  # noqa: BLE001
                    self._send_json({"bounds": None, "error": self._friendly_error(exc, "TileServer GL")})
                return

            if self.path.startswith("/api/geocode"):
                query = self.path.split("?", 1)[1] if "?" in self.path else ""
                params = urllib.parse.parse_qs(query)
                provider = params.get("provider", ["photon_nominatim"])[0].strip().lower()
                if provider not in {"pelias", "photon_nominatim"}:
                    self._send_json({"error": "invalid provider (allowed: pelias, photon_nominatim)"}, 400)
                    return
                q = params.get("q", [""])[0]
                if not q:
                    self._send_json({"error": "missing query parameter q"}, 400)
                    return
                try:
                    if provider == "pelias":
                        req = urllib.request.Request(
                            f"{PELIAS_URL}/v1/search?text={urllib.parse.quote(q)}&size=10",
                            headers={"User-Agent": "localosm-web/1.0"}
                        )
                        with urllib.request.urlopen(req, timeout=5) as response:
                            data = json.loads(response.read().decode("utf-8"))
                        features = data.get("features", []) if isinstance(data, dict) else []
                        mapped = []
                        for feature in features:
                            coords = ((feature or {}).get("geometry") or {}).get("coordinates") or []
                            props = (feature or {}).get("properties") or {}
                            if not isinstance(coords, list) or len(coords) != 2:
                                continue
                            mapped.append({
                                "lat": coords[1],
                                "lon": coords[0],
                                "display_name": props.get("label") or props.get("name") or q,
                            })
                        self._send_json({"results": mapped})
                    else:
                        req = urllib.request.Request(
                            f"{NOMINATIM_URL}/search?q={urllib.parse.quote(q)}&format=jsonv2&limit=1",
                            headers={"User-Agent": "localosm-web/1.0"}
                        )
                        with urllib.request.urlopen(req, timeout=5) as response:
                            data = json.loads(response.read().decode("utf-8"))
                        self._send_json({"results": data})
                except Exception as exc:  # noqa: BLE001
                    self._send_json({"error": self._friendly_error(exc, "Pelias" if provider == "pelias" else "Nominatim (Geocoding)")}, 502)
                return

            if self.path.startswith("/api/reverse"):
                query = self.path.split("?", 1)[1] if "?" in self.path else ""
                params = urllib.parse.parse_qs(query)
                provider = params.get("provider", ["photon_nominatim"])[0].strip().lower()
                if provider not in {"pelias", "photon_nominatim"}:
                    self._send_json({"error": "invalid provider (allowed: pelias, photon_nominatim)"}, 400)
                    return
                lat = params.get("lat", [""])[0]
                lon = params.get("lon", [""])[0]
                if not lat or not lon:
                    self._send_json({"error": "missing lat/lon parameters"}, 400)
                    return
                try:
                    if provider == "pelias":
                        req = urllib.request.Request(
                            f"{PELIAS_URL}/v1/reverse?point.lat={urllib.parse.quote(lat)}&point.lon={urllib.parse.quote(lon)}&size=1",
                            headers={"User-Agent": "localosm-web/1.0"}
                        )
                        with urllib.request.urlopen(req, timeout=5) as response:
                            data = json.loads(response.read().decode("utf-8"))
                        features = data.get("features", []) if isinstance(data, dict) else []
                        first = features[0] if features else {}
                        props = (first or {}).get("properties") or {}
                        self._send_json({"display_name": props.get("label") or props.get("name") or ""})
                    else:
                        req = urllib.request.Request(
                            f"{NOMINATIM_URL}/reverse?lat={urllib.parse.quote(lat)}&lon={urllib.parse.quote(lon)}&format=jsonv2",
                            headers={"User-Agent": "localosm-web/1.0"}
                        )
                        with urllib.request.urlopen(req, timeout=5) as response:
                            data = json.loads(response.read().decode("utf-8"))
                        self._send_json({"display_name": data.get("display_name", "")})
                except Exception as exc:  # noqa: BLE001
                    self._send_json({"error": self._friendly_error(exc, "Pelias" if provider == "pelias" else "Nominatim (Reverse Geocoding)")}, 502)
                return

            if self.path.startswith("/api/photon-search"):
                # Search-as-you-type suggestions for the extra Photon fields;
                # Photon is a dedicated full-text search engine on top of the
                # imported OSM data (separate from Nominatim's own geocoder).
                query = self.path.split("?", 1)[1] if "?" in self.path else ""
                params = urllib.parse.parse_qs(query)
                q = params.get("q", [""])[0]
                if not q or len(q) < 3:
                    self._send_json({"error": "query parameter q must be at least 3 characters"}, 400)
                    return
                limit = params.get("limit", ["10"])[0]
                try:
                    req = urllib.request.Request(
                        f"{PHOTON_URL}/api?q={urllib.parse.quote(q)}&limit={urllib.parse.quote(limit)}&lang=de",
                        headers={"User-Agent": "localosm-web/1.0"}
                    )
                    with urllib.request.urlopen(req, timeout=5) as response:
                        data = json.loads(response.read().decode("utf-8"))
                    self._send_json({"features": data.get("features", [])})
                except Exception as exc:  # noqa: BLE001
                    self._send_json({"error": self._friendly_error(exc, "Photon (Volltextsuche)")}, 502)
                return

            if self.path.startswith("/api/pelias-search"):
                # Search-as-you-type suggestions for the Pelias full-text search
                # fields; queries Pelias directly and returns up to 10 results.
                query = self.path.split("?", 1)[1] if "?" in self.path else ""
                params = urllib.parse.parse_qs(query)
                q = params.get("q", [""])[0]
                if not q or len(q) < 3:
                    self._send_json({"error": "query parameter q must be at least 3 characters"}, 400)
                    return
                limit = params.get("limit", ["10"])[0]
                try:
                    req = urllib.request.Request(
                        f"{PELIAS_URL}/v1/search?text={urllib.parse.quote(q)}&size={urllib.parse.quote(limit)}",
                        headers={"User-Agent": "localosm-web/1.0"}
                    )
                    with urllib.request.urlopen(req, timeout=5) as response:
                        data = json.loads(response.read().decode("utf-8"))
                    features = data.get("features", []) if isinstance(data, dict) else []
                    mapped = []
                    for feature in features:
                        coords = ((feature or {}).get("geometry") or {}).get("coordinates") or []
                        props = (feature or {}).get("properties") or {}
                        if not isinstance(coords, list) or len(coords) != 2:
                            continue
                        mapped.append({
                            "lat": coords[1],
                            "lon": coords[0],
                            "display_name": props.get("label") or props.get("name") or q,
                        })
                    self._send_json({"results": mapped})
                except Exception as exc:  # noqa: BLE001
                    self._send_json({"error": self._friendly_error(exc, "Pelias (Volltextsuche)")}, 502)
                return


            if self.path.startswith("/api/nominatim-lookup"):
                # Resolves a Photon result's OSM id/type via Nominatim's
                # /lookup so the normal address/lat/lon fields end up with the
                # same data a manual Nominatim search would have produced.
                query = self.path.split("?", 1)[1] if "?" in self.path else ""
                params = urllib.parse.parse_qs(query)
                osm_type = params.get("osm_type", [""])[0].strip().upper()
                osm_id = params.get("osm_id", [""])[0].strip()
                if osm_type not in {"N", "W", "R"} or not osm_id:
                    self._send_json({"error": "osm_type (N/W/R) and osm_id are required"}, 400)
                    return
                try:
                    req = urllib.request.Request(
                        f"{NOMINATIM_URL}/lookup?osm_ids={osm_type}{urllib.parse.quote(osm_id)}&format=jsonv2",
                        headers={"User-Agent": "localosm-web/1.0"}
                    )
                    with urllib.request.urlopen(req, timeout=5) as response:
                        data = json.loads(response.read().decode("utf-8"))
                    if not data:
                        self._send_json({"error": "no matching Nominatim object found", "result": None})
                        return
                    self._send_json({"result": data[0]})
                except Exception as exc:  # noqa: BLE001
                    self._send_json({"error": self._friendly_error(exc, "Nominatim (Lookup)")}, 502)
                return

            if self.path == "/api/planet-update/status":
                try:
                    with open(PLANET_UPDATE_STATUS_FILE, "r", encoding="utf-8") as fh:
                        data = json.load(fh)
                    self._send_json(data)
                except FileNotFoundError:
                    self._send_json({"running": False, "last_success_at": "", "last_error": "", "output_file_mtime": ""})
                except Exception as exc:
                    self._send_json({"error": str(exc)}, 500)
                return

            self._send_json({"error": "not found"}, 404)

        def do_POST(self):
            content_length = int(self.headers.get("Content-Length", "0"))
            body = self.rfile.read(content_length) if content_length else b"{}"
            try:
                payload = json.loads(body.decode("utf-8"))
            except Exception:
                self._send_json({"error": "invalid json"}, 400)
                return

            if self.path == "/api/route":
                self._forward_route(payload)
                return

            if self.path == "/api/distance":
                self._forward_distance(payload)
                return

            if self.path == "/api/planet-update/trigger":
                try:
                    # Check if a job is already running
                    try:
                        with open(PLANET_UPDATE_STATUS_FILE, "r", encoding="utf-8") as fh:
                            status_data = json.load(fh)
                        if status_data.get("running"):
                            self._send_json({"error": "Planet-Update läuft bereits. Bitte warten.", "running": True}, 409)
                            return
                    except FileNotFoundError:
                        pass
                    # Write the trigger flag file
                    import os as _os
                    _os.makedirs(_os.path.dirname(PLANET_UPDATE_REQUEST_FILE), exist_ok=True)
                    with open(PLANET_UPDATE_REQUEST_FILE, "w", encoding="utf-8") as fh:
                        import datetime as _dt
                        fh.write(_dt.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"))
                    self._send_json({"message": "Planet-Update angefordert. Der Job wird in Kürze gestartet."})
                except Exception as exc:
                    self._send_json({"error": str(exc)}, 500)
                return

            self._send_json({"error": "not found"}, 404)

        def _build_valhalla_request(self, payload):
            start = payload.get("start", {})
            end = payload.get("end", {})
            costing = payload.get("costing", "auto")

            request = {
                "locations": [
                    {"lat": start.get("lat"), "lon": start.get("lon")},
                    {"lat": end.get("lat"), "lon": end.get("lon")},
                ],
                "costing": costing,
                "units": payload.get("units", "km"),
                "language": payload.get("instruction_language", "de"),
            }

            request["costing_options"] = {}
            request["costing_options"][costing] = {}
            options = request["costing_options"][costing]

            advanced_enabled = payload.get("advanced_options_enabled", True)
            if advanced_enabled:
                for payload_key, option_key in [
                    ("use_tolls", "use_tolls"),
                    ("toll_penalty", "use_tolls"),
                    ("use_ferry", "use_ferry"),
                    ("ferry_penalty", "use_ferry"),
                    ("use_highways", "use_highways"),
                    ("highway_penalty", "use_highways"),
                    ("use_living_streets", "use_living_streets"),
                    ("living_street_penalty", "use_living_streets"),
                    ("use_primary", "use_primary"),
                    ("primary_penalty", "use_primary"),
                ]:
                    if payload_key not in payload:
                        continue
                    value = payload.get(payload_key)
                    if isinstance(value, (int, float)) and not isinstance(value, bool) and math.isfinite(float(value)):
                        numeric_value = float(value)
                        if 0.0 <= numeric_value <= 1.0:
                            options[option_key] = numeric_value

                for key in ["use_service", "use_trails", "use_tracks", "use_residential"]:
                    if key in payload:
                        options[key] = bool(payload.get(key, False))
                if payload.get("hazmat") is not None:
                    options["hazmat"] = bool(payload.get("hazmat", False))

                for key in ["top_speed", "width", "height", "length", "weight", "axle_load", "tunnel_penalty", "unpaved_penalty"]:
                    value = payload.get(key)
                    if isinstance(value, (int, float)) and not isinstance(value, bool) and math.isfinite(float(value)):
                        options[key] = value

            if "shortest" in payload:
                shortest_value = payload.get("shortest")
                if isinstance(shortest_value, (int, float)) and not isinstance(shortest_value, bool) and math.isfinite(float(shortest_value)):
                    options["shortest"] = float(shortest_value) >= 0.5
                else:
                    options["shortest"] = bool(shortest_value)

            return request

        def _call_valhalla(self, endpoint, valhalla_payload):
            req = urllib.request.Request(
                f"{VALHALLA_URL}/{endpoint}",
                data=json.dumps(valhalla_payload).encode("utf-8"),
                headers={"Content-Type": "application/json", "User-Agent": "localosm-web/1.0"},
                method="POST",
            )
            with urllib.request.urlopen(req, timeout=15) as response:
                return json.loads(response.read().decode("utf-8"))

        def _forward_route(self, payload):
            try:
                data = self._call_valhalla("route", self._build_valhalla_request(payload))
                summary = data.get("trip", {}).get("summary", {})
                self._send_json({
                    "status": "ok",
                    "costing": payload.get("costing", "auto"),
                    "units": payload.get("units", "km"),
                    "distance": summary.get("length"),
                    "time_seconds": summary.get("time"),
                    "trip": data.get("trip"),
                })
            except Exception as exc:  # noqa: BLE001
                self._send_json({"error": self._friendly_error(exc, "Valhalla (Routing)")}, 502)

        def _forward_distance(self, payload):
            try:
                data = self._call_valhalla("route", self._build_valhalla_request(payload))
                summary = data.get("trip", {}).get("summary", {})
                self._send_json({
                    "status": "ok",
                    "distance": summary.get("length"),
                    "time_seconds": summary.get("time"),
                    "units": payload.get("units", "km"),
                })
            except Exception as exc:  # noqa: BLE001
                self._send_json({"error": self._friendly_error(exc, "Valhalla (Routing)")}, 502)

        def log_message(self, format, *args):
            return

    if __name__ == "__main__":
        server = ThreadingHTTPServer((HOST, PORT), Handler)
        print(f"OSM web server listening on {HOST}:{PORT}")
        try:
            server.serve_forever()
        except KeyboardInterrupt:
            pass
        finally:
            server.server_close()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: osm
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      nodeSelector:
        osm: "true"
      initContainers:
      - name: ca-injector
        image: alpine:3.20
        imagePullPolicy: IfNotPresent
        env:
        - name: CA_ENABLED
          valueFrom:
            configMapKeyRef:
              name: osm-ca-bundle
              key: ca-enabled
        - name: CA_CRT
          valueFrom:
            configMapKeyRef:
              name: osm-ca-bundle
              key: ca.crt
        command:
        - /bin/sh
        - -c
        args:
        - |
          set -eu
          # Install system CA bundle (may be a no-op if already present).
          apk add --no-cache ca-certificates >/dev/null 2>&1 || true
          # Seed /ca-certs/ca.crt with the system bundle so env vars always point
          # to a valid file, even when the custom CA is disabled.
          if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
            cp /etc/ssl/certs/ca-certificates.crt /ca-certs/ca.crt
          else
            touch /ca-certs/ca.crt
          fi
          if [ "${CA_ENABLED}" = "true" ] && [ -n "${CA_CRT}" ]; then
            # Append the custom Root CA to the bundle so public CAs stay trusted too.
            printf '\n%s\n' "${CA_CRT}" >> /ca-certs/ca.crt
            touch /ca-certs/ca-enabled
            echo "[ca-injector] Custom CA appended to bundle at /ca-certs/ca.crt"
          else
            echo "[ca-injector] CA injection disabled; system bundle at /ca-certs/ca.crt"
          fi
        resources:
          requests:
            memory: 16Mi
            cpu: 10m
          limits:
            memory: 64Mi
            cpu: 50m
        volumeMounts:
        - name: ca-certs
          mountPath: /ca-certs
      - name: fetch-static
        image: alpine:3.20
        command: ["/bin/sh", "-c"]
        args:
        - |
          MLGL_VERSION="4.7.1"
          mkdir -p /data/static
          if [ ! -f /data/static/maplibre-gl.js ]; then
            echo "Downloading maplibre-gl.js v${MLGL_VERSION} (one-time setup)..."
            wget -q -O /data/static/maplibre-gl.js \
              "https://unpkg.com/maplibre-gl@${MLGL_VERSION}/dist/maplibre-gl.js" \
              || { rm -f /data/static/maplibre-gl.js; echo "ERROR: maplibre-gl.js download failed"; exit 1; }
          fi
          if [ ! -f /data/static/maplibre-gl.css ]; then
            echo "Downloading maplibre-gl.css v${MLGL_VERSION} (one-time setup)..."
            wget -q -O /data/static/maplibre-gl.css \
              "https://unpkg.com/maplibre-gl@${MLGL_VERSION}/dist/maplibre-gl.css" \
              || { rm -f /data/static/maplibre-gl.css; echo "ERROR: maplibre-gl.css download failed"; exit 1; }
          fi
          echo "Static assets ready."
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        volumeMounts:
        - name: web-static
          mountPath: /data/static
        - &id005
          name: ca-certs
          mountPath: /ca-certs
          readOnly: true
        env:
        - &id001
          name: SSL_CERT_FILE
          value: /ca-certs/ca.crt
        - &id002
          name: CURL_CA_BUNDLE
          value: /ca-certs/ca.crt
        - &id003
          name: REQUESTS_CA_BUNDLE
          value: /ca-certs/ca.crt
        - &id004
          name: NODE_EXTRA_CA_CERTS
          value: /ca-certs/ca.crt
      containers:
      - name: web
        image: python:3.12-alpine
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
        - |
          cp /config/app.py /tmp/app.py
          python /tmp/app.py
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        env:
        - name: WEB_HOST
          value: "0.0.0.0"
        - name: WEB_PORT
          value: "8080"
        - name: VALHALLA_URL
          value: "http://valhalla.osm.svc.cluster.local:8002"
        - name: NOMINATIM_URL
          value: "http://nominatim.osm.svc.cluster.local:8080"
        - name: PHOTON_URL
          value: "http://photon.osm.svc.cluster.local:2322"
        - name: PELIAS_URL
          value: "http://pelias.osm.svc.cluster.local:4000"
        - name: TILESERVER_URL
          value: "http://tileserver-gl.osm.svc.cluster.local"
        - name: STATUS_URL
          value: ""
        - name: SERVICE_TARGETS_JSON
          valueFrom:
            configMapKeyRef:
              name: osm-service-targets
              key: service-targets.json
        - name: PLANET_UPDATE_REQUEST_FILE
          value: "/state/planet-update-request.flag"
        - name: PLANET_UPDATE_STATUS_FILE
          value: "/status/planet-update.json"
        - *id001
        - *id002
        - *id003
        - *id004
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: app-code
          mountPath: /config
        - name: web-static
          mountPath: /data/static
        - name: state
          mountPath: /state
        - name: planet-status
          mountPath: /status
        - *id005
      volumes:
      - name: app-code
        configMap:
          name: osm-web-app
      - name: web-static
        hostPath:
          path: /mnt/OSM/web-static
          type: DirectoryOrCreate
      - name: state
        hostPath:
          path: /mnt/OSM/status
          type: DirectoryOrCreate
      - name: planet-status
        hostPath:
          path: /mnt/OSM/status
          type: DirectoryOrCreate
      - name: ca-certs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: osm
spec:
  type: NodePort
  selector:
    app: web
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30084
