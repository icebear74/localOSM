apiVersion: batch/v1
kind: Job
metadata:
  name: pelias-import
  namespace: osm
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 172800
  template:
    spec:
      serviceAccountName: planetiler-import
      nodeSelector:
        osm: "true"
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: ca-injector
        image: alpine:3.20
        imagePullPolicy: IfNotPresent
        env:
        - name: CA_ENABLED
          valueFrom:
            configMapKeyRef:
              name: osm-ca-bundle
              key: ca-enabled
        - name: CA_CRT
          valueFrom:
            configMapKeyRef:
              name: osm-ca-bundle
              key: ca.crt
        command:
        - /bin/sh
        - -c
        args:
        - |
          set -eu
          # Install system CA bundle (may be a no-op if already present).
          apk add --no-cache ca-certificates >/dev/null 2>&1 || true
          # Seed /ca-certs/ca.crt with the system bundle so env vars always point
          # to a valid file, even when the custom CA is disabled.
          if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
            cp /etc/ssl/certs/ca-certificates.crt /ca-certs/ca.crt
          else
            touch /ca-certs/ca.crt
          fi
          if [ "${CA_ENABLED}" = "true" ] && [ -n "${CA_CRT}" ]; then
            # Append the custom Root CA to the bundle so public CAs stay trusted too.
            printf '\n%s\n' "${CA_CRT}" >> /ca-certs/ca.crt
            touch /ca-certs/ca-enabled
            echo "[ca-injector] Custom CA appended to bundle at /ca-certs/ca.crt"
          else
            echo "[ca-injector] CA injection disabled; system bundle at /ca-certs/ca.crt"
          fi
        resources:
          requests:
            memory: 16Mi
            cpu: 10m
          limits:
            memory: 64Mi
            cpu: 50m
        volumeMounts:
        - name: ca-certs
          mountPath: /ca-certs
      - name: pelias-schema
        image: pelias/schema:master-2026-08-04-d27db460d88284eabe40adfaf50a2ffac2365ddc
        imagePullPolicy: IfNotPresent
        env:
        - name: PELIAS_PBF_ROOT
          valueFrom:
            configMapKeyRef:
              name: osm-pelias-config
              key: pbf-root
        - name: PELIAS_PBF_FILE
          valueFrom:
            configMapKeyRef:
              name: osm-pelias-config
              key: pbf-file
        - name: PELIAS_TEMP_ROOT
          valueFrom:
            configMapKeyRef:
              name: osm-pelias-config
              key: temp-root
        - name: PELIAS_ELASTICSEARCH_HOST
          valueFrom:
            configMapKeyRef:
              name: osm-pelias-config
              key: elasticsearch-host
        - name: PELIAS_ADMIN_LOOKUP
          valueFrom:
            configMapKeyRef:
              name: osm-pelias-config
              key: pelias_admin_lookup
        - name: PELIAS_WOF_ENABLED
          valueFrom:
            configMapKeyRef:
              name: osm-pelias-config
              key: pelias_wof_enabled
        - name: PELIAS_WOF_ROOT
          valueFrom:
            configMapKeyRef:
              name: osm-pelias-config
              key: pelias_wof_root
        - &id001
          name: SSL_CERT_FILE
          value: /ca-certs/ca.crt
        - &id002
          name: CURL_CA_BUNDLE
          value: /ca-certs/ca.crt
        - &id003
          name: REQUESTS_CA_BUNDLE
          value: /ca-certs/ca.crt
        - &id004
          name: NODE_EXTRA_CA_CERTS
          value: /ca-certs/ca.crt
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          node <<'NODE'
          const http = require('http');
          const ES_HOST = process.env.PELIAS_ELASTICSEARCH_HOST || 'pelias-elasticsearch.osm.svc.cluster.local';
          let tries = 0;
          const maxTries = 120;
          function check() {
            tries += 1;
            const req = http.get(`http://${ES_HOST}:9200/_cluster/health?wait_for_status=yellow&timeout=1s`, (res) => {
              if (res.statusCode >= 200 && res.statusCode < 300) {
                process.exit(0);
              }
              if (tries >= maxTries) {
                console.error(`Elasticsearch not ready (status ${res.statusCode})`);
                process.exit(1);
              }
              setTimeout(check, 5000);
            });
            req.on('error', () => {
              if (tries >= maxTries) {
                console.error('Elasticsearch not reachable');
                process.exit(1);
              }
              setTimeout(check, 5000);
            });
          }
          check();
          NODE
          INDEX_NAME="pelias-$(date +%Y%m%d%H%M%S)"
          PBF_ROOT="${PELIAS_PBF_ROOT:-/planet}"
          PBF_FILE="${PELIAS_PBF_FILE:-europa.osm.pbf}"
          PBF_PATH="${PBF_ROOT}/${PBF_FILE}"
          TEMP_ROOT="${PELIAS_TEMP_ROOT:-/osm-temp/pelias}"
          ES_HOST="${PELIAS_ELASTICSEARCH_HOST:-pelias-elasticsearch.osm.svc.cluster.local}"
          case "${TEMP_ROOT}" in
            /osm-temp|/osm-temp/*) ;;
            *)
              echo "ERROR: TEMP_ROOT must be inside /osm-temp (got ${TEMP_ROOT})" >&2
              exit 1
              ;;
          esac
          if [ ! -f "${PBF_PATH}" ]; then
            echo "ERROR: PBF file not found at ${PBF_PATH}" >&2
            exit 1
          fi
          export PELIAS_ELASTICSEARCH_HOST="${ES_HOST}"
          cp /config/import-pelias-template.json /work/pelias.json
          sed -i "s|__PELIAS_INDEX__|${INDEX_NAME}|g" /work/pelias.json
          sed -i "s|__PELIAS_PBF_FILE__|${PBF_FILE}|g" /work/pelias.json
          sed -i "s|__PELIAS_TEMP_ROOT__|${TEMP_ROOT}|g" /work/pelias.json
          sed -i "s|__PELIAS_ELASTICSEARCH_HOST__|${ES_HOST}|g" /work/pelias.json
          sed -i "s|__PELIAS_ADMIN_LOOKUP__|${PELIAS_ADMIN_LOOKUP:-true}|g" /work/pelias.json
          sed -i "s|__PELIAS_WOF_ROOT__|${PELIAS_WOF_ROOT:-/osm-temp/pelias/wof}|g" /work/pelias.json
          echo "${INDEX_NAME}" > /work/index-name
          echo "${PBF_FILE}" > /work/pbf-file
          echo "${PBF_ROOT}" > /work/pbf-root
          echo "${TEMP_ROOT}" > /work/temp-root
          export PELIAS_CONFIG=/work/pelias.json
          ./bin/create_index
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1"
        volumeMounts:
        - name: planet
          mountPath: /planet
          readOnly: true
        - name: pelias-config
          mountPath: /config
        - name: work
          mountPath: /work
        - &id005
          name: ca-certs
          mountPath: /ca-certs
          readOnly: true
      - name: pelias-wof-download
        image: pelias/whosonfirst:v8.5.0
        imagePullPolicy: IfNotPresent
        env:
        - name: PELIAS_WOF_ENABLED
          valueFrom:
            configMapKeyRef:
              name: osm-pelias-config
              key: pelias_wof_enabled
        - name: PELIAS_CONFIG
          value: /work/pelias.json
        - *id001
        - *id002
        - *id003
        - *id004
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          if [ "${PELIAS_WOF_ENABLED:-true}" != "true" ]; then
            echo "WOF import disabled; skipping download."
            exit 0
          fi
          echo "Downloading Who's On First SQLite database..."
          node bin/download
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "2"
        volumeMounts:
        - name: osm-temp
          mountPath: /osm-temp
        - name: work
          mountPath: /work
        - *id005
      - name: pelias-wof-import
        image: pelias/whosonfirst:v8.5.0
        imagePullPolicy: IfNotPresent
        env:
        - name: PELIAS_WOF_ENABLED
          valueFrom:
            configMapKeyRef:
              name: osm-pelias-config
              key: pelias_wof_enabled
        - name: PELIAS_CONFIG
          value: /work/pelias.json
        - *id001
        - *id002
        - *id003
        - *id004
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          if [ "${PELIAS_WOF_ENABLED:-true}" != "true" ]; then
            echo "WOF import disabled; skipping import."
            exit 0
          fi
          echo "Importing Who's On First data into Elasticsearch..."
          npm start
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "4"
        volumeMounts:
        - name: osm-temp
          mountPath: /osm-temp
        - name: work
          mountPath: /work
        - *id005
      containers:
      - name: pelias-import
        image: pelias/openstreetmap:v8.5.2
        imagePullPolicy: IfNotPresent
        env:
        - name: PELIAS_PBF_ROOT
          valueFrom:
            configMapKeyRef:
              name: osm-pelias-config
              key: pbf-root
        - name: PELIAS_PBF_FILE
          valueFrom:
            configMapKeyRef:
              name: osm-pelias-config
              key: pbf-file
        - name: PELIAS_TEMP_ROOT
          valueFrom:
            configMapKeyRef:
              name: osm-pelias-config
              key: temp-root
        - name: PELIAS_ELASTICSEARCH_HOST
          valueFrom:
            configMapKeyRef:
              name: osm-pelias-config
              key: elasticsearch-host
        - name: PELIAS_EXTRA_TAGS
          valueFrom:
            configMapKeyRef:
              name: osm-pelias-config
              key: pelias_extra_tags
        - name: PELIAS_ADMIN_LOOKUP
          valueFrom:
            configMapKeyRef:
              name: osm-pelias-config
              key: pelias_admin_lookup
        - name: PELIAS_WOF_ENABLED
          valueFrom:
            configMapKeyRef:
              name: osm-pelias-config
              key: pelias_wof_enabled
        - name: PELIAS_WOF_ROOT
          valueFrom:
            configMapKeyRef:
              name: osm-pelias-config
              key: pelias_wof_root
        - *id001
        - *id002
        - *id003
        - *id004
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          TEMP_ROOT="${PELIAS_TEMP_ROOT:-/osm-temp/pelias}"
          WOF_ROOT="${PELIAS_WOF_ROOT:-/osm-temp/pelias/wof}"
          mkdir -p "${TEMP_ROOT}" "${TEMP_ROOT}/work/openstreetmap" "${TEMP_ROOT}/work/leveldb" "${WOF_ROOT}"
          chown -R 1000:1000 "${TEMP_ROOT}" "${WOF_ROOT}" 2>/dev/null || true
          INDEX_NAME="$(cat /work/index-name)"
          PBF_FILE="$(cat /work/pbf-file)"
          PBF_ROOT="${PELIAS_PBF_ROOT:-/planet}"
          TEMP_ROOT="${PELIAS_TEMP_ROOT:-/osm-temp/pelias}"
          case "${TEMP_ROOT}" in
            /osm-temp|/osm-temp/*) ;;
            *)
              echo "ERROR: TEMP_ROOT must be inside /osm-temp (got ${TEMP_ROOT})" >&2
              exit 1
              ;;
          esac
          FAILED=1
          cleanup_failed_import() {
            if [ "${FAILED}" != "1" ]; then
              return
            fi
            node <<'NODE'
            const fs = require('fs');
            const http = require('http');
            const ES_HOST = process.env.PELIAS_ELASTICSEARCH_HOST || 'pelias-elasticsearch.osm.svc.cluster.local';
            const indexName = fs.readFileSync('/work/index-name', 'utf8').trim();
            const req = http.request({
              hostname: ES_HOST,
              port: 9200,
              path: `/${indexName}`,
              method: 'DELETE',
            }, (res) => {
              if (res.statusCode >= 200 && res.statusCode < 300) {
                process.exit(0);
              }
              if (res.statusCode === 404) {
                process.exit(0);
              }
              process.exit(1);
            });
            req.on('error', () => process.exit(1));
            req.end();
          NODE
          }
          trap cleanup_failed_import EXIT
          mkdir -p "${TEMP_ROOT}" "${TEMP_ROOT}/work/openstreetmap" "${TEMP_ROOT}/work/leveldb"
          chown -R 1000:1000 "${TEMP_ROOT}" 2>/dev/null || true
          ln -sfn "${PBF_ROOT}/${PBF_FILE}" "${TEMP_ROOT}/work/openstreetmap/${PBF_FILE}"
          export PELIAS_CONFIG=/work/pelias.json
          node <<'NODE'
          const fs = require('fs');
          const path = '/work/pelias.json';
          const raw = fs.readFileSync(path, 'utf8');
          const config = JSON.parse(raw);
          const extraTags = (process.env.PELIAS_EXTRA_TAGS || '')
            .split(',')
            .map((tag) => tag.trim())
            .filter(Boolean);
          const featureTags = extraTags.map((tag) => /[+~]/.test(tag) ? tag : `${tag}+name`);
          const venueTags = Array.from(new Set([...(config.imports?.openstreetmap?.layers?.venue?.tags || []), ...featureTags]));
          const adminLookupEnabled = (process.env.PELIAS_ADMIN_LOOKUP || 'true').toLowerCase() === 'true';
          const wofEnabled = (process.env.PELIAS_WOF_ENABLED || 'true').toLowerCase() === 'true';
          const wofRoot = process.env.PELIAS_WOF_ROOT || '/osm-temp/pelias/wof';
          config.imports = config.imports || {};
          config.imports.adminLookup = config.imports.adminLookup || {};
          config.imports.adminLookup.enabled = adminLookupEnabled;
          config.imports.openstreetmap = config.imports.openstreetmap || {};
          config.imports.openstreetmap.layers = config.imports.openstreetmap.layers || {};
          config.imports.openstreetmap.layers.venue = config.imports.openstreetmap.layers.venue || {};
          config.imports.openstreetmap.layers.venue.tags = venueTags;
          if (wofEnabled) {
            config.imports.whosonfirst = {
              datapath: wofRoot,
              sqlite: true,
              importPostcodes: false
            };
          } else {
            delete config.imports.whosonfirst;
          }
          fs.writeFileSync(path, JSON.stringify(config, null, 2));
          NODE
          npm start

          FAILED=0

          node <<'NODE'
          const fs = require('fs');
          const http = require('http');
          const ES_HOST = process.env.PELIAS_ELASTICSEARCH_HOST || 'pelias-elasticsearch.osm.svc.cluster.local';

          const indexName = fs.readFileSync('/work/index-name', 'utf8').trim();
          const aliasName = 'pelias';

          function request(method, path, body) {
            return new Promise((resolve, reject) => {
              const payload = body ? Buffer.from(JSON.stringify(body)) : null;
              const req = http.request({
                hostname: ES_HOST,
                port: 9200,
                path,
                method,
                headers: payload ? { 'Content-Type': 'application/json', 'Content-Length': payload.length } : {}
              }, (res) => {
                const chunks = [];
                res.on('data', (c) => chunks.push(c));
                res.on('end', () => {
                  const text = Buffer.concat(chunks).toString('utf8');
                  if (res.statusCode >= 200 && res.statusCode < 300) {
                    resolve(text ? JSON.parse(text) : {});
                    return;
                  }
                  if (res.statusCode === 404) {
                    resolve({ _notFound: true });
                    return;
                  }
                  reject(new Error(`HTTP ${res.statusCode}: ${text}`));
                });
              });
              req.on('error', reject);
              if (payload) req.write(payload);
              req.end();
            });
          }

          async function run() {
            const aliasInfo = await request('GET', `/_alias/${aliasName}`);
            const actions = [];
            if (!aliasInfo._notFound) {
              Object.keys(aliasInfo).forEach((idx) => {
                actions.push({ remove: { index: idx, alias: aliasName } });
              });
            }
            actions.push({ add: { index: indexName, alias: aliasName } });
            await request('POST', '/_aliases', { actions });
          }

          run().catch((err) => {
            console.error(err && err.stack ? err.stack : String(err));
            process.exit(1);
          });
          NODE

          trap - EXIT
          find "${TEMP_ROOT}/work" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        resources:
          requests:
            memory: "6Gi"
            cpu: "3"
          limits:
            memory: "24Gi"
            cpu: "12"
        volumeMounts:
        - name: planet
          mountPath: /planet
          readOnly: true
        - name: osm-temp
          mountPath: /osm-temp
        - name: pelias-config
          configMap:
            name: osm-pelias-config
        - name: work
          mountPath: /work
        - *id005
      volumes:
      - name: planet
        persistentVolumeClaim:
          claimName: planet
      - name: osm-temp
        persistentVolumeClaim:
          claimName: osm-temp
      - name: pelias-config
        configMap:
          name: osm-pelias-config
      - name: work
        emptyDir: {}
      - name: ca-certs
        emptyDir: {}
