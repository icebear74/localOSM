apiVersion: v1
kind: ConfigMap
metadata:
  name: nominatim-postgres-tuning
  namespace: osm
data:
  # Applied by nominatim-import-job.yaml. The import job requests 14Gi/8 CPUs
  # (limit 24Gi/14 CPUs, see k8s/nominatim-import-job.yaml), so these mirror
  # the main Postgres' import-time tuning at that scale.
  import-tuning.conf: |
    # SPEICHER
    shared_buffers = 48GB
    maintenance_work_mem = 24GB          # Sehr wichtig für die Index-Erstellung
    work_mem = 256MB
    wal_buffers = 64MB
    effective_cache_size = 80GB          # Signalisiert Postgres den freien Page Cache
    # EXTREME IMPORT-SPEEDUPS (Nur für Erstimport!)
    fsync = off                          # Schaltet Synchrongarantie ab -> riesiger Boost
    full_page_writes = off
    autovacuum = off
    synchronous_commit = off
    jit = off                            # Schaltet unnötiges Query-Kompilieren ab

    # WAL & CHECKPOINTS
    max_wal_size = 50GB
    checkpoint_timeout = 60min
    checkpoint_completion_target = 0.9

    # PARALLELISIERUNG & I/O
    random_page_cost = 1.1
    effective_io_concurrency = 200       # Perfekt für NVMe/SSD
    max_worker_processes = 16
    max_parallel_workers = 16
    max_parallel_workers_per_gather = 4
    max_parallel_maintenance_workers = 4 # Beschleunigt INDEX-Erstellung massiv

  # Applied by nominatim.yaml (the running Nominatim service). This deployment
  # requests 2Gi/2 CPUs (limit 8Gi/8 CPUs, see k8s/nominatim.yaml), so these
  # are sized for steady-state query serving rather than bulk import.
  runtime-tuning.conf: |
    shared_buffers = 16GB
    effective_cache_size = 16GB
    maintenance_work_mem = 2GB
    autovacuum_vacuum_cost_limit = 1000 # <--- Lockert die künstliche Bremse (Default ist 200)
    work_mem = 128MB
    random_page_cost = 1.1
    max_worker_processes = 4
    max_parallel_workers = 4
    max_parallel_workers_per_gather = 3
    autovacuum_max_workers = 4
    # Nominatim's embedded Postgres only listens on localhost by default.
    # The Photon import job (k8s/photon-import-job.yaml) builds its search
    # index straight from this running instance over the network (via the
    # nominatim-postgres ClusterIP Service in k8s/nominatim.yaml) instead of
    # downloading OSM data separately, so Postgres must accept TCP
    # connections from other pods too. Access itself is still restricted by
    # pg_hba.conf (see the photon role/host rule appended in nominatim.yaml).
    listen_addresses = '*'
