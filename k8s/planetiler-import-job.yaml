apiVersion: batch/v1
kind: Job
metadata:
  name: tileserver-import
  namespace: osm
  labels:
    app: tileserver-import
    osm-job-type: tileserver-import
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: tileserver-import
        osm-job-type: tileserver-import
    spec:
      serviceAccountName: planetiler-import
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      initContainers:
        - name: preflight
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo '=== Planetiler Tile Generation ==='
              test -f /planet/europa.osm.pbf
              mkdir -p /tileserver-gl /tileserver-gl-temp /tileserver-gl-temp/planetiler-work /tileserver-gl-temp/sources /tileserver-gl-temp/data/sources /tools /osm-status
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: planet
              mountPath: /planet
            - name: tileserver-gl
              mountPath: /tileserver-gl
            - name: tileserver-gl-temp
              mountPath: /tileserver-gl-temp
            - name: tools
              mountPath: /tools
            - name: osm-status
              mountPath: /osm-status
        - name: fetch-tools
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if [ ! -s /tools/planetiler.jar ]; then
                curl -fsSL -o /tools/planetiler.jar https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar
              fi
              if [ ! -x /tools/kubectl ]; then
                curl -fsSL -o /tools/kubectl https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl
                chmod 0755 /tools/kubectl
              fi
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: tools
              mountPath: /tools
        - name: fetch-sources
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /tileserver-gl-temp/sources /tileserver-gl-temp/planetiler-work /tileserver-gl-temp/data/sources
              if [ ! -s /tileserver-gl-temp/sources/lake_centerline.shp.zip ]; then
                wget -q -O /tileserver-gl-temp/sources/lake_centerline.shp.zip https://github.com/acalcutt/osm-lakelines/releases/latest/download/lake_centerline.shp.zip
              fi
              if [ ! -s /tileserver-gl-temp/sources/water-polygons-split-3857.zip ]; then
                wget -q -O /tileserver-gl-temp/sources/water-polygons-split-3857.zip https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip
              fi
              if [ ! -s /tileserver-gl-temp/sources/natural_earth_vector.sqlite.zip ]; then
                wget -q -O /tileserver-gl-temp/sources/natural_earth_vector.sqlite.zip https://naciscdn.org/naturalearth/packages/natural_earth_vector.sqlite.zip
              fi
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
          volumeMounts:
            - name: tileserver-gl-temp
              mountPath: /tileserver-gl-temp
      containers:
        - name: tileserver-import
          image: eclipse-temurin:22-jdk
          imagePullPolicy: Always
          workingDir: /tileserver-gl-temp
          securityContext:
            capabilities:
              add:
                - SYS_ADMIN
          resources:
            requests:
              memory: "16Gi"
              cpu: "5"
            limits:
              memory: "80Gi"
              cpu: "20"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              KUBECTL=/tools/kubectl
              PLANETILER_JAR=/tools/planetiler.jar
              SOURCE_OSM=/planet/europa.osm.pbf
              TEMP_DIR=/tileserver-gl-temp/planetiler-work
              TEMP_SOURCES=/tileserver-gl-temp/sources
              OUTPUT_NEW=/tileserver-gl/planet-NEW.mbtiles
              OUTPUT_ACTIVE=/tileserver-gl/planet.mbtiles
              SCALED_DOWN=0

              trim_mount() {
                mountpoint="$1"
                if command -v fstrim >/dev/null 2>&1; then
                  echo "[INFO] fstrim ${mountpoint}"
                  fstrim "${mountpoint}" || true
                else
                  echo "[INFO] fstrim not available for ${mountpoint}; continuing."
                fi
              }

              cleanup() {
                if [ "${SCALED_DOWN}" = "1" ]; then
                  echo "[INFO] Restoring deployment/tileserver-gl after premature exit"
                  "${KUBECTL}" scale deployment tileserver-gl --replicas=1 -n osm || true
                fi
                trim_mount /planet
                trim_mount /tileserver-gl-temp
                trim_mount /tileserver-gl
                trim_mount /osm-status
              }
              trap cleanup EXIT

              rm -f "${OUTPUT_NEW}"
              mkdir -p "${TEMP_DIR}" "${TEMP_SOURCES}" "data/sources"

              if [ -f /config/CustomProfile.java ]; then
                java -Xmx64g -cp "${PLANETILER_JAR}" /config/CustomProfile.java \
                  --osm-path="${SOURCE_OSM}" \
                  --tmpdir="${TEMP_DIR}" \
                  --output="${OUTPUT_NEW}" \
                  --force \
                  --download=true \
                  --fetch-wikidata \
                  --nodemap-type=sparsearray \
                  --nodemap-storage=ram \
                  --threads=18 \
                  --arguments=journal_mode=WAL,synchronous=OFF,mmap_size=268435456 \
                  --lake_centerlines_path="${TEMP_SOURCES}/lake_centerline.shp.zip" \
                  --water_polygons_path="${TEMP_SOURCES}/water-polygons-split-3857.zip" \
                  --natural_earth_path="${TEMP_SOURCES}/natural_earth_vector.sqlite.zip" \
                  --minzoom=0 \
                  --maxzoom=16 \
                  --extra-osm-tags=shop,building,construction,name,wheelchair,amenity,highway,landuse
              else
                java -Xmx64g -jar "${PLANETILER_JAR}" \
                  --osm-path="${SOURCE_OSM}" \
                  --tmpdir="${TEMP_DIR}" \
                  --output="${OUTPUT_NEW}" \
                  --force \
                  --download=true \
                  --fetch-wikidata \
                  --nodemap-type=sparsearray \
                  --nodemap-storage=ram \
                  --threads=18 \
                  --arguments=journal_mode=WAL,synchronous=OFF,mmap_size=268435456 \
                  --lake_centerlines_path="${TEMP_SOURCES}/lake_centerline.shp.zip" \
                  --water_polygons_path="${TEMP_SOURCES}/water-polygons-split-3857.zip" \
                  --natural_earth_path="${TEMP_SOURCES}/natural_earth_vector.sqlite.zip" \
                  --minzoom=0 \
                  --maxzoom=16 \
                  --extra-osm-tags=shop,building,construction,name,wheelchair,amenity,highway,landuse
              fi

              trim_mount /tileserver-gl
              trim_mount /tileserver-gl-temp

              "${KUBECTL}" scale deployment tileserver-gl --replicas=0 -n osm
              SCALED_DOWN=1

              rm -f "${OUTPUT_ACTIVE}"
              mv "${OUTPUT_NEW}" "${OUTPUT_ACTIVE}"

              trim_mount /tileserver-gl

              "${KUBECTL}" scale deployment tileserver-gl --replicas=1 -n osm
              SCALED_DOWN=0

              find "${TEMP_DIR}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

              trim_mount /tileserver-gl-temp
          volumeMounts:
            - name: planet
              mountPath: /planet
            - name: tileserver-gl
              mountPath: /tileserver-gl
            - name: tileserver-gl-temp
              mountPath: /tileserver-gl-temp
            - name: osm-status
              mountPath: /osm-status
            - name: tools
              mountPath: /tools
            - name: planetiler-profile-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: planet
          persistentVolumeClaim:
            claimName: planet
        - name: tileserver-gl-temp
          persistentVolumeClaim:
            claimName: tileserver-gl-temp
        - name: tileserver-gl
          persistentVolumeClaim:
            claimName: tileserver-gl
        - name: osm-status
          persistentVolumeClaim:
            claimName: osm-status
        - name: tools
          emptyDir: {}
        - name: planetiler-profile-config
          configMap:
            name: osm-tileserver-import-profile-config
            optional: true
